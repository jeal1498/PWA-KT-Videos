<style>

<filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence id="rtb" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter></defs>

<script>
const S='stroke="#2E2545" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"';
const GR='#10b77f';
// ---------- tiempos reales de la voz
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ\s]/g,' ').split(/\s+/).filter(Boolean);
const WN=WORDS.map(w=>norm(w[0])[0]||'');
function at(frag,off,nth){const f=norm(frag);let c=0;
 for(let i=0;i<=WN.length-f.length;i++){let ok=true;for(let j=0;j<f.length;j++)if(WN[i+j]!==f[j]){ok=false;break;}
  if(ok){if((nth||0)===c)return +(WORDS[i][1]+(off||0)).toFixed(2);c++;}}
 throw new Error('no encuentro: '+frag);}
// ---------- dibujos (centrados en 0,0)
function gear(r,n,fill){let p=[];const st=2*Math.PI/n;
 for(let i=0;i<n;i++){const a=i*st;[[-.28,r],[-.18,r+26],[.18,r+26],[.28,r]].forEach(([k,rr])=>{const aa=a+k*st;p.push((rr*Math.cos(aa)).toFixed(1)+' '+(rr*Math.sin(aa)).toFixed(1));});}
 return `<path d="M${p.join('L')}Z" fill="${fill}" ${S}/><circle r="${r*.38}" fill="#fff" ${S}/><circle r="10" fill="#2E2545"/>`;}
// ---------- dibujos nuevos del 008 (centrados en 0,0)
const T=(tx,y,fs,x,col,id)=>`<text ${id?'id="'+id+'"':''} x="${x||0}" y="${y||0}" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="${fs||40}" fill="${col||'#2E2545'}">${tx}</text>`;
const RED='#C0392B';
const D={neq:`<path d="M-60 -22H60M-60 28H60M-34 70L34 -70" fill="none" stroke="#2E2545" stroke-width="20" stroke-linecap="round"/>`};
const SM=(ic,sc,x,y)=>`<g transform="translate(${x||0} ${y||0}) scale(${sc})">${ic}</g>`;
const NB=()=>`<rect x="-260" y="-190" width="260" height="380" rx="14" fill="#fff" ${S}/><rect x="0" y="-190" width="260" height="380" rx="14" fill="#fff" ${S}/>`+[-110,-55,0,55,110].map(y=>`<path d="M-230 ${y}H-30M30 ${y}H230" fill="none" stroke="#C6BCE2" stroke-width="6" stroke-linecap="round"/>`).join('')+[-150,-90,-30,30,90,150].map(y=>`<circle cx="0" cy="${y}" r="10" fill="#2E2545"/>`).join('');
const PEN=(f)=>`<rect x="-80" y="-10" width="120" height="20" rx="4" fill="${f}" ${S} stroke-width="4"/><path d="M40 -10L72 0L40 10Z" fill="#F5E7D6" ${S} stroke-width="4"/><rect x="-96" y="-10" width="16" height="20" rx="4" fill="#F9DEE3" ${S} stroke-width="4"/>`;
const DOM=(p)=>`<rect x="-36" y="-90" width="72" height="180" rx="10" fill="#fff" ${S}/><path d="M-36 0H36" fill="none" ${S} stroke-width="4"/>`+(p?`<path d="M-12 -62L16 -44L-12 -26Z" fill="#2E2545"/>`:`<circle cy="-44" r="7" fill="#2E2545"/>`)+`<circle cy="40" r="7" fill="#2E2545"/><circle cy="62" r="7" fill="#2E2545"/>`;
const CLOUD=(sym)=>`<path d="M-80 40Q-110 40 -110 8Q-110 -24 -72 -24Q-66 -64 -22 -64Q22 -64 30 -32Q76 -32 76 8Q76 40 44 40Z" fill="#fff" ${S}/>`+sym;
const g=document.getElementById('gg');
const O=(id,inner)=>`<g id="${id}" class="o">${inner}</g>`;
g.innerHTML=[
 O('nb',NB()),O('nb2',NB()),O('nb3',NB()),
 O('pen',PEN('#C6BCE2')),
 O('tmr',`<rect x="-14" y="-96" width="28" height="22" rx="6" fill="#F5E7D6" ${S}/><circle r="70" fill="#fff" ${S}/><circle id="tw" r="35" fill="none" stroke="#F9DEE3" stroke-width="70" transform="rotate(-90)" stroke-dasharray="220 220" stroke-dashoffset="220"/><circle r="70" fill="none" ${S}/><path d="M0 -58V-66M0 58V66M-58 0H-66M58 0H66" fill="none" ${S} stroke-width="5"/>`),
 O('ply',`<circle r="70" fill="#F9DEE3" ${S}/><path d="M-22 -36L38 0L-22 36Z" fill="#2E2545" ${S}/>`),
 ...[0,1,2,3,4].map(i=>O('pc'+i,PEN(['#F9DEE3','#C6BCE2','#F5E7D6','#fff','#C6BCE2'][i]))),
 O('brd',`<path d="M-40 0Q-20 -30 20 -10Q50 -30 60 0Q40 30 0 24Q-24 30 -40 0Z" fill="#F5E7D6" ${S} stroke-width="5"/><path d="M60 0L84 -6L62 10Z" fill="#F9DEE3" ${S} stroke-width="4"/><circle cx="36" cy="-6" r="4" fill="#2E2545"/>`),
 O('win',`<path d="M-250 -200V200H250V-200Z" fill="#F5E7D6" ${S}/><rect x="-224" y="-174" width="448" height="348" rx="6" fill="#fff" ${S} stroke-width="5"/><path d="M-224 -174Q-150 -100 -224 80Z" fill="#F9DEE3" ${S} stroke-width="5"/><path d="M224 -174Q150 -100 224 80Z" fill="#F9DEE3" ${S} stroke-width="5"/>`+SM(NB(),.5,0,20)+SM(PEN('#C6BCE2'),.7,30,10)),
 O('bat',`<rect x="-90" y="-50" width="180" height="100" rx="16" fill="#fff" ${S}/><rect x="90" y="-18" width="22" height="36" rx="6" fill="#2E2545"/><rect id="bfl" x="-76" y="-36" width="100" height="72" rx="8" fill="#10b77f"/>`),
 ...[0,1,2,3,4,5].map(i=>O('dm'+i,DOM(i==0))),
 O('anc',`<circle cy="-80" r="16" fill="none" ${S} stroke-width="9"/><path d="M0 -64V90M-38 -38H38M-62 30Q-52 92 0 92Q52 92 62 30M-62 30L-80 48M62 30L80 48" fill="none" ${S} stroke-width="12"/>`),
 O('twr',`<path d="M-50 130L-30 -60H30L50 130Z" fill="#F5E7D6" ${S}/><rect x="-70" y="-130" width="140" height="80" rx="12" fill="#C6BCE2" ${S}/><rect x="-50" y="-114" width="100" height="40" rx="6" fill="#fff" ${S} stroke-width="4"/><path d="M0 -130V-170M-30 -170H30" fill="none" ${S}/>`),
 O('rdr',`<path d="M82 -110Q112 -90 82 -70M104 -128Q158 -90 104 -52" fill="none" ${S} stroke-width="7"/>`),
 ...[[1,305,540],[2,440,540],[3,575,540]].map(([i,x])=>O('dl'+i,`<path d="M800 400L${x} 480" fill="none" stroke="#2E2545" stroke-width="5" stroke-dasharray="12 12" stroke-linecap="round"/>`)),
 O('sofa',`<rect x="-120" y="-90" width="240" height="110" rx="34" fill="#F9DEE3" ${S}/><rect x="-140" y="-10" width="280" height="70" rx="22" fill="#C6BCE2" ${S}/><rect x="-176" y="-44" width="54" height="104" rx="20" fill="#F9DEE3" ${S}/><rect x="122" y="-44" width="54" height="104" rx="20" fill="#F9DEE3" ${S}/><path d="M-120 60V84M120 60V84" fill="none" ${S} stroke-width="10"/>`+T('zzz',-100,40,90)),
 O('bike',`<circle cx="-90" cy="40" r="52" fill="none" ${S}/><circle cx="90" cy="40" r="52" fill="none" ${S}/><g id="bsp"><path d="M-90 -12V92M-142 40H-38M90 -12V92M38 40H142" fill="none" ${S} stroke-width="4"/></g><path d="M-90 40L-20 -40L50 40M-20 -40H40L90 40M40 -40L34 -72M18 -72H52" fill="none" ${S} stroke-width="8"/><rect x="56" y="-14" width="16" height="44" rx="4" fill="${RED}" ${S} stroke-width="4"/>`),
 O('flj',`<rect x="-110" y="-44" width="220" height="88" rx="12" fill="#F5E7D6" ${S}/>`+T('Flojo',18,56)),
 O('flj2',`<rect x="-110" y="-44" width="220" height="88" rx="12" fill="#F5E7D6" ${S}/>`+T('Flojo',18,56)),
 O('neq',D.neq),
 O('cl1',CLOUD(`<path d="M-14 -30L6 -4H-8L12 22" fill="none" stroke="${RED}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`)),
 O('cl2',CLOUD(T('zzz',12,44,-14))),
 O('cl3',CLOUD(T('?',20,70,-14))),
 O('tdh',T('TDAH',0,150)),
 O('prh',`<circle r="170" fill="none" stroke="${RED}" stroke-width="22"/><path d="M-120 -120L120 120" fill="none" stroke="${RED}" stroke-width="22" stroke-linecap="round"/>`),
 O('cyc',`<path d="M-70 0A70 70 0 1 1 0 70" fill="none" ${S} stroke-width="12"/><path d="M-22 56L6 72L-6 98" fill="none" ${S} stroke-width="12"/>`),
 O('dr',`<rect x="-120" y="-190" width="240" height="380" rx="12" fill="#F5E7D6" ${S}/><rect x="-96" y="-166" width="192" height="356" rx="4" fill="#fff" ${S} stroke-width="4"/><g id="drp"><rect x="-96" y="-166" width="192" height="356" rx="4" fill="#C6BCE2" ${S} stroke-width="4"/><circle cx="64" cy="10" r="12" fill="#2E2545"/></g>`),
 ...[0,1,2].map(i=>O('sc'+(i+1),`<path d="M${270} ${288+i*66}q20 -14 40 0t40 0t40 0t40 0t40 0t40 0" fill="none" stroke="#2E2545" stroke-width="7" stroke-linecap="round"/>`)),
 O('shr',`<circle cx="-50" r="24" fill="#F9DEE3" ${S}/><circle cx="50" cy="-44" r="24" fill="#C6BCE2" ${S}/><circle cx="50" cy="44" r="24" fill="#F5E7D6" ${S}/><path d="M-30 -10L30 -34M-30 10L30 34" fill="none" ${S}/>`)
].join('');
// ---------- HTML: rótulos (≤4 palabras)
const H=document.getElementById('ht');
const st=(id,tx,x,y,fs,rot)=>H.insertAdjacentHTML('beforeend',`<div class="st" id="${id}" data-r="${rot||0}" style="left:${x}px;top:${y}px;${fs?'font-size:'+fs+'px':''}">${tx}</div>`);
const pl=(id,tx,x,y)=>H.insertAdjacentHTML('beforeend',`<div class="pl" id="${id}" style="left:${x}px;top:${y}px;width:auto;padding:0 28px;font-size:40px">${tx}</div>`);
st('sTd','Todavía no comienza',540,900,0,-2);
st('sFe','Funciones ejecutivas',540,900,0,2);
st('sNf','No siempre es flojera',540,900,0,-2);
st('sHb','Habilidades específicas',540,900,0,2);
st('sIq','Investigar qué ocurre',540,900,0,2);
pl('pIn','Iniciación',170,250);
pl('pVa','Valoración',540,170);
pl('sA','Abrir',200,300);pl('sL','Leer',540,300);pl('sC','Comenzar',880,300);
H.insertAdjacentHTML('beforeend','<div id="end" style="position:absolute;left:0;top:0;width:1080px;height:1000px;opacity:0"><div style="position:absolute;left:90px;top:330px;width:900px;text-align:center;font:700 70px/1.15 Outfit;color:#2E2545">Este video orienta y no diagnostica.</div><div class="st" style="left:540px;top:620px;opacity:1;font:700 40px/1 \'Maven Pro\';transform:translate(-50%,-50%)">psicologakarentrujillo.com.mx</div></div>');
// ============ ESPECIFICACIÓN (se define antes que las escenas) ============
// Lienzo 1080×1920 (9:16) · 30 fps · 60.6 s · audio = voz.mp3 (1.10x)
// Zonas seguras: gráficos dentro de x 60–1020 y página y 300–1250 (escenario); subtítulos en y 1290–1440 (nada de gráficos ahí).
// Micro-copy: máximo 4 palabras por momento visual (sin contar subtítulos). Bucle: nada se anima en los últimos 0.5 s.
const CFG={FPS:30,DUR:+(WORDS[WORDS.length-1][2]+.1).toFixed(2),W:1080,H:1920,
 POP:'back.out(1.35)',   // entradas: suaves, un solo rebote leve
 MOVE:'power3.inOut',    // desplazamientos
 OUT:'power2.in',        // salidas
 T:{pop:.5,move:.7,out:.3}};
gsap.set('.o',{opacity:0,transformOrigin:'50% 50%'});

gsap.set('.st,.big,.lb',{xPercent:-50,yPercent:-50});
gsap.set('.pl',{xPercent:-50,opacity:0});
document.querySelectorAll('.st').forEach(e=>gsap.set(e,{rotation:+e.dataset.r}));
const tl=gsap.timeline({paused:true});
const ST=(s,v)=>gsap.set(s,v);
const POP=(s,t,sc,x,y,d)=>{const f={scale:.3,opacity:0},v={scale:sc||1,opacity:1,duration:d||CFG.T.pop,ease:CFG.POP,immediateRender:false};if(x!==undefined){f.x=x;f.y=y;v.x=x;v.y=y;}tl.fromTo(s,f,v,t);};
const OUT=(s,t,d)=>tl.to(s,{opacity:0,scale:'*=0.7',duration:d||CFG.T.out,ease:CFG.OUT},t);
const MV=(s,t,v,d,e)=>tl.to(s,Object.assign({duration:d||CFG.T.move,ease:e||CFG.MOVE},v),t);
const FROM=(s,t,f,v,d)=>tl.fromTo(s,f,Object.assign({duration:d||CFG.T.pop,ease:CFG.POP,immediateRender:false},v),t);
const PLI=(s,t)=>tl.fromTo(s,{opacity:0,scale:.6},{opacity:1,scale:1,duration:.4,ease:CFG.POP,immediateRender:false},t);
const DIM=(s,t)=>tl.to(s,{opacity:.25,filter:'blur(3px)',duration:.4},t);
const SHAKE=(s,t,n,dx)=>tl.to(s,{x:'+='+(dx||10),duration:.07,yoyo:true,repeat:n||5,ease:'sine.inOut'},t);
const DRAW=(s,t,d)=>{const p=document.querySelector(s+' path'),L=p.getTotalLength();gsap.set(p,{strokeDasharray:L,strokeDashoffset:L});tl.set(s,{opacity:1,scale:1},t);tl.fromTo(p,{strokeDashoffset:L},{strokeDashoffset:0,duration:d||.35,ease:'power1.inOut',immediateRender:false},t);};
gsap.set('#tw',{strokeDashoffset:220});gsap.set('#bsp,#drp',{transformOrigin:'50% 50%'});gsap.set('#drp',{transformOrigin:'0% 50%'});
gsap.set('[id^=dm]',{transformOrigin:'50% 100%'});
const DX=i=>170+i*135, DY=560;
const TW=(t,v,d)=>tl.to('#tw',{strokeDashoffset:v,duration:d,ease:'none'},t);
// ============ ESCENA 1 · HOOK (0–4.4) ============
// Acción: un cuaderno abierto, en blanco, con un lápiz quieto encima; un temporizador llena su sector rosa (media hora).
// Persisten: cuaderno, lápiz y temporizador. Imagen final: cuaderno en blanco, lápiz quieto y temporizador a la mitad.
function escena1(){
 POP('#nb',0,1.4,540,480);POP('#pen',.25,1.4,605,480);ST('#pen',{rotation:-25});
 POP('#tmr',.2,.9,930,130);TW(.3,110,4.1);
 PLI('#sTd',at('todavia'));
}
// ============ ESCENA 2 · DESARROLLO (4.4–15.0) ============
// Acción: un botón ▶ (comenzar) se aprieta y no pasa nada; cinco lápices se acomodan, se revuelven y se vuelven a acomodar; un pájaro cruza
//   (distracción); el temporizador avanza; el cuaderno sigue en blanco; la escena queda dentro de una ventana (desde fuera) y una batería baja.
// Persisten: cuaderno, lápiz, temporizador. Imagen final: ventana con cuaderno en blanco y batería casi vacía.
function escena2(){
 OUT('#sTd',at('le dices')-.2);
 POP('#ply',at('le dices'),1.1,190,620);
 tl.to('#ply',{scale:.85,duration:.15,yoyo:true,repeat:1},at('comience'));
 SHAKE('#ply',at('comience',.4),3,8);
 const tM=at('mira la hoja');
 MV('#nb',tM,{y:400,scale:1.15},.6);MV('#pen',tM,{x:590,y:395,scale:1.15},.6);
 const row=i=>({x:540,y:670+i*32,rotation:0}),mess=[[-70,20,-30],[60,-10,25],[-30,50,-12],[90,30,40],[-60,70,15]];
 [0,1,2,3,4].forEach(i=>{
  FROM('#pc'+i,at('acomoda',-.5)+i*.08,{opacity:0,scale:.5,x:540+mess[i][0],y:690+mess[i][1],rotation:mess[i][2]},{opacity:1,scale:1,x:540+mess[i][0],y:690+mess[i][1],rotation:mess[i][2]},.4);
  MV('#pc'+i,at('acomoda')+i*.08,row(i),.5);
  MV('#pc'+i,at('lapices')+i*.06,{x:540+mess[(i+2)%5][0],y:690+mess[(i+2)%5][1],rotation:mess[(i+3)%5][2]},.4);
  MV('#pc'+i,at('a distraerse',-.3)+i*.06,row(i),.45);
 });
 const tB=at('distraerse');
 FROM('#brd',tB,{opacity:1,x:-100,y:130,scale:1},{x:1180,y:70,duration:1.1,ease:'none'},1.1);tl.set('#brd',{opacity:0},tB+1.15);
 const tP=at('pasan los');
 TW(tP,50,1.6);
 const tW=at('desde fuera')-.25;
 ['#nb','#pen','#tmr','#ply','#pc0','#pc1','#pc2','#pc3','#pc4'].forEach(s=>OUT(s,tW));
 POP('#win',at('desde fuera'),1.4,380,480);
 POP('#bat',at('no tiene'),1.4,820,470);
 tl.fromTo('#bfl',{attr:{width:100},fill:'#10b77f'},{attr:{width:12},fill:RED,duration:1.2,ease:'power1.in',immediateRender:false},at('ganas'));
}
// ============ ESCENA 3 · GIRO (15.0–32.7) ============
// Acción: el botón ▶ vuelve grande y se vuelve la primera ficha de una fila de dominó; una torre de control (funciones ejecutivas) emite
//   ondas y líneas hacia las fichas; un ancla cae sobre la primera ficha: no se mueve y las demás esperan.
// Persisten: botón ▶ (→ ficha 1). Imagen final: ficha 1 con el ancla, cinco fichas esperando.
function escena3(){
 const tO=at('pero comenzar')-.25;
 ['#win','#bat'].forEach(s=>OUT(s,tO));
 POP('#ply',at('comenzar',0,0)+.0,1.8,540,470);
 const tD=at('habilidades');
 OUT('#ply',tD-.1);
 [0,1,2,3,4,5].forEach(i=>POP('#dm'+i,tD+i*.08,1.4,DX(i),DY));
 PLI('#sHb',tD+.2);OUT('#sHb',at('iniciacion')-.25);
 POP('#pIn',at('iniciacion'),1);
 const tF=at('forma parte');
 POP('#twr',tF,1.3,800,235);PLI('#sFe',at('funciones'));
 FROM('#rdr',at('organizar'),{opacity:0,scale:.8,x:800,y:235},{opacity:1,scale:1.3,x:800,y:235},.4);
 [1,2,3].forEach(i=>PLI('#dl'+i,at('dirigir')+(i-1)*.18));
 const tA=at('cuando existen')-.2;
 ['#twr','#rdr','#dl1','#dl2','#dl3','#sFe'].forEach(s=>OUT(s,tA));
 FROM('#anc',at('dificultades'),{opacity:0,scale:1.4,x:DX(0),y:60},{opacity:1,scale:1.4,x:DX(0),y:430},.5);
 tl.to('#dm0',{rotation:-4,duration:.12,yoyo:true,repeat:5,ease:'sine.inOut'},at('empezar'));
 [1,2,3,4,5].forEach(i=>tl.to('#dm'+i,{opacity:.55,duration:.4},at('empezar')+i*.05));
}
// ============ ESCENA 4 · PROVOCACIÓN (32.7–41.5) ============
// Acción: un cuaderno recibe una etiqueta «Flojo» que luego se despega; a su lado un sofá (evitar esforzarse) y una bicicleta con freno
//   (dificultad para comenzar); aparece «≠» entre ambos.
// Persisten: nada. Imagen final: sofá, cuaderno y bicicleta con freno, y «≠».
function escena4(){
 const tN=at('y aqui')-.2;
 ['#dm0','#dm1','#dm2','#dm3','#dm4','#dm5','#anc','#pIn'].forEach(s=>OUT(s,tN));
 POP('#nb2',at('y aqui'),.62,540,540);
 POP('#flj',at('evitando'),1,540,540);ST('#flj',{rotation:-8});
 POP('#sofa',at('esforzarse'),.95,185,560);
 tl.to('#flj',{rotation:40,y:300,opacity:0,duration:.5,ease:CFG.OUT},at('o esta'));
 POP('#bike',at('dificultades',0,1),.95,875,560);
 tl.to('#bsp',{rotation:40,duration:.3,yoyo:true,repeat:3,ease:'sine.inOut'},at('comenzar',0,1));
