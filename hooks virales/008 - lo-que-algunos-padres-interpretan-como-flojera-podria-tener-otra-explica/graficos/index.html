add(`<div class="abs end" id="end"><div class="abs" style="left:150px;width:840px;top:820px;text-align:center;font:700 74px/1.15 Outfit">Este video orienta y no diagnostica.</div>
 <div class="abs pill" style="left:570px;top:1080px;transform:translateX(-50%);background:#fff;border:3px solid #2E2545;font-size:40px;padding:16px 30px">psicologakarentrujillo.com.mx</div></div>`);

// ============ LÍNEA DE TIEMPO ============
gsap.set('#world > *',{opacity:0});
const tl=gsap.timeline({paused:true});
const POP=(s,t,d)=>tl.fromTo(s,{opacity:0,y:40,scale:.94},{opacity:1,y:0,scale:1,duration:d||.45,ease:CFG.POP,immediateRender:false},t);
const OUT=(s,t)=>tl.to(s,{opacity:0,y:-60,duration:.3,ease:CFG.OUT},t);
const IN=(s,t)=>tl.fromTo(s,{opacity:0},{opacity:1,duration:.3,immediateRender:false},t);
const DIM=(s,t)=>tl.to(s,{opacity:.35,filter:'blur(2px)',duration:.4},t);
const LIT=(s,t)=>tl.to(s,{opacity:1,filter:'blur(0px)',duration:.4},t);
let cur=-1;
const STEP=(i,t)=>{if(cur>=0)tl.to('#st'+cur,{opacity:0,y:-20,duration:.25},t-.25);
 tl.fromTo('#st'+i,{opacity:0,y:20},{opacity:1,y:0,duration:.35,ease:CFG.POP,immediateRender:false},t);
 tl.to('#ticks',{y:-(i+1)*110,duration:.6,ease:CFG.MOVE},t-.25);
 tl.fromTo('#av',{scale:.8},{scale:1,duration:.35,ease:CFG.POP,immediateRender:false},t);cur=i;};
const TMR=(t,a,b,d)=>{const o={v:a};tl.fromTo(o,{v:a},{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{const m=Math.floor(o.v);document.getElementById('tmT').textContent=String(m).padStart(2,'0')+':'+String(Math.floor((o.v-m)*60)).padStart(2,'0');}},t);};
const TXT=(s,t,tx)=>tl.call(()=>{document.querySelector(s).innerHTML=tx;},null,t);

// ESCENA 1 · HOOK (0–4.4) — Acción: documento en blanco con cursor que parpadea; cronómetro corre a 30:00; «0 palabras».
// Imagen final: documento vacío, 30:00.
function escena1(){
 STEP(0,0);POP('#doc',0);POP('#tmr',.25);
 TMR(.3,0,30,3.4);
 tl.to('#car',{opacity:0,duration:.01,repeat:9,yoyo:true,repeatDelay:.38},0.4);
 tl.to('#wc',{scale:1.12,duration:.18,yoyo:true,repeat:1},at('sola palabra'));
}
// ESCENA 2 · DESARROLLO (4.4–15.0) — Acción: notificación «Ya, empieza la tarea»; registro con tres acciones (mira la hoja, acomoda
//  lápices, se distrae) que se repite; el cronómetro sigue a 41:00; etiqueta «Parece: sin ganas».
// Persisten: cronómetro. Imagen final: registro atenuado con la etiqueta encima y 41:00.
function escena2(){
 const t0=at('le dices');
 OUT('#doc',t0-.3);STEP(1,t0);
 tl.fromTo('#ntf',{opacity:0,y:-80},{opacity:1,y:0,duration:.45,ease:CFG.POP,immediateRender:false},t0);
 POP('#log',at('el mira',-.3));
 [['#r0','mira la hoja'],['#r1','acomoda'],['#r2','distraerse']].forEach(([s,w])=>tl.fromTo(s,{opacity:0,x:-40},{opacity:1,x:0,duration:.35,ease:CFG.POP,immediateRender:false},at(w)));
 const tP=at('pasan los');
 IN('#rep',tP);tl.to(['#r0','#r1','#r2'],{x:14,duration:.12,yoyo:true,repeat:3,stagger:.1},tP+.2);
 TXT('#r0 .tm',tP+.8,'4:41');TXT('#r1 .tm',tP+.9,'4:43');TXT('#r2 .tm',tP+1,'4:46');
 TMR(tP,30,41,1.6);
 const tD=at('desde fuera');
 DIM('#log',tD);DIM('#ntf',tD);
 tl.fromTo('#tag',{opacity:0,scale:1.4},{opacity:1,scale:1,duration:.4,ease:CFG.POP,immediateRender:false},at('parece'));
}
// ESCENA 3 · GIRO (15.0–32.7) — Acción: un centro «funciones ejecutivas» y tres habilidades que se conectan (Iniciar, Organizar, Dirigir)
//  con contador 1/3→3/3; cuando hay dificultades, «Iniciar» se pone en pausa y las otras quedan en espera.
// Imagen final: anillo con Iniciar en pausa (rojo) y las otras atenuadas.
function escena3(){
 const t0=at('pero comenzar');
 ['#ntf','#log','#tag','#tmr'].forEach(s=>OUT(s,t0-.3));STEP(2,t0);
 POP('#ctr',at('comenzar'));
 tl.fromTo('#ring',{opacity:0,scale:.8,transformOrigin:'50% 50%'},{opacity:1,scale:1,duration:.6,ease:CFG.MOVE,immediateRender:false},at('habilidades'));
 const tI=at('iniciacion');
 POP('#n0',tI);tl.to('#lk0',{opacity:1,duration:.3},tI+.2);TXT('#cnt',tI+.2,'1/3 habilidades');
 tl.to('#n0q',{backgroundColor:'#C6BCE2',duration:.3},tI+.3);
 tl.to('#ctr',{scale:1.08,duration:.25,yoyo:true,repeat:1},at('funciones'));
 POP('#n1',at('organizar'));tl.to('#lk1',{opacity:1,duration:.3},at('organizar',.2));TXT('#cnt',at('organizar',.2),'2/3 habilidades');
 POP('#n2',at('dirigir'));tl.to('#lk2',{opacity:1,duration:.3},at('dirigir',.2));TXT('#cnt',at('dirigir',.2),'3/3 habilidades');
 const tD=at('dificultades');
 tl.to('#n0q',{backgroundColor:'#F9DEE3',borderColor:'#C0392B',duration:.3},tD);
 tl.to('#n0q svg',{opacity:0,duration:.2},tD);IN('#n0p',tD+.1);
 tl.to('#lk0',{attr:{stroke:'#C0392B'},duration:.3},tD);
 TXT('#n0t',tD+.1,'en pausa');tl.to('#n0t',{backgroundColor:'#F9DEE3',color:'#C0392B',duration:.2},tD+.1);
 TXT('#n1t',at('habilidades',0,1),'en espera');TXT('#n2t',at('habilidades',0,1),'en espera');
 DIM('#n1',at('empezar'));DIM('#n2',at('empezar'));
 tl.to('#n0',{x:'+=10',duration:.07,yoyo:true,repeat:7},at('complicado'));
}
// ESCENA 4 · PROVOCACIÓN (32.7–41.5) — Acción: «¿Qué está pasando?»; dos tarjetas lado a lado (Opción A: evita esforzarse,
//  Opción B: le cuesta comenzar) con «¿Flojo?» sobre la A; «≠» entre las dos.
// Imagen final: A ≠ B.
function escena4(){
 const t0=at('y aqui');
 ['#ring','#lnk path','#ctr','#n0','#n1','#n2','#n0p'].forEach(s=>OUT(s,t0-.3));STEP(3,t0);
 POP('#q4',t0+.1);POP('#oa',at('pregunta'));POP('#ob',at('pregunta',.15));DIM('#oa',at('pregunta',.5));DIM('#ob',at('pregunta',.5));
 LIT('#oa',at('evitando'));tl.fromTo('#fl4',{opacity:0,scale:1.4},{opacity:1,scale:1,duration:.35,ease:CFG.POP,immediateRender:false},at('esforzarse'));
 LIT('#ob',at('dificultades',0,1));tl.to('#ob',{scale:1.05,duration:.2,yoyo:true,repeat:1},at('dificultades',0,1));
 tl.to('#fl4',{opacity:0,y:-40,rotation:-20,duration:.35,ease:CFG.OUT},at('comenzar',0,1));
 tl.fromTo('#neq',{opacity:0,scale:.3},{opacity:1,scale:1,duration:.4,ease:CFG.POP,immediateRender:false},at('no son'));
 tl.to('#neq',{scale:1.15,duration:.2,yoyo:true,repeat:1},at('misma'));
}
// ESCENA 5 · CIERRE (41.5–56.1) — Acción: tres «Motivo ?»; interruptor «TDAH» que no se enciende solo; semana con días marcados y
//  áreas afectadas; tarjeta «Valoración especializada» → Agendada; «Flojo» tachado; lista Abrir/Leer/Escribir con palomitas.
// Imagen final: lista con las tres palomitas.
function escena5(){
 const t0=at('esto puede');
 ['#q4','#oa','#ob','#neq'].forEach(s=>OUT(s,t0-.3));STEP(4,t0);
 [0,1,2].forEach(i=>POP('#m'+i,at('esto puede',.2)+i*.35));tl.to(['#m0','#m1','#m2'],{y:-14,duration:.2,yoyo:true,repeat:1,stagger:.12},at('motivos'));
 const tT=at('no significa');
 [0,1,2].forEach(i=>OUT('#m'+i,tT-.3));POP('#tg5',tT);
 tl.to('#knob',{x:40,duration:.3,yoyo:true,repeat:3,ease:'power1.inOut'},at('automaticamente'));
 const tC=at('si ocurre');
 OUT('#tg5',tC-.3);POP('#wk',tC);
 [0,1,2,3,4].forEach(i=>tl.to('#wd'+i,{backgroundColor:'#C6BCE2',duration:.15,onStart:()=>{},},at('constantemente')+i*.15));
 [0,1,2,3,4].forEach(i=>TXT('#wd'+i,at('constantemente')+i*.15,`<svg width="46" height="46" viewBox="-20 -20 40 40"><path d="M-10 0L-3 8L11 -8" fill="none" stroke="#2E2545" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`));
 IN('#af',at('afecta'));[0,1,2].forEach(i=>tl.fromTo('#af'+i,{y:20,opacity:0},{y:0,opacity:1,duration:.3,ease:CFG.POP,immediateRender:false},at('afecta')+i*.15));
 const tV=at('merece');
 OUT('#wk',tV-.3);OUT('#af',tV-.3);POP('#bk',tV);
 tl.to('#bkb',{scale:.94,duration:.12,yoyo:true,repeat:1},at('especializada'));
 tl.to('#bkb',{opacity:0,duration:.15},at('especializada',.25));IN('#bko',at('especializada',.25));
 const tF=at('antes de llamarlo');
 OUT('#bk',tF-.3);
 tl.fromTo('#fl5',{opacity:0,scale:1.4},{opacity:1,scale:1,duration:.4,ease:CFG.POP,immediateRender:false},tF);
 tl.to('#fl5x',{scaleX:1,duration:.3,ease:'power2.out'},at('flojo',.1));
 tl.to('#fl5',{opacity:0,y:-60,duration:.3,ease:CFG.OUT},at('conviene',-.1));
 POP('#cl',at('conviene'));
 [['investigar',0],['que necesita',-.15],['necesita',.15]].forEach(([w,o],i)=>{
  tl.to('#cc'+i,{backgroundColor:'#1E9E6A',borderColor:'#1E9E6A',duration:.15},at(w,o));TXT('#cc'+i,at(w,o),I.ok);});
}
// ESCENA 6 · CTA (56.1–60.6) — Acción: vuelve el documento del inicio y se llena de renglones escritos (12 palabras, 05:00);
//  «Compártelo con otra familia» con botón de enviar; aviso final y web (quietos los últimos 0.5 s).
// Persisten: documento (del gancho). Imagen final: aviso + web.
function escena6(){
 const t0=at('has vivido');
 OUT('#cl',t0-.3);tl.to('#st4',{opacity:0,duration:.3},t0-.3);
 tl.fromTo('#doc',{opacity:0,y:40},{opacity:1,y:0,duration:.45,ease:CFG.POP,immediateRender:false},t0);
 tl.set('#car',{opacity:0},t0);
 [0,1,2].forEach(i=>tl.fromTo('#wr'+i+' path',{strokeDasharray:2000,strokeDashoffset:2000},{strokeDashoffset:0,duration:.7,ease:'power1.inOut',immediateRender:false},t0+.3+i*.55));
 TXT('#wc',t0+.5,'4 palabras');TXT('#wc',t0+1.1,'9 palabras');TXT('#wc',t0+1.7,'12 palabras ✓');
 tl.to('#wc',{backgroundColor:'#C6BCE2',duration:.2},t0+1.7);
 POP('#cta',at('comparte'));tl.to('#ctb',{scale:.85,duration:.12,yoyo:true,repeat:1},at('comparte',.6));
 const tF=at('este video',-.2);
 ['#doc','#cta'].forEach(s=>OUT(s,tF-.1));
 tl.to(['#av','#tlTop','#tl','#ticks'],{opacity:.25,duration:.3},tF);
 tl.fromTo('#end',{opacity:0,scale:.96},{opacity:1,scale:1,duration:.5,ease:CFG.POP,immediateRender:false},tF+.15);
}
gsap.set('#wr0 path,#wr1 path,#wr2 path',{strokeDasharray:2000,strokeDashoffset:2000});
escena1();escena2();escena3();escena4();escena5();escena6();


// ============ SUBTÍTULO ARRIBA (palabras por venir borrosas; clave en recuadro de selección) ============
const KEYS=new Set(['media','palabra','comience','lapices','distraerse','ganas','habilidades','iniciacion','ejecutivas','empezar','esforzarse','comenzar','misma','motivos','tdah','constantemente','valoracion','flojo','investigar','comparte']);
(function(){const ph=[];let cur=[];const fl=()=>{if(cur.length){ph.push(cur);cur=[];}};
 WORDS.forEach((w,i)=>{cur.push({w:w[0],t:w[1],e:w[2]});const nx=WORDS[i+1];if(cur.length>=6||/[,.:?]$/.test(w[0])||(nx&&nx[1]-w[2]>.45))fl();});fl();
 const C=document.getElementById('caps');
 ph.forEach((p,i)=>{const d=document.createElement('div');d.className='ph abs';d.id='ph'+i;
  d.innerHTML=p.map((x,j)=>{const k=KEYS.has(norm(x.w)[0]);return `<span class="${k?'k':''}" id="p${i}w${j}">${k?'<i class="hl"></i>':''}${x.w}</span>`;}).join('');C.appendChild(d);
  const s0=p[0].t-.12,e0=i+1<ph.length?ph[i+1][0].t-.12:CFG.DUR-.6;
  tl.fromTo(d,{opacity:0,y:16},{opacity:1,y:0,duration:.18,immediateRender:false},s0);tl.to(d,{opacity:0,duration:.12},e0-.12);
  p.forEach((x,j)=>{tl.fromTo('#p'+i+'w'+j,{opacity:.28,filter:'blur(7px)'},{opacity:1,filter:'blur(0px)',duration:.2,immediateRender:false},x.t);
   if(KEYS.has(norm(x.w)[0]))tl.fromTo('#p'+i+'w'+j+' .hl',{opacity:0,scaleX:.6},{opacity:1,scaleX:1,duration:.22,ease:CFG.POP,immediateRender:false},x.t);});
  gsap.set(d.querySelectorAll('span'),{opacity:.28,filter:'blur(7px)'});});
})();
window.DUR=CFG.DUR;
window.seek=t=>{tl.time(Math.min(t,tl.duration()));};
</script></body></html>
