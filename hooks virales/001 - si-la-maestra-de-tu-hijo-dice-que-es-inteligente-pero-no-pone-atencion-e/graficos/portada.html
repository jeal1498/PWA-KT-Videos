<!doctype html><meta charset=utf-8><style>
@font-face{font-family:Outfit;src:url(Outfit-700-latin.woff2);font-weight:700}
@font-face{font-family:'Maven Pro';src:url(MavenPro-700-latin.woff2);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:linear-gradient(180deg,#C6BCE2 0%,#F9DEE3 100%);position:relative}
body::before{content:"";position:absolute;left:-160px;top:1280px;width:480px;height:480px;border-radius:50%;background:rgba(255,255,255,.28);box-shadow:1000px -1100px 0 -40px rgba(245,231,214,.45)}
.chip{position:absolute;left:60px;top:250px;background:#2E2545;color:#F5E7D6;font:700 32px/1 "Maven Pro";letter-spacing:.1em;text-transform:uppercase;padding:16px 28px;border-radius:40px}
h1{position:absolute;left:60px;right:60px;top:350px;font:700 112px/1.06 Outfit;color:#2E2545;letter-spacing:-.02em}
h1 span{display:inline-block;background:#F5E7D6;padding:2px 26px 16px;border:6px solid #2E2545;border-radius:26px;transform:rotate(-2deg);box-shadow:8px 9px 0 #fff;margin-top:18px}
.lb{position:absolute;font:700 46px/1 Outfit;color:#2E2545;background:#fff;border:5px solid #2E2545;border-radius:22px;padding:12px 24px;box-shadow:5px 6px 0 #F9DEE3}
svg{position:absolute;left:0;top:0}
</style>
<div class=chip>Lo que dice la maestra</div>
<h1>«Es inteligente,<br><span>pero no pone atención»</span></h1>
<svg width=1080 height=1920 viewBox="0 0 1080 1920"><defs><filter id=rough x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type=fractalNoise baseFrequency=.035 numOctaves=2 seed=3 /><feDisplacementMap in=SourceGraphic scale=5 /></filter></defs>
<g filter="url(#rough)" stroke="#2E2545" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
 <!-- bombilla encendida -->
 <g transform="translate(540 1010)">
  <path d="M0 -150V-122M-96 -112L-78 -94M96 -112L78 -94M-118 -30H-92M118 -30H92" fill="none"/>
  <circle cx="0" cy="-30" r="84" fill="#F5E7D6"/><path d="M-34 -20Q-17 -62 0 -20Q17 -62 34 -20" fill="none"/>
  <rect x="-36" y="46" width="72" height="30" rx="10" fill="#fff"/><rect x="-26" y="80" width="52" height="22" rx="10" fill="#fff"/>
 </g>
 <g id="gA" transform="translate(290 1330) rotate(12)"></g>
 <g id="gB" transform="translate(790 1330) rotate(-8)"></g>
 <path d="M490 1305H590M490 1355H590M512 1400L568 1260" fill="none" stroke-width="18"/>
</g></svg>
<div class=lb style="left:155px;top:1515px">Comprender</div>
<div class=lb style="left:680px;top:1515px">Atención</div>
<script>
function gear(r,n,fill){let p=[];const st=2*Math.PI/n;for(let i=0;i<n;i++){const a=i*st;[[-.28,r],[-.18,r+26],[.18,r+26],[.28,r]].forEach(([k,rr])=>{const aa=a+k*st;p.push((rr*Math.cos(aa)).toFixed(1)+' '+(rr*Math.sin(aa)).toFixed(1));});}
 return `<path d="M${p.join('L')}Z" fill="${fill}"/><circle r="${r*.38}" fill="#fff"/><circle r="10" fill="#2E2545"/>`;}
document.getElementById('gA').innerHTML=gear(120,10,'#F5E7D6');
document.getElementById('gB').innerHTML=gear(120,10,'#F9DEE3');
</script>
