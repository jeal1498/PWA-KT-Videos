<script>
const S='stroke="#2E2545" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"';
const GR='#10b77f';
// ---------- tiempos reales de la voz
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ\s]/g,' ').split(/\s+/).filter(Boolean);
const WN=WORDS.map(w=>norm(w[0])[0]||'');
function at(frag,off,nth){const f=norm(frag);let c=0;
 for(let i=0;i<=WN.length-f.length;i++){let ok=true;for(let j=0;j<f.length;j++)if(WN[i+j]!==f[j]){ok=false;break;}
  if(ok){if((nth||0)===c)return +(WORDS[i][1]+(off||0)).toFixed(2);c++;}}
 throw new Error('no encuentro: '+frag);}
// ---------- dibujos (centrados en 0,0)
function gear(r,n,fill){let p=[];const st=2*Math.PI/n;
 for(let i=0;i<n;i++){const a=i*st;[[-.28,r],[-.18,r+26],[.18,r+26],[.28,r]].forEach(([k,rr])=>{const aa=a+k*st;p.push((rr*Math.cos(aa)).toFixed(1)+' '+(rr*Math.sin(aa)).toFixed(1));});}
 return `<path d="M${p.join('L')}Z" fill="${fill}" ${S}/><circle r="${r*.38}" fill="#fff" ${S}/><circle r="10" fill="#2E2545"/>`;}
const D={
bulb:`<g id="bulbR"><path d="M0 -150V-122M-96 -112L-78 -94M96 -112L78 -94M-118 -30H-92M118 -30H92" fill="none" ${S}/></g><circle id="bulbC" cx="0" cy="-30" r="84" fill="#F5E7D6" ${S}/><path d="M-34 -20Q-17 -62 0 -20Q17 -62 34 -20" fill="none" ${S}/><rect x="-36" y="46" width="72" height="30" rx="10" fill="#fff" ${S}/><rect x="-26" y="80" width="52" height="22" rx="10" fill="#fff" ${S}/>`,
check:`<path d="M-34 0L-10 26L38 -30" fill="none" stroke="${GR}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>`,
head:`<path d="M-130 150Q-130 70 0 70Q130 70 130 150Z" fill="#F9DEE3" ${S}/><circle cx="0" cy="-20" r="72" fill="#F5E7D6" ${S}/>`,
note:`<rect x="-30" y="-36" width="60" height="72" rx="8" fill="#fff" ${S}/><path d="M-14 -14H14M-14 4H14M-14 22H4" fill="none" stroke="#C6BCE2" stroke-width="6" stroke-linecap="round"/>`,
lupa:`<circle cx="0" cy="0" r="74" fill="rgba(255,255,255,.4)" ${S}/><path d="M52 52L112 112" fill="none" stroke="#2E2545" stroke-width="20" stroke-linecap="round"/>`,
cross:`<path d="M-60 -60L60 60M60 -60L-60 60" fill="none" stroke="#C0392B" stroke-width="20" stroke-linecap="round"/>`,
neq:`<path d="M-60 -22H60M-60 28H60M-34 70L34 -70" fill="none" stroke="#2E2545" stroke-width="20" stroke-linecap="round"/>`,
heart:`<path d="M0 50C-100 -14 -80 -90 -36 -90C-14 -90 0 -70 0 -56C0 -70 14 -90 36 -90C80 -90 100 -14 0 50Z" fill="#F9DEE3" ${S}/>`
};
const sheet=(rows)=>`<rect x="-110" y="-140" width="220" height="280" rx="18" fill="#fff" ${S}/>`+rows.map((r,i)=>`<path d="M-70 ${-80+i*60}H${r?70:-6}" fill="none" stroke="${r?'#C6BCE2':'#C6BCE2'}" stroke-width="9" stroke-linecap="round" ${r?'':'stroke-dasharray="2 18"'}/>`).join('');
const piece=(col,tx)=>`<circle cx="125" cy="0" r="34" fill="${col}" ${S}/><rect x="-115" y="-115" width="230" height="230" rx="26" fill="${col}" ${S}/><text y="14" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="36" fill="#2E2545">${tx}</text>`;
const g=document.getElementById('gg');
const O=(id,inner)=>`<g id="${id}" class="o">${inner}</g>`;
g.innerHTML=[
 O('shA',sheet([1,1,1])),O('ckA0',D.check),O('ckA1',D.check),O('ckA2',D.check),
 O('shB',sheet([1,0,0])),
 O('clk',`<circle r="62" fill="#fff" ${S}/><path d="M0 -44V-52M0 44V52M-44 0H-52M44 0H52" ${S} stroke-width="5" fill="none"/><g id="clkH" class="r"><rect x="-4" y="-42" width="8" height="42" rx="4" fill="#2E2545"/></g><g id="clkH2" class="r"><rect x="-4" y="-28" width="8" height="28" rx="4" fill="#2E2545"/></g>`),
 O('hd',D.head),O('bu',D.bulb),
 O('d1',`<circle r="40" fill="#F9DEE3" ${S}/><path d="M-40 0H40" ${S} fill="none"/>`),
 O('d2',`<path d="M0 -46L14 -16L46 -12L22 10L28 44L0 28L-28 44L-22 10L-46 -12L-14 -16Z" fill="#F5E7D6" ${S}/>`),
 O('d3',`<path d="M-50 10L50 -30L20 40L6 12Z" fill="#fff" ${S}/>`),
 O('brg',`<rect x="-100" y="-15" width="200" height="30" rx="15" fill="#fff" ${S}/>`),`<rect id="bf" class="o" x="0" y="-9" width="188" height="18" rx="9" fill="#10b77f"/>`,
 O('gC',gear(48,8,'#fff')),O('gD',gear(48,8,'#fff')),
 O('cB',`<circle r="215" fill="#F9DEE3" ${S}/><text y="-120" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="54" fill="#2E2545">Distracción</text>`),
 O('cS',`<circle r="90" fill="#F5E7D6" ${S}/><text y="16" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="48" fill="#2E2545">TDAH</text>`),
 O('nt',D.note),
 `<path id="rd" d="M100 800C300 800 330 640 520 660S780 580 900 450" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" opacity="0"/>`,
 `<path id="rd2" d="M100 800C300 800 330 640 520 660S780 580 900 450" fill="none" ${S} stroke-dasharray="16 22" opacity="0"/>`,
 O('fl',`<path d="M0 60V-70" fill="none" ${S}/><path d="M0 -70L70 -48L0 -26Z" fill="#F9DEE3" ${S}/>`),O('rn',`<circle r="30" fill="#F9DEE3" ${S}/><circle cx="8" cy="-4" r="6" fill="#2E2545"/>`),
 O('gA',gear(110,10,'#F5E7D6')),O('gB',gear(110,10,'#F9DEE3')),O('nq',D.neq),
 O('wn',`<path d="M0 -130L130 90H-130Z" fill="#F5E7D6" ${S}/><path d="M0 -60V20" stroke="#2E2545" stroke-width="18" stroke-linecap="round"/><circle cy="58" r="11" fill="#2E2545"/>`),
 O('nq2',D.neq),O('hd2',D.head),
 O('tg',`<path d="M-190 -60H80L190 0L80 60H-190Z" fill="#fff" ${S}/><circle cx="140" cy="0" r="13" fill="#C6BCE2" ${S}/>`),
 O('bk',`<rect x="-110" y="-110" width="220" height="220" rx="30" fill="none" stroke="#2E2545" stroke-width="6" stroke-dasharray="14 16"/>`),
 O('bk2',`<rect x="-110" y="-110" width="220" height="220" rx="30" fill="#F9DEE3" ${S}/><text x="0" y="36" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="110" fill="#2E2545">?</text>`),
 O('lp',D.lupa),
 O('cl',`<rect x="-130" y="-170" width="260" height="340" rx="20" fill="#F5E7D6" ${S}/><rect x="-50" y="-190" width="100" height="42" rx="14" fill="#fff" ${S}/>`+[0,1,2].map(i=>`<rect x="-90" y="${-90+i*70}" width="44" height="44" rx="8" fill="#fff" ${S}/><path d="M-30 ${-68+i*70}H90" fill="none" stroke="#C6BCE2" stroke-width="10" stroke-linecap="round"/>`).join('')),
 O('rc0',D.check),O('rc1',D.check),O('rc2',D.check),
 O('rl',`<rect x="-250" y="-50" width="500" height="100" rx="16" fill="#F5E7D6" ${S}/>`+[...Array(11)].map((_,i)=>`<path d="M${-200+i*40} -50V${i%2?-18:-8}" fill="none" ${S} stroke-width="5"/>`).join('')),
 O('xx',D.cross),
 O('pz0',piece('#F5E7D6','Fortalezas')),O('pz1',piece('#F9DEE3','Dificultades')),O('pz2',piece('#fff','Apoyos')),

 O('hr',D.heart),
 O('cm',`<path d="M-150 -90H150Q180 -90 180 -60V60Q180 90 150 90H-30L-100 150L-90 90H-150Q-180 90 -180 60V-60Q-180 -90 -150 -90Z" fill="#fff" ${S}/><circle cx="-60" cy="0" r="14" fill="#2E2545"/><circle cx="0" cy="0" r="14" fill="#2E2545"/><circle cx="60" cy="0" r="14" fill="#2E2545"/>`)
].join('');
// ---------- HTML: rótulos
const H=document.getElementById('ht');
const st=(id,tx,x,y,fs,rot)=>H.insertAdjacentHTML('beforeend',`<div class="st" id="${id}" data-r="${rot||0}" style="left:${x}px;top:${y}px;${fs?'font-size:'+fs+'px':''}">${tx}</div>`);
const pl=(id,tx,x,y,ck)=>H.insertAdjacentHTML('beforeend',`<div class="pl" id="${id}" style="left:${x}px;top:${y}px">${tx}</div>`);
const lb=(id,tx,x,y,fs)=>H.insertAdjacentHTML('beforeend',`<div class="lb" id="${id}" style="left:${x}px;top:${y}px;${fs?'font-size:'+fs+'px':''}">${tx}</div>`);
st('sSa','Sabe',290,750,0,-3);st('sNt','No termina',790,750,0,3);
st('sSd','Se distrae',270,880,0,-2);st('sPi','Pierde instrucciones',540,880,0,2);st('sIn','Incompleto',790,880,0,-2);st('sNa','Sin avanzar',540,880,0,2);
st('sCo','Comprender',280,700,0,-3);st('sAt','Atención',800,700,0,3);
pl('p1','Memoria de trabajo',540,760);pl('p2','Organización',540,880);
st('sDe','Dificultades escolares',540,900,0,-2);st('sMm','Memoria de trabajo',330,760,40,0);st('sOr','Organización',750,760,40,0);
st('sDi','Distracción',290,560,0,-3);st('sTd','TDAH',790,560,0,3);
st('sNe','No se esfuerza',255,880,0,-6);document.getElementById('sNe').style.cssText+=';background:none;border:none;box-shadow:none;font-size:46px';
st('sDf','Dificultad por descubrir',540,900,0,2);
st('sEv','Evaluación',290,760,0,-2);
pl('f1','Fortalezas',740,370);pl('f2','Dificultades',740,530);
st('sMe','No se mide su valor',540,780,0,-2);


st('sEn','Entender y apoyar',540,780,0,-2);
st('sTi','¿Te identificas?',540,300,0,-2);
H.insertAdjacentHTML('beforeend','<div id="end" style="position:absolute;left:0;top:0;width:1080px;height:1000px;opacity:0"><div style="position:absolute;left:90px;top:330px;width:900px;text-align:center;font:700 70px/1.15 Outfit;color:#2E2545">Este video orienta y no diagnostica.</div><div class="st" style="left:540px;top:620px;opacity:1;font:700 40px/1 \'Maven Pro\';transform:translate(-50%,-50%)">psicologakarentrujillo.com.mx</div></div>');
// ============ ESPECIFICACIÓN (se define antes que las escenas) ============
// Lienzo 1080×1920 (9:16) · 30 fps · 60.1 s = 1803 cuadros · audio = voz.mp3 (1.10x)
// Zonas seguras: gráficos dentro de x 60–1020 y página y 300–1250 (escenario); subtítulos en y 1290–1440 (nada de gráficos ahí).
// Micro-copy: máximo 4 palabras por momento visual (sin contar subtítulos).
const CFG={FPS:30,DUR:60.1,W:1080,H:1920,
 POP:'back.out(1.35)',   // entradas: suaves, un solo rebote leve
 MOVE:'power3.inOut',    // desplazamientos
 OUT:'power2.in',        // salidas
 T:{pop:.5,move:.7,out:.3}};
gsap.set('.o',{opacity:0,transformOrigin:'50% 50%'});gsap.set('#bf',{transformOrigin:'0% 50%'});gsap.set('#clkH,#clkH2',{transformOrigin:'50% 100%'});
gsap.set('.st,.big,.lb',{xPercent:-50,yPercent:-50});
gsap.set('.pl',{xPercent:-50});
document.querySelectorAll('.st').forEach(e=>gsap.set(e,{rotation:+e.dataset.r}));
const tl=gsap.timeline({paused:true});
const ST=(s,v)=>gsap.set(s,v);
// utilidades: entrar (POP), salir (OUT), mover (MV)
const POP=(s,t,sc,x,y,d)=>{const f={scale:.3,opacity:0},v={scale:sc||1,opacity:1,duration:d||CFG.T.pop,ease:CFG.POP,immediateRender:false};if(x!==undefined){f.x=x;f.y=y;v.x=x;v.y=y;}tl.fromTo(s,f,v,t);};
const OUT=(s,t,d)=>tl.to(s,{opacity:0,scale:.7,duration:d||CFG.T.out,ease:CFG.OUT},t);
const MV=(s,t,v,d,e)=>tl.to(s,Object.assign({duration:d||CFG.T.move,ease:e||CFG.MOVE},v),t);
const FADE=(s,t,d)=>tl.to(s,{opacity:0,duration:d||CFG.T.out},t);
const FROM=(s,t,f,v,d)=>tl.fromTo(s,f,Object.assign({duration:d||CFG.T.pop,ease:CFG.POP,immediateRender:false},v),t);
const SPIN=(s,t,deg,d)=>tl.to(s,{rotation:'+='+deg,duration:d,ease:'none'},t);

// ============ ESCENA 1 · HOOK (0–5 s) ============
// Acción: sello de checks sobre la hoja de respuestas; al lado, una hoja incompleta con el reloj corriendo.
// Imagen final: dos hojas lado a lado, «Sabe» y «No termina».
function escena1(){
 POP('#shA',0.1,1,290,470);
 [0,1,2].forEach(i=>POP('#ckA'+i,[at('saber',-.1),at('todas',-.1),at('respuestas',-.1)][i],.55,226,390+i*60,.4));
 POP('#sSa',at('saber',.1),1);
 POP('#shB',at('aun'),1,790,470);
 POP('#clk',at('asi',.1),1,930,350);
 tl.to('#clkH',{rotation:1080,duration:5,ease:'none'},at('asi',.1));tl.to('#clkH2',{rotation:450,duration:5,ease:'none'},at('asi',.1));
 POP('#sNt',at('terminar',-.1),1);
}
// ============ ESCENA 2 · DESARROLLO (5.4–16.1) ============
// Acción: la hoja de respuestas se vuelve la tarea del niño; la bombilla se enciende (entiende), se apaga (se distrae)
//   mientras la tarea se desenfoca; la barra de avance se estanca; la instrucción sale volando; la barra se vuelve camino sin avanzar.
// Persisten: hoja (→ tarea), bombilla (→ engranaje). Imagen final: camino a medias hacia la meta.
function escena2(){
 const tD=at('la maestra');
 ['#ckA0','#ckA1','#ckA2','#shB','#clk','#clkH','#clkH2','#sSa','#sNt'].forEach(s=>OUT(s,tD-.15));
 MV('#shA',tD-.1,{x:790,y:430,scale:.9});
 POP('#hd',tD,1.05,270,560);
 POP('#bu',tD+.1,.85,270,300);gsap.set('#bulbC',{fill:'#F5E7D6'});
 tl.to('#bu',{scale:1.05,duration:.25,yoyo:true,repeat:1,ease:'sine.inOut'},at('entiende',-.1));
 const tSd=at('se distrae');
 tl.to('#bulbC',{fill:'#fff',duration:.3},tSd);tl.to('#bulbR',{opacity:0,duration:.3},tSd);
 tl.to('#shA',{filter:'blur(7px)',opacity:.7,duration:.35},tSd);             // enfoque: la tarea se desenfoca
 [['#d1',90,440],['#d2',480,430],['#d3',470,640]].forEach(([s,x,y],i)=>{POP(s,tSd+i*.12,1,x,y);tl.to(s,{y:y-24,duration:.9,yoyo:true,repeat:3,ease:'sine.inOut'},tSd+.6+i*.1);});
 POP('#sSd',tSd+.1,1);
 const tEm=at('empieza');
 ['#d1','#d2','#d3','#sSd'].forEach(s=>OUT(s,tEm-.15));
 tl.to('#shA',{filter:'blur(0px)',opacity:1,duration:.3},tEm);                // vuelve el enfoque
 POP('#brg',tEm,1,790,640);
 tl.set('#bf',{opacity:1,x:696,y:640},at('trabajos',-.2));
 FROM('#bf',at('trabajos',-.2),{scaleX:0},{scaleX:.35,ease:'power1.out'},1.2);
 const tPi=at('pierde');
 tl.set('#nt',{x:790,y:340,opacity:1,scale:1.5},tPi);
 tl.to('#nt',{y:60,x:620,rotation:40,opacity:0,duration:1.1,ease:CFG.OUT},at('instrucciones',-.1)); // la instrucción se va volando
 POP('#sPi',tPi+.1,1);OUT('#sPi',at('todo')-.15);
 const tIn=at('incompleto',-.2);
 tl.to('#bf',{scaleX:.3,duration:.4},tIn);POP('#sIn',tIn,1);
 // la barra se estira y se vuelve camino
 const tSa=at('sabe');
 ['#shA','#brg','#bf','#hd','#sIn'].forEach(s=>OUT(s,tSa-.2));
 MV('#bu',tSa-.2,{x:130,y:170,scale:.5});
 const PEL=document.getElementById('rd2');const PL=PEL.getTotalLength();
 tl.to('#rd',{opacity:.55,duration:.4},tSa);tl.to('#rd2',{opacity:1,duration:.4},tSa);
 POP('#fl',tSa+.2,1.05,900,450);
 const R={p:0};const place=()=>{const q=PEL.getPointAtLength(PL*R.p);gsap.set('#rn',{x:q.x,y:q.y});};
 POP('#rn',tSa,1,100,800);
 tl.to(R,{p:.42,duration:at('pero',0,1)-tSa+.3,ease:'power1.out',onUpdate:place},tSa+.1);
 POP('#sNa',at('consigue',0),1);
}
// ============ ESCENA 3 · GIRO (16.3–30.5) ============
// Acción: señal de alerta; la bombilla se transforma en el engranaje «comprender»; aparece el engranaje «atención» (no encajan, ≠);
//   memoria de trabajo y organización son engranajes más chicos (escala = parte de algo mayor); todo engrana; la bombilla se enciende arriba.
// Imagen final: cuatro engranajes acoplados, bombilla encendida y «Dificultades escolares».
function escena3(){
 const tAq=at('aqui');
 ['#rn','#fl','#sNa'].forEach(s=>OUT(s,tAq-.2));tl.to('#rd,#rd2',{opacity:0,duration:.3},tAq-.2);
 POP('#wn',at('importante',-.2),1,540,430);
 tl.to('#wn',{rotation:8,duration:.12,yoyo:true,repeat:3},at('importante',.2));
 const tCm=at('comprender');
 OUT('#wn',tCm-.25);
 MV('#bu',tCm-.2,{x:300,y:440,scale:.9},.5);                                   // la bombilla viaja…
 FROM('#gA',tCm,{opacity:0,scale:.3,x:300,y:440,rotation:0},{opacity:1,scale:1,x:300,y:440,rotation:90},1.2);   // …y se vuelve engranaje
 tl.to('#bu',{opacity:0,duration:.3},tCm+.1);
 POP('#sCo',at('explicacion'),1);
 const tMa=at('mantener');
 FROM('#gB',tMa,{opacity:0,scale:.3,x:780,y:440,rotation:0},{opacity:1,scale:1,x:780,y:440,rotation:-90},1.2);
 POP('#sAt',at('atencion',0),1);
 POP('#nq',at('no son'),.8,540,440);
 const tTb=at('tambien');
 OUT('#nq',tTb-.1);OUT('#sCo',tTb-.1);OUT('#sAt',tTb-.1);
 POP('#gC',at('memoria'),1,215,630);POP('#sMm',at('memoria',.1),1);
 POP('#gD',at('organizacion'),1,865,630);POP('#sOr',at('organizacion',.1),1);
 const tPe=at('por eso');
 [['#gA',415],['#gB',665],['#gC',330],['#gD',750]].forEach(([s,x])=>MV(s,tPe,{x},.7));  // se acoplan
 SPIN('#gA',tPe+.7,180,3.2);SPIN('#gB',tPe+.7,-180,3.2);SPIN('#gC',tPe+.7,-300,3.2);SPIN('#gD',tPe+.7,300,3.2);
 OUT('#sMm',tPe+1.4);OUT('#sOr',tPe+1.4);
 ST('#bu',{});FROM('#bu',at('buenas'),{opacity:0,scale:.3,x:540,y:150},{opacity:1,scale:.7,x:540,y:150});
 tl.set('#bulbC',{fill:'#F5E7D6'},at('buenas'));tl.set('#bulbR',{opacity:1},at('buenas'));
 POP('#sDe',at('dificultades'),1);
}
// ============ ESCENA 4 · PROVOCACIÓN (31–40) ============
// Acción: «distracción» es un círculo grande que contiene a «TDAH», un círculo mucho más chico (no toda distracción es TDAH).
//   Luego un niño lleva la etiqueta «No se esfuerza»; la etiqueta se despega y una lupa explora la caja «?» (dificultad por descubrir).
// Persiste: la bombilla pasa de los engranajes al niño. Imagen final: la lupa sobre la caja ya resuelta y el niño sin etiqueta.
function escena4(){
 const tCu=at('cuidado',-.1);
 ['#gA','#gB','#gC','#gD','#sDe'].forEach(s=>OUT(s,tCu-.2));
 POP('#wn',tCu,1,540,430);tl.to('#wn',{rotation:8,duration:.12,yoyo:true,repeat:3},tCu+.5);
 OUT('#wn',at('no toda')-.2);
 POP('#cB',at('distraccion',-.2),1,540,430);
 POP('#cS',at('significa',-.1),1,540,520);
 tl.to('#cS',{scale:1.12,duration:.25,yoyo:true,repeat:1},at('tdah'));
 const tAn=at('antes');
 ['#cB','#cS'].forEach(s=>OUT(s,tAn-.15));
 POP('#hd2',tAn,1,300,640);
 MV('#bu',tAn,{x:300,y:350,scale:.7},.8);                                       // la bombilla viaja al niño
 POP('#tg',at('esfuerza',-.5),1,300,880);POP('#sNe',at('esfuerza',-.4),1);
 const tIv=at('investigar',-.1);
 tl.to('#tg',{rotation:-35,y:'+=220',x:'-=160',opacity:0,duration:.8,ease:CFG.OUT},tIv);   // la etiqueta se despega y cae
 tl.to('#sNe',{rotation:-35,y:'+=220',x:'-=160',opacity:0,duration:.8,ease:CFG.OUT},tIv);
 ST('#bk',{x:760,y:520});ST('#bk2',{x:760,y:520});
 FROM('#bk',at('investigar',.2),{opacity:0,scale:.3},{opacity:1,scale:1});
 ST('#lp',{x:600,y:760});
 FROM('#lp',at('investigar',.3),{opacity:0,scale:.3},{opacity:1,scale:1});
 MV('#lp',at('esta'),{x:730,y:480},1.2);
 tl.to('#hd2',{filter:'blur(5px)',opacity:.6,duration:.4},at('esta'));         // enfoque: el niño se difumina, la caja manda
 FROM('#bk2',at('desempeno',-.2),{opacity:0,scale:.6},{opacity:1,scale:1});
 POP('#sDf',at('dificultando'),1);
}
// ============ ESCENA 5 · CIERRE (40–54) ============
// Acción: el niño se transforma en la hoja de evaluación; de ella salen «Fortalezas» y «Dificultades» (se encogen a las esquinas);
//   un niño junto a una regla que lo mide y una ✗ (no se mide su valor); las dos chips crecen y se vuelven piezas de rompecabezas; llega la pieza «Apoyos» y todo encaja.
// Imagen final: rompecabezas completo de tres piezas.
function escena5(){
 const tC=at('una evaluacion');
 ['#bk','#bk2','#lp','#sDf','#bu'].forEach(s=>OUT(s,tC-.2));
 tl.to('#hd2',{filter:'blur(0px)',x:290,y:500,scale:.8,opacity:0,duration:.6,ease:CFG.MOVE},tC-.1);   // el niño…
 FROM('#cl',tC,{opacity:0,scale:.6,x:290,y:480},{opacity:1,scale:1,x:290,y:480},.7);                // …se vuelve la evaluación
 POP('#sEv',tC+.2,1);
 [0,1,2].forEach(i=>POP('#rc'+i,at('fortalezas')+.1+i*.25,.5,222,412+i*70,.45));
 FROM('#f1',at('fortalezas'),{opacity:0,x:-120,scale:.6},{opacity:1,x:0,scale:1});
 FROM('#f2',at('dificultades',0,1),{opacity:0,x:-120,scale:.6},{opacity:1,x:0,scale:1});
 const tNo2=at('no se busca');
 ['#cl','#sEv','#rc0','#rc1','#rc2'].forEach(s=>OUT(s,tNo2-.2));
 // las chips se encogen y suben (persisten)
 tl.to('#f1',{x:-420,y:-330,scale:.5,duration:.6,ease:CFG.MOVE},tNo2-.2);
 tl.to('#f2',{x:-420,y:-270,scale:.5,duration:.6,ease:CFG.MOVE},tNo2-.2);
 POP('#hd',at('busca',-.1),.9,420,520);                                       // un niño…
 FROM('#rl',at('medir',-.1),{opacity:0,scale:.3,x:700,y:480,rotation:90},{opacity:1,scale:.9,x:700,y:480,rotation:90});  // …junto a una regla que lo mide
 POP('#xx',at('nino',-.2,1),1.1,700,480);
 POP('#sMe',at('nino',0,1),1);
 const tSb=at('se busca',0,1);
 ['#rl','#xx','#sMe','#hd'].forEach(s=>OUT(s,tSb-.15));
 // chips → piezas
 const tEn=at('entender',0,1);
 tl.to('#f1,#f2',{opacity:0,duration:.35},tEn);
 FROM('#pz0',tEn,{opacity:0,scale:.3,x:320,y:92},{opacity:1,scale:1,x:210,y:500},.8);
 FROM('#pz1',at('aprende'),{opacity:0,scale:.3,x:320,y:312},{opacity:1,scale:1,x:540,y:500},.8);
 POP('#pz2',at('apoyos'),1,870,500);
 ['#pz0','#pz1','#pz2'].forEach((s,i)=>tl.to(s,{y:'-=12',duration:.8,yoyo:true,repeat:3,ease:'sine.inOut'},at('necesita',.2+i*.15)));
 const tAy=at('ayuda',-.1);
 MV('#pz0',tAy,{x:300},.5);MV('#pz2',tAy,{x:780},.5);                         // todo encaja
 tl.to(['#pz0','#pz1','#pz2'],{scale:1.05,duration:.25,yoyo:true,repeat:1},tAy+.5);
}
// ============ ESCENA 6 · CTA (54–60) ============
// Acción: el rompecabezas completo se vuelve la burbuja de comentarios; corazón; aviso final.
// Imagen final: aviso «Este video orienta y no diagnostica.» + web.
function escena6(){
 const tTe=at('te');
 tl.to(['#pz0','#pz1','#pz2'],{y:140,scale:.5,opacity:0,duration:.5,ease:CFG.MOVE},tTe-.1);
 POP('#sTi',tTe+.1,1);
 FROM('#cm',tTe+.1,{opacity:0,scale:.4,x:540,y:640},{opacity:1,scale:1,x:540,y:640},.7);
 tl.to('#cm circle',{opacity:.3,duration:.25,yoyo:true,repeat:5},at('cuentalo')+.3);
 POP('#hr',at('quiza'),.9,830,420);
 const tF=at('necesite',-.4);
 ['#sTi','#cm','#hr'].forEach(s=>OUT(s,tF-.1));
 tl.fromTo('#end',{opacity:0,scale:.92,transformOrigin:'50% 50%'},{opacity:1,scale:1,duration:.5,ease:CFG.POP,immediateRender:false},tF+.35);
}
escena1();escena2();escena3();escena4();escena5();escena6();
// ============ SUBTÍTULOS (tiempos reales de words.json) ============
const KEYS=new Set(['inteligente','atencion','tdah','habilidades','diferentes','flojo','dificultades','evaluacion','fortalezas','apoyos','ayuda','entender','comprender','organizacion','memoria','diagnostico']);
(function(){const caps=[];let cur=[];
 const flush=()=>{if(cur.length){caps.push(cur);cur=[];}};
 WORDS.forEach((w,i)=>{cur.push({w:w[0],t:w[1],e:w[2]});const nx=WORDS[i+1];
  if(cur.length>=3||/[,.:?…]$/.test(w[0])||(nx&&nx[1]-w[2]>.45))flush();});flush();
 caps.forEach((c,i)=>{const d=document.createElement('div');d.className='cap';d.id='cap'+i;
  d.innerHTML=c.map((x,j)=>`<span class="pw${KEYS.has(norm(x.w)[0])?' k':''}" id="c${i}w${j}">${x.w}</span>`).join(' ');document.body.appendChild(d);
  const s0=c[0].t,e0=Math.min(i+1<caps.length?caps[i+1][0].t-.03:60.05,c[c.length-1].e+.9);
  tl.set('#cap'+i,{opacity:1},s0);tl.set('#cap'+i,{opacity:0},e0);
  c.forEach((x,j)=>tl.fromTo('#c'+i+'w'+j,{opacity:0,scale:.5,y:10,transformOrigin:'50% 80%'},{opacity:1,scale:1,y:0,duration:.25,ease:'power2.out',immediateRender:false},x.t));});
})();
window.DUR=CFG.DUR;
window.seek=t=>{tl.time(Math.min(t,tl.duration()));document.getElementById('rtb').setAttribute('seed',1+Math.floor(t*12)%7);};
</script></body></html>
