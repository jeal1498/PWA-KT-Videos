<script>
const S='stroke="#2E2545" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"';

const SEC={
 hook:[0.2,5,"Si la maestra de tu hijo dice que es inteligente, pero no pone atención, escucha esto."],
 des:[5,18,"Puede entender rápidamente las explicaciones, responder correctamente las preguntas y tener buenas ideas… Pero cuando llega el momento de trabajar, se distrae, pierde las instrucciones o deja sus actividades sin terminar. Y entonces aparece la pregunta: ¿cómo puede ser tan inteligente y tener tantas dificultades para concentrarse?"],
 giro:[18,34,"Porque tener la capacidad de comprender algo no significa necesariamente tener la misma facilidad para mantener la atención, organizarse y terminar una actividad. Son habilidades diferentes. Y algo muy importante: no todas las dificultades de atención significan que un niño tenga TDAH."],
 prov:[34,46,"Así que antes de llamarlo flojo, desobediente o distraído, vale la pena preguntarnos algo: ¿Y si no es que no quiere hacerlo, sino que existe una dificultad que todavía no hemos identificado?"],
 cie:[46,60,"Las dificultades de atención pueden tener distintas causas y necesitan investigarse. Una evaluación especializada puede ayudar a comprender qué está pasando y qué necesita ese niño. Porque no se trata de ponerle una etiqueta. Se trata de entenderlo y ayudarlo."]
};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ\s]/g,' ').split(/\s+/).filter(Boolean);
function at(sec,frag,off){const [a,b,tx]=SEC[sec];const w=norm(tx),f=norm(frag);
 for(let i=0;i<=w.length-f.length;i++){let ok=true;for(let j=0;j<f.length;j++)if(w[i+j]!==f[j]){ok=false;break;}
  if(ok)return +(a+(b-a)*i/w.length+(off||0)).toFixed(2);}
 throw new Error('no encuentro: '+frag);}
// ---------- dibujos (centrados en 0,0)
const D={
bulb:`<g id="bulbR" class="ry"><path d="M0 -150V-122M-96 -112L-78 -94M96 -112L78 -94M-118 -30H-92M118 -30H92" fill="none" ${S}/></g><circle id="bulbC" cx="0" cy="-30" r="84" fill="#F5E7D6" ${S}/><path d="M-34 -20Q-17 -62 0 -20Q17 -62 34 -20" fill="none" ${S}/><rect x="-36" y="46" width="72" height="30" rx="10" fill="#fff" ${S}/><rect x="-26" y="80" width="52" height="22" rx="10" fill="#fff" ${S}/>`,

eye:`<path d="M-84 0Q0 -72 84 0Q0 72 -84 0Z" fill="#fff" ${S}/><circle id="pup" cx="0" cy="0" r="26" fill="#2E2545"/>`,

lupa:`<circle cx="0" cy="0" r="74" fill="rgba(255,255,255,.4)" ${S}/><path d="M52 52L112 112" fill="none" stroke="#2E2545" stroke-width="20" stroke-linecap="round"/>`,
head:`<path d="M-130 150Q-130 70 0 70Q130 70 130 150Z" fill="#F9DEE3" ${S}/><circle cx="0" cy="-20" r="72" fill="#F5E7D6" ${S}/>`,
clip:`<rect x="-130" y="-170" width="260" height="340" rx="20" fill="#F5E7D6" ${S}/><rect x="-50" y="-190" width="100" height="42" rx="14" fill="#fff" ${S}/>`,
tag:`<path d="M-170 -70H70L170 0L70 70H-170Z" fill="#fff" ${S}/><circle cx="120" cy="0" r="14" fill="#C6BCE2" ${S}/>`,
heart:`<path d="M0 36C-70 -10 -56 -64 -26 -64C-10 -64 0 -50 0 -40C0 -50 10 -64 26 -64C56 -64 70 -10 0 36Z" fill="#F9DEE3" ${S}/>`,
cross:`<path d="M-60 -60L60 60M60 -60L-60 60" fill="none" stroke="#2E2545" stroke-width="18" stroke-linecap="round"/>`,
neq:`<path d="M-60 -22H60M-60 28H60M-34 70L34 -70" fill="none" stroke="#2E2545" stroke-width="20" stroke-linecap="round"/>`
};
function slice(i,n,r,fill){const a0=-Math.PI/2+i*2*Math.PI/n,a1=-Math.PI/2+(i+1)*2*Math.PI/n;
 return `<path d="M0 0L${(r*Math.cos(a0)).toFixed(1)} ${(r*Math.sin(a0)).toFixed(1)}A${r} ${r} 0 0 1 ${(r*Math.cos(a1)).toFixed(1)} ${(r*Math.sin(a1)).toFixed(1)}Z" fill="${fill}" ${S}/>`;}
const PIE=[0,1,2,3,4].map(i=>`<g id="sl${i}" class="o">${slice(i,5,190,i==0?'#F9DEE3':['','#fff','#F5E7D6','#fff','#F5E7D6'][i])}</g>`).join('');
const PQ=[1,2,3,4].map(i=>{const a=-Math.PI/2+(i+.5)*2*Math.PI/5;return `<text id="pq${i}" class="o" x="${(115*Math.cos(a)).toFixed(0)}" y="${(115*Math.sin(a)+17).toFixed(0)}" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="52" fill="#2E2545">?</text>`}).join('');
const PATH='M90 560L330 560C420 560 420 440 350 440C280 440 300 560 420 560L640 560C760 560 780 420 880 330';
const g=document.getElementById('gg');
const O=(id,inner)=>`<g id="${id}" class="o">${inner}</g>`;
g.innerHTML=[
 O('cA',`<rect x="-150" y="-150" width="300" height="300" rx="34" fill="#fff" ${S}/>`),O('nb',D.notebook),O('ey',D.eye),O('bu',D.bulb),O('ck0',D.check),
 O('ck1',D.check),O('ck2',D.check),O('ck3',D.check),
 `<path id="rd" d="${PATH}" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>`,
 `<path id="rd2" d="${PATH}" fill="none" ${S} stroke-width="6" stroke-dasharray="16 22" opacity="0"/>`,
 O('fl',D.flag),O('rn',`<circle r="26" fill="#F9DEE3" ${S}/>`),O('nt',D.note),
 O('qq',''),O('pb',`<rect x="-170" y="-28" width="340" height="56" rx="28" fill="#fff" ${S}/><rect x="-160" y="-19" width="120" height="38" rx="19" fill="#F9DEE3"/><path d="M170 -28V-96" fill="none" ${S}/><path d="M170 -96L220 -80L170 -64Z" fill="#F5E7D6" ${S}/>`),O('nt2',D.note),
 O('nq',D.neq),
 O('dv',`<path d="M0 -270V200" fill="none" ${S} stroke-dasharray="14 18"/>`),
 PIE+PQ,
 O('hd',D.head),O('sg',''),
 O('bk',`<rect x="-110" y="-110" width="220" height="220" rx="30" fill="none" stroke="#2E2545" stroke-width="6" stroke-dasharray="14 16"/>`),
 O('bk2',`<rect x="-110" y="-110" width="220" height="220" rx="30" fill="#F9DEE3" ${S}/><text x="0" y="36" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="110" fill="#2E2545">?</text>`),
 O('lp',D.lupa),
 O('nd',`<circle r="110" fill="#fff" ${S}/>`),
 O('c1',`<circle r="62" fill="#F5E7D6" ${S}/><text y="22" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="70" fill="#2E2545">?</text>`),
 O('c2',`<circle r="62" fill="#F5E7D6" ${S}/><text y="22" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="70" fill="#2E2545">?</text>`),
 O('c3',`<circle r="62" fill="#F5E7D6" ${S}/><text y="22" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="70" fill="#2E2545">?</text>`),
 `<path id="br1" class="dl" pathLength="1" d="M292 262L612 128" fill="none" ${S}/><path id="br2" class="dl" pathLength="1" d="M310 320L656 320" fill="none" ${S}/><path id="br3" class="dl" pathLength="1" d="M292 378L612 512" fill="none" ${S}/>`,
 O('cl',D.clip),
 [0,1,2].map(i=>`<g id="rw${i}" class="o"><rect x="-90" y="${-90+i*70}" width="44" height="44" rx="8" fill="#fff" ${S}/><path d="M-50 ${-68+i*70}H80" fill="none" stroke="#C6BCE2" stroke-width="10" stroke-linecap="round"/></g>`).join(''),
 O('rc0',D.check),O('rc1',D.check),O('rc2',D.check),
 O('tg',D.tag),O('xx',D.cross),
 O('hr',D.heart),O('ar',`<path d="M-90 0H90M40 -44L90 0L40 44" fill="none" ${S} stroke-width="12"/>`)
].join('');
// pills / stickers HTML
const H=document.getElementById('ht');
const st=(id,tx,x,y,fs,rot)=>H.insertAdjacentHTML('beforeend',`<div class="st" id="${id}" data-r="${rot||0}" style="left:${x}px;top:${y}px;${fs?'font-size:'+fs+'px':''}">${tx}</div>`);
const pl=(id,tx,x,y,ck)=>H.insertAdjacentHTML('beforeend',`<div class="pl" id="${id}" style="left:${x}px;top:${y}px">${ck?'<svg width="56" height="56" viewBox="-40 -40 80 80" style="position:absolute;left:28px;top:18px"><path d="M-34 0L-10 26L38 -30" fill="none" stroke="#10b77f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}${tx}</div>`);
st('sIn','Inteligente',270,560,0,-3);st('sSa','Sin atención',700,560,0,2.5);
pl('p1','Entiende',360,98,1);pl('p2','Responde',360,228,1);pl('p3','Tiene ideas',360,358,1);
st('sTr','Trabajar',490,630,0,-2);st('sDi','Se distrae',490,630,0,2);st('sPi','Pierde instrucciones',490,630,0,-2);st('sTe','Sin terminar',490,630,0,2);
H.insertAdjacentHTML('beforeend','<div class="big" id="qM" style="left:475px;top:350px">¿?</div>');
[0,1,2].forEach(i=>H.insertAdjacentHTML('beforeend',`<div class="slot" id="slot${i}" style="left:480px;top:${92+136*i}px"></div>`));
st('sCo','Comprender',190,560,0,-3);
pl('a1','Atención',480,92);pl('a2','Organizarse',480,228);pl('a3','Terminar',480,364);
st('sHd','Habilidades diferentes',490,655,0,-2);st('sNs','No siempre TDAH',490,626,0,-2);
st('sTd','TDAH',770,150,0,3);
st('sFl','Flojo',250,205,0,-8);st('sDe','Desobediente',730,240,0,6);st('sDs','Distraído',500,610,0,-3);
H.insertAdjacentHTML('beforeend','<div class="big" id="qH" style="left:490px;top:150px;font-size:200px">¿?</div>');
st('sDf','Dificultad sin identificar',490,630,46,-2);
st('sCa','Distintas causas',330,640,0,-2);st('sEv','Evaluación especializada',490,630,46,2);
st('sEt','Etiqueta',490,620,0,-3);st('sEn','Entenderlo',250,350,0,-3);st('sAy','Ayudarlo',735,350,0,3);
H.insertAdjacentHTML('beforeend','<div id="end" style="position:absolute;left:0;top:0;width:980px;height:700px;opacity:0"><div style="position:absolute;left:90px;top:210px;width:800px;text-align:center;font:700 64px/1.15 Outfit;color:#2E2545">Este video orienta y no diagnostica.</div><div class="st" style="left:490px;top:470px;opacity:1;font:700 40px/1 \'Maven Pro\';transform:translate(-50%,-50%)">psicologakarentrujillo.com.mx</div></div>');
// ---------- timeline
gsap.set('.o',{opacity:0,transformOrigin:'0 0'});gsap.set('.dl',{strokeDasharray:1,strokeDashoffset:1,opacity:0});
gsap.set('.st,.pl,.big',{xPercent:-50,yPercent:-50});
document.querySelectorAll('.st').forEach(e=>gsap.set(e,{rotation:+e.dataset.r}));
gsap.set('.pl',{xPercent:0,yPercent:0});
const tl=gsap.timeline({paused:true});
const E='elastic.out(1,.55)';
const ST=(s,v)=>gsap.set(s,v);
const POP=(s,t,sc,x,y,d)=>{const v={scale:sc||1,opacity:1,duration:d||.55,ease:E};if(x!==undefined){v.x=x;v.y=y;}tl.fromTo(s,Object.assign({scale:0,opacity:0},x!==undefined?{x:x,y:y}:{}),Object.assign(v,{immediateRender:false}),t);};
const OUT=(s,t,d)=>tl.to(s,{opacity:0,scale:.6,duration:d||.3,ease:'power2.in'},t);
const MV=(s,t,v,d,e)=>tl.to(s,Object.assign({duration:d||.7,ease:e||'power2.inOut'},v),t);
const FADE=(s,t,d)=>tl.to(s,{opacity:0,duration:d||.3},t);
// posiciones base
ST('#nb',{x:700,y:330});ST('#ey',{x:700,y:330});ST('#bu',{x:270,y:360});ST('#ck0',{x:340,y:260});
// ===== HOOK (0–5)
const tH0=0.15;
tl.set('#nb',{opacity:1,scale:1,x:700,y:340},0);
POP('#bu',0.2,1.05,270,350);gsap.set('#bulbC',{fill:'#fff'});gsap.set('#bulbR',{opacity:0});
tl.to('#bulbC',{fill:'#F5E7D6',duration:.3},at('hook','es inteligente',-.2));tl.fromTo('#bulbR',{opacity:0},{opacity:1,duration:.3,immediateRender:false},at('hook','es inteligente',-.2));
tl.to('#bu',{scale:1.25,duration:.25,yoyo:true,repeat:1,ease:'sine.inOut'},at('hook','es inteligente',-.2));POP('#ck0',at('hook','es inteligente',.55),.9,400,175);POP('#sIn',at('hook','es inteligente',.15),1);
POP('#ey',at('hook','no pone atención',-.2),1,700,330);
tl.to('#pup',{attr:{cx:56,cy:-16},duration:.8,ease:'power2.inOut'},at('hook','no pone atención',.5));
POP('#sSa',at('hook','no pone atención',.3),1);

// ===== DESARROLLO
const tD=at('des','Puede entender');
OUT('#nb',tD-.1);OUT('#ey',tD-.1);OUT('#sIn',tD-.1);OUT('#sSa',tD-.1);OUT('#ck0',tD-.1);
MV('#bu',tD-.05,{x:150,y:170,scale:.62},.7);
const tP=[at('des','entender'),at('des','responder'),at('des','tener buenas')];
['p1','p2','p3'].forEach((id,i)=>{tl.fromTo('#'+id,{opacity:0,x:80,scale:.6},{opacity:1,x:0,scale:1,duration:.55,ease:E,immediateRender:false},tP[i]);
 ST('#ck'+(i+1),{x:418,y:146+i*130,scale:.85});tl.set('#ck'+(i+1),{opacity:1},at('des','Pero cuando'));});

const tT=at('des','Pero cuando');
['p1','p2','p3'].forEach((id,i)=>{tl.to('#'+id,{opacity:0,x:-60,duration:.35,ease:'power2.in'},tT+i*.06);});
['#ck1','#ck2','#ck3'].forEach((s,i)=>MV(s,tT+.05,{x:270+i*70,y:80,scale:.5},.55));

[0,1,2].forEach(i=>{tl.fromTo('#slot'+i,{opacity:0,scale:.7},{opacity:1,scale:1,duration:.45,ease:E,immediateRender:false},tG+.5+i*.15);});

 tl.fromTo('#'+id,{opacity:0,x:160,scale:.7},{opacity:1,x:0,scale:1,duration:.55,ease:E,immediateRender:false},tt);});
