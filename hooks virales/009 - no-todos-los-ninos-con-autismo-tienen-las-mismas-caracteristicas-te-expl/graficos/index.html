 ${['Bebé','2 años','4 años','Hoy'].map((t,i)=>`<div id="hm${i}" style="position:absolute;left:${i*33.33}%;top:-15px;margin-left:-18px;opacity:0;text-align:center"><div style="width:36px;height:36px;border-radius:50%;background:${['#F5E7D6','#F9DEE3','#C6BCE2','#2E2545'][i]};border:3px solid #2E2545"></div><div style="font:700 24px/1 'Maven Pro';margin-top:14px;white-space:nowrap;transform:translateX(${i==3?'-20px':'0'})">${t}</div></div>`).join('')}</div></div>`);
add(`<div class="abs card" id="prf" style="left:210px;top:1060px;width:720px;height:330px;padding:28px 40px;opacity:0"><div class="lbl" style="margin-bottom:18px">Perfil · características y apoyos</div>
 ${[['Comunicación',.55],['Interacción',.4],['Intereses',.8],['Apoyos',.65]].map((b,i)=>`<div style="display:flex;align-items:center;gap:18px;height:62px;font:700 26px/1 'Maven Pro'"><span style="width:190px">${b[0]}</span><div style="flex:1;height:22px;border-radius:11px;background:#F3F0F8;overflow:hidden"><div id="pb${i}" data-w="${b[1]}" style="height:22px;width:0;border-radius:11px;background:${['#F9DEE3','#C6BCE2','#F5E7D6','#2E2545'][i]};border:2px solid #2E2545"></div></div></div>`).join('')}</div>`);
const GAL=[['#F9DEE3','#2E2545','#F5E7D6',2],['#E7E1F4','#8A6A4E','#E9C9A8',0],['#F5E7D6','#2E2545','#D9B08C',3],['#C6BCE2','#5B3B2A','#F5E7D6',1],['#F9DEE3','#8A6A4E','#E9C9A8',3],['#E7E1F4','#2E2545','#D9B08C',2],['#F5E7D6','#5B3B2A','#F5E7D6',0],['#C6BCE2','#2E2545','#E9C9A8',1],['#F9DEE3','#5B3B2A','#D9B08C',0]];
add(`<div class="abs" id="gal" style="left:230px;top:680px;width:680px;height:680px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px;opacity:0">${GAL.map((a,i)=>`<div id="g${i}" class="card" style="border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:0"><div style="width:120px;height:120px">${AVA(...a)}</div>${INF(34,'#8E86A6')}</div>`).join('')}</div>`);
add(`<div class="abs pill" id="acm" style="left:570px;top:1300px;transform:translateX(-50%);background:#2E2545;color:#fff;font-size:34px;display:flex;gap:14px;align-items:center;opacity:0"><span style="width:44px;height:44px;border-radius:50%;background:#1E9E6A;display:flex;align-items:center;justify-content:center">${J.ok}</span>Acompañar mejor</div>`);
// CTA: encuesta y compartir
add(`<div class="abs card" id="poll" style="left:210px;top:700px;width:720px;height:440px;padding:36px 40px;opacity:0"><div class="lbl">Encuesta</div><div class="ttl" style="font-size:48px;margin:14px 0 30px">¿Conocías esta diversidad?</div>
 <div id="o1" style="height:96px;border-radius:24px;border:3px solid #2E2545;display:flex;align-items:center;padding:0 28px;font:700 32px/1 'Maven Pro';margin-bottom:18px;gap:16px"><span id="o1c" class="ck" style="width:42px;height:42px"></span>Sí, ya lo sabía</div>
 <div id="o2" style="height:96px;border-radius:24px;border:3px solid #2E2545;display:flex;align-items:center;padding:0 28px;font:700 32px/1 'Maven Pro';gap:16px"><span id="o2c" class="ck" style="width:42px;height:42px"></span>Es nuevo para mí</div></div>`);
add(`<div class="abs pill" id="cta" style="left:570px;top:1220px;transform:translateX(-50%);background:#2E2545;color:#fff;font:700 36px/1 'Maven Pro';padding:16px 16px 16px 36px;display:flex;gap:22px;align-items:center;opacity:0">Compártelo con alguien<span id="ctb" style="width:72px;height:72px;border-radius:50%;background:#C6BCE2;display:flex;align-items:center;justify-content:center">${J.send}</span></div>`);
add(`<div class="abs end" id="end"><div class="abs" style="left:150px;width:840px;top:820px;text-align:center;font:700 74px/1.15 Outfit">Este video orienta y no diagnostica.</div>
 <div class="abs pill" style="left:570px;top:1080px;transform:translateX(-50%);background:#fff;border:3px solid #2E2545;font-size:34px">psicologakarentrujillo.com.mx</div></div>`);

// ============ LÍNEA DE TIEMPO ============
gsap.set('#world > *',{opacity:0});
const tl=gsap.timeline({paused:true});
const POP=(s,t,d)=>tl.fromTo(s,{opacity:0,y:40,scale:.94},{opacity:1,y:0,scale:1,duration:d||.45,ease:CFG.POP,immediateRender:false},t);
const OUT=(s,t)=>tl.to(s,{opacity:0,y:-60,duration:.3,ease:CFG.OUT},t);
const IN=(s,t)=>tl.fromTo(s,{opacity:0},{opacity:1,duration:.3,immediateRender:false},t);
const DIM=(s,t)=>tl.to(s,{opacity:.35,filter:'blur(2px)',duration:.4},t);
const LIT=(s,t)=>tl.to(s,{opacity:1,filter:'blur(0px)',duration:.4},t);
let cur=-1;
const STEP=(i,t)=>{if(cur>=0)tl.to('#st'+cur,{opacity:0,y:-20,duration:.25},t-.25);
 tl.fromTo('#st'+i,{opacity:0,y:20},{opacity:1,y:0,duration:.35,ease:CFG.POP,immediateRender:false},t);
 tl.to('#ticks',{y:-(i+1)*110,duration:.6,ease:CFG.MOVE},t-.25);
 tl.fromTo('#av',{scale:.8},{scale:1,duration:.35,ease:CFG.POP,immediateRender:false},t);cur=i;};
const TXT=(s,t,tx)=>tl.call(()=>{document.querySelector(s).innerHTML=tx;},null,t);
const ROW=(s,t)=>tl.fromTo(s,{opacity:0,x:-30},{opacity:1,x:0,duration:.35,ease:CFG.POP,immediateRender:false},t);

// ESCENA 1 · HOOK (0–6.0) — Acción: dos fichas de niño lado a lado, cada una con la etiqueta «∞ Autismo»; al decir «diferentes»
//  las fichas se separan un poco; aparece la llave «Mismo diagnóstico» que las une.
// Persisten: las dos fichas (hilo de todo el video). Imagen final: dos fichas unidas por «Mismo diagnóstico».
function escena1(){
 gsap.set('#brk',{y:-260});gsap.set('#same',{top:1090});
 STEP(0,0);POP('#pa',0);POP('#pb',.2);
 tl.fromTo(['#pab','#pbb'],{scale:.6,opacity:0},{scale:1,opacity:1,duration:.35,ease:CFG.POP,immediateRender:false,stagger:.12},at('autismo'));
 tl.to('#pa',{x:-12,rotation:-2,duration:.4,ease:CFG.MOVE},at('diferentes'));tl.to('#pb',{x:12,rotation:2,duration:.4,ease:CFG.MOVE},at('diferentes'));
 IN('#brk',at('explicacion',-.3));POP('#same',at('explicacion',-.2));
}
// ESCENA 2 · DESARROLLO (6.0–20.6) — Acción: a cada ficha se le suman rasgos: A «Habla mucho», B «Se comunica distinto»,
//  A «Busca compañía», B «Prefiere jugar solo»; al final ambas etiquetas «∞» se iluminan y la llave dice «Mismo espectro».
// Imagen final: dos fichas con dos rasgos distintos cada una y «Mismo espectro».
function escena2(){
 const t0=at('uno puede');
 STEP(1,t0);tl.to(['#pa','#pb'],{x:0,rotation:0,height:620,duration:.5,ease:CFG.MOVE},t0-.2);tl.to(['#brk','#same'],{opacity:0,duration:.25},t0-.2);tl.set('#brk',{y:0},t0+.2);tl.set('#same',{top:1350},t0+.2);
 ROW('#ta0',at('hablar'));DIM('#pb',at('hablar'));
 LIT('#pb',at('otro puede'));DIM('#pa',at('otro puede'));ROW('#tb0',at('comunicarse'));
 LIT('#pa',at('uno puede',0,1));DIM('#pb',at('uno puede',0,1));ROW('#ta1',at('buscar'));
 LIT('#pb',at('otro puede',0,1));DIM('#pa',at('otro puede',0,1));ROW('#tb1',at('preferir'));
 const tA=at('y ambos');LIT('#pa',tA);
 tl.to(['#pab','#pbb'],{backgroundColor:'#C6BCE2',scale:1.1,duration:.25,yoyo:true,repeat:1},at('espectro'));
 TXT('#sameT',tA,'Mismo espectro');IN('#brk',tA+.2);POP('#same',tA+.3);
}
// ESCENA 3 · GIRO (20.6–37.9) — Acción: «∞ Espectro»; un mezclador con cuatro características (comunicación social, interacción,
//  patrones de comportamiento, necesidades de apoyo) donde A y B quedan en puntos distintos; luego aparecen muchos puntos más.
// Persisten: A y B (como puntos). Imagen final: mezclador lleno de puntos, cada niño en un lugar distinto.
function escena3(){
 const t0=at('esto ocurre');
 ['#pa','#pb','#brk','#same'].forEach(s=>OUT(s,t0-.3));STEP(2,t0);
 tl.fromTo('#spc',{opacity:0,scale:.7},{opacity:1,scale:1,duration:.5,ease:CFG.POP,immediateRender:false},t0);tl.to('#spc',{scale:1.08,duration:.2,yoyo:true,repeat:1},at('espectro',0,1));
 tl.to('#spc',{opacity:0,scale:.8,duration:.3},at('sus caracteristicas',-.3));
 POP('#mix',at('sus caracteristicas'));
 const ts=[at('comunicacion'),at('interaccion'),at('patrones'),at('necesidades')];
 ts.forEach((t,i)=>{IN('#sl'+i,t-.1);tl.fromTo('#da'+i,{opacity:0,scale:.4},{opacity:1,scale:1,duration:.3,ease:CFG.POP,immediateRender:false},t+.1);
  tl.fromTo('#db'+i,{opacity:0,scale:.4},{opacity:1,scale:1,duration:.3,ease:CFG.POP,immediateRender:false},t+.3);});
 tl.fromTo('.xd',{opacity:0,scale:.3},{opacity:1,scale:1,duration:.25,stagger:.03,ease:CFG.POP,immediateRender:false},at('todos'));
 tl.to('#mix',{scale:1.03,duration:.25,yoyo:true,repeat:1},at('mismas'));
}
// ESCENA 4 · PROVOCACIÓN (37.9–49.9) — Acción: un molde punteado «Imagen esperada» con candados junto a la ficha real del Niño B;
//  «≈?» entre ambos; sus rasgos reales se marcan «sin ver» (3 sin ver); el molde se agrieta y cae.
// Persisten: Niño B. Imagen final: ficha del Niño B con «3 sin ver» y el molde roto fuera.
function escena4(){
 const t0=at('el problema');
 OUT('#mix',t0-.3);STEP(3,t0);
 POP('#real',t0+.1);POP('#mold',at('imagen'));
 tl.fromTo('#vs',{opacity:0,scale:.3},{opacity:1,scale:1,duration:.35,ease:CFG.POP,immediateRender:false},at('especifica'));
 const tA=at('pasar por alto');
 [0,1,2].forEach(i=>{tl.to('#rr'+i,{opacity:.4,duration:.3},tA+i*.35);IN('#ro'+i,tA+i*.35);});
 POP('#miss',at('importantes'));
 IN('#crk',at('coinciden'));tl.to('#mold',{x:'+=8',duration:.06,yoyo:true,repeat:5},at('coinciden'));
 tl.to('#mold',{y:300,rotation:-14,opacity:0,duration:.6,ease:CFG.OUT},at('expectativas'));OUT('#vs',at('expectativas'));
 tl.to('#real',{x:-200,duration:.6,ease:CFG.MOVE},at('expectativas',.3));
 [0,1,2].forEach(i=>tl.to('#rr'+i,{opacity:1,duration:.3},at('expectativas',.5)));tl.to(['#ro0','#ro1','#ro2','#miss'],{opacity:0,duration:.3},at('expectativas',.5));
}
// ESCENA 5 · CIERRE (49.9–65.6) — Acción: historia de desarrollo del Niño B (Bebé, 2, 4 años, Hoy) y su perfil con barras que se llenan
//  (evaluación); galería de nueve niños distintos con «∞» (no hay una sola apariencia); vuelven A y B con «Acompañar mejor».
// Persisten: Niño B → galería → A y B. Imagen final: A y B juntos con «Acompañar mejor».
function escena5(){
 const t0=at('cada nino');
 OUT('#real',t0-.3);STEP(4,t0);
 POP('#hist',t0);
 [0,1,2,3].forEach(i=>IN('#hm'+i,at('propia')+i*.3));tl.to('#hfl',{width:'100%',duration:1.2,ease:'power1.inOut'},at('propia'));
 POP('#prf',at('una evaluacion'));
 [0,1,2,3].forEach(i=>{const e=document.getElementById('pb'+i);tl.to(e,{width:(+e.dataset.w*100)+'%',duration:.6,ease:CFG.MOVE},at('explorar')+i*.3);});
 const tG=at('el autismo no');
 OUT('#hist',tG-.3);OUT('#prf',tG-.3);
 IN('#gal',tG);GAL.forEach((_,i)=>tl.fromTo('#g'+i,{opacity:0,scale:.6},{opacity:1,scale:1,duration:.3,ease:CFG.POP,immediateRender:false},tG+i*.12));
 const tC=at('y conocer');
 OUT('#gal',tC-.2);
 tl.fromTo('#pa',{opacity:0,y:40,x:0,scale:.94,filter:'blur(0px)'},{opacity:1,y:0,scale:1,duration:.45,ease:CFG.POP,immediateRender:false},tC);
 tl.fromTo('#pb',{opacity:0,y:40,x:0,scale:.94,filter:'blur(0px)'},{opacity:1,y:0,scale:1,duration:.45,ease:CFG.POP,immediateRender:false},tC+.15);
 POP('#acm',at('acompanar'));
}
// ESCENA 6 · CTA (65.6–71.6) — Acción: encuesta «¿Conocías esta diversidad?» con dos opciones (se marca una); «Compártelo con alguien»;
//  aviso final y web (quietos los últimos 0.5 s). Imagen final: aviso + web.
function escena6(){
 const t0=at('conocias');
 ['#pa','#pb','#acm'].forEach(s=>OUT(s,t0-.3));tl.to('#st4',{opacity:0,duration:.3},t0-.3);
 POP('#poll',t0);
 tl.to('#o2',{backgroundColor:'#E7E1F4',duration:.2},at('diversidad',0,1)+.2);tl.to('#o2c',{backgroundColor:'#1E9E6A',borderColor:'#1E9E6A',duration:.2},at('diversidad',0,1)+.2);TXT('#o2c',at('diversidad',0,1)+.2,J.ok);
 POP('#cta',at('comparte'));tl.to('#ctb',{scale:.85,duration:.12,yoyo:true,repeat:1},at('comparte',.6));
 const tF=at('comprender',-.2);
 ['#poll','#cta'].forEach(s=>OUT(s,tF-.1));
 tl.to(['#av','#tlTop','#tl','#ticks'],{opacity:.25,duration:.3},tF);
 tl.fromTo('#end',{opacity:0,scale:.96},{opacity:1,scale:1,duration:.5,ease:CFG.POP,immediateRender:false},tF+.15);
}
escena1();escena2();escena3();escena4();escena5();escena6();

// ============ SUBTÍTULO ARRIBA (palabras por venir borrosas; clave en recuadro de selección) ============
const KEYS=new Set(['diferentes','explicacion','hablar','comunicarse','compania','individuales','espectro','caracteristicas','apoyo','mismas','imagen','alto','expectativas','historia','evaluacion','apariencia','diversidad','acompanar','comparte']);
(function(){const ph=[];let cur=[];const fl=()=>{if(cur.length){ph.push(cur);cur=[];}};
 WORDS.forEach((w,i)=>{cur.push({w:w[0],t:w[1],e:w[2]});const nx=WORDS[i+1];if(cur.length>=6||/[,.:?]$/.test(w[0])||(nx&&nx[1]-w[2]>.45))fl();});fl();
 const C=document.getElementById('caps');
 ph.forEach((p,i)=>{const d=document.createElement('div');d.className='ph abs';d.id='ph'+i;
  d.innerHTML=p.map((x,j)=>{const k=KEYS.has(norm(x.w)[0]);return `<span class="${k?'k':''}" id="p${i}w${j}">${k?'<i class="hl"></i>':''}${x.w}</span>`;}).join('');C.appendChild(d);
  const s0=p[0].t-.12,e0=i+1<ph.length?ph[i+1][0].t-.12:CFG.DUR-.6;
  tl.fromTo(d,{opacity:0,y:16},{opacity:1,y:0,duration:.18,immediateRender:false},s0);tl.to(d,{opacity:0,duration:.12},e0-.12);
  p.forEach((x,j)=>{tl.fromTo('#p'+i+'w'+j,{opacity:.28,filter:'blur(7px)'},{opacity:1,filter:'blur(0px)',duration:.2,immediateRender:false},x.t);
   if(KEYS.has(norm(x.w)[0]))tl.fromTo('#p'+i+'w'+j+' .hl',{opacity:0,scaleX:.6},{opacity:1,scaleX:1,duration:.22,ease:CFG.POP,immediateRender:false},x.t);});
  gsap.set(d.querySelectorAll('span'),{opacity:.28,filter:'blur(7px)'});});
})();
window.DUR=CFG.DUR;
window.seek=t=>{tl.time(Math.min(t,tl.duration()));};
</script></body></html>
