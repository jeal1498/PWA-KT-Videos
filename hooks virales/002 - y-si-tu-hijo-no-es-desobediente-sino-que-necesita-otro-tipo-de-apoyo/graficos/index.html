<!doctype html><html><head><meta charset="utf-8"><title>001 gráficos</title>
<style>

</style></head><body>
<div id="stage">
<svg id="sv" width="1080" height="1000" viewBox="0 0 1080 1000"><defs>
<filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence id="rtb" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter></defs>
<g id="gg" filter="url(#rough)"></g></svg>
<div id="ht"></div></div>
<script src="gsap.min.js"></script>
<script src="words.js"></script>
<script>
const S='stroke="#2E2545" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"';
const GR='#10b77f';
// ---------- tiempos reales de la voz
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ\s]/g,' ').split(/\s+/).filter(Boolean);
const WN=WORDS.map(w=>norm(w[0])[0]||'');
function at(frag,off,nth){const f=norm(frag);let c=0;
 for(let i=0;i<=WN.length-f.length;i++){let ok=true;for(let j=0;j<f.length;j++)if(WN[i+j]!==f[j]){ok=false;break;}
  if(ok){if((nth||0)===c)return +(WORDS[i][1]+(off||0)).toFixed(2);c++;}}
 throw new Error('no encuentro: '+frag);}
// ---------- dibujos (centrados en 0,0)
function gear(r,n,fill){let p=[];const st=2*Math.PI/n;
 for(let i=0;i<n;i++){const a=i*st;[[-.28,r],[-.18,r+26],[.18,r+26],[.28,r]].forEach(([k,rr])=>{const aa=a+k*st;p.push((rr*Math.cos(aa)).toFixed(1)+' '+(rr*Math.sin(aa)).toFixed(1));});}
 return `<path d="M${p.join('L')}Z" fill="${fill}" ${S}/><circle r="${r*.38}" fill="#fff" ${S}/><circle r="10" fill="#2E2545"/>`;}
const D={
head:`<path d="M-130 150Q-130 70 0 70Q130 70 130 150Z" fill="#F9DEE3" ${S}/><circle cx="0" cy="-20" r="72" fill="#F5E7D6" ${S}/><circle cx="-24" cy="-26" r="7" fill="#2E2545"/><circle cx="24" cy="-26" r="7" fill="#2E2545"/><path d="M-18 10Q0 20 18 10" fill="none" ${S}/>`,
adult:`<path d="M-150 170Q-150 70 0 70Q150 70 150 170Z" fill="#C6BCE2" ${S}/><circle cx="0" cy="-30" r="84" fill="#F5E7D6" ${S}/><path d="M-84 -40Q-80 -120 0 -116Q80 -120 84 -40Q60 -90 0 -86Q-60 -90 -84 -40Z" fill="#2E2545"/><circle cx="-28" cy="-30" r="7" fill="#2E2545"/><circle cx="28" cy="-30" r="7" fill="#2E2545"/><path d="M-22 6Q0 20 22 6" fill="none" ${S}/>`,
lupa:`<circle cx="0" cy="0" r="74" fill="rgba(255,255,255,.4)" ${S}/><path d="M52 52L112 112" fill="none" stroke="#2E2545" stroke-width="20" stroke-linecap="round"/>`,
check:`<path d="M-34 0L-10 26L38 -30" fill="none" stroke="${GR}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>`,
heart:`<path d="M0 50C-100 -14 -80 -90 -36 -90C-14 -90 0 -70 0 -56C0 -70 14 -90 36 -90C80 -90 100 -14 0 50Z" fill="#F9DEE3" ${S}/>`
};
const T=(tx,y,fs)=>`<text y="${y||0}" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="${fs||40}" fill="#2E2545">${tx}</text>`;
const bubble=(tx)=>`<path d="M-100 -60H100Q120 -60 120 -40V30Q120 50 100 50H-10L-50 95L-46 50H-100Q-120 50 -120 30V-40Q-120 -60 -100 -60Z" fill="#fff" ${S}/>`+T(tx,10,48);
const ICON={
 jug:`<rect x="-118" y="-30" width="52" height="52" rx="8" fill="#F9DEE3" ${S}/><circle cx="-62" cy="12" r="24" fill="#C6BCE2" ${S}/>`,
 zap:`<path d="M-120 22V-26Q-104 -34 -92 -18L-66 0Q-48 6 -46 22Z" fill="#F5E7D6" ${S}/><path d="M-120 22H-46" fill="none" ${S}/>`,
 moc:`<rect x="-114" y="-30" width="56" height="62" rx="14" fill="#C6BCE2" ${S}/><path d="M-114 -4H-58M-100 -30Q-86 -50 -72 -30" fill="none" ${S}/>`
};
const card=(ic,tx)=>`<rect x="-140" y="-80" width="280" height="160" rx="22" fill="#fff" ${S}/>${ic}`+`<text x="46" y="13" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="34" fill="#2E2545">${tx}</text>`;
const zig=`<path d="M0 -80L24 -40L70 -56L54 -12L96 6L54 26L66 70L22 50L0 88L-22 50L-66 70L-54 26L-96 6L-54 -12L-70 -56L-24 -40Z" fill="#F9DEE3" ${S}/>`+T('!',26,72);
const badge=n=>`<circle r="34" fill="#2E2545"/>`+`<text y="14" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="40" fill="#fff">${n}</text>`;
const g=document.getElementById('gg');
const O=(id,inner)=>`<g id="${id}" class="o">${inner}</g>`;
g.innerHTML=[
 O('lim',`<path d="M-400 -40H400M-400 10H400" fill="none" ${S} stroke-width="8"/>`+[...Array(9)].map((_,i)=>`<rect x="${-412+i*100}" y="-80" width="24" height="120" rx="6" fill="#F5E7D6" ${S}/>`).join('')),
 O('pth',`<path d="M-430 0H330" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round"/><path d="M-430 0H330" fill="none" ${S} stroke-dasharray="16 22"/>`),
 O('flg',`<path d="M0 60V-70" fill="none" ${S}/><path d="M0 -70L70 -48L0 -26Z" fill="#F9DEE3" ${S}/>`),
 O('rnd',`<circle r="210" fill="none" stroke="#fff" stroke-width="34"/><circle r="210" fill="none" ${S} stroke-dasharray="16 22"/><path d="M196 -40L210 0L236 -34" fill="none" ${S} stroke-width="8"/>`),
 O('hd',D.head),O('ad',D.adult),
 O('k1',D.head),O('k2',D.head),O('k3',D.head),
 O('sp1',bubble('¡Hijo!')),O('sp2',bubble('¡Oye!')),O('sp3',bubble('¡Ya!')),
 O('bl',`<circle r="46" fill="#F9DEE3" ${S}/><path d="M-46 0Q0 -30 46 0M0 -46Q-20 0 0 46" fill="none" ${S}/>`),
 O('z1',zig),O('z2',zig),
 O('cld',`<path d="M-140 30Q-170 30 -170 0Q-170 -36 -130 -40Q-120 -90 -60 -84Q-30 -120 20 -100Q70 -120 100 -76Q160 -80 166 -26Q190 0 160 30Z" fill="#fff" ${S}/><path d="M-90 60L-104 92M-20 60L-34 92M50 60L36 92M120 60L106 92" fill="none" stroke="#C6BCE2" stroke-width="10" stroke-linecap="round"/>`),
 O('c1',card(ICON.jug,'Juguetes')),O('c2',card(ICON.zap,'Zapatos')),O('c3',card(ICON.moc,'Mochila')),
 O('n1',badge(1)),O('n2',badge(2)),O('n3',badge(3)),
 O('gA',gear(95,10,'#F5E7D6')),O('gB',gear(95,10,'#F9DEE3')),O('gC',gear(95,10,'#fff')),
 O('tg',`<path d="M-200 -56H90L200 0L90 56H-200Z" fill="#fff" ${S}/><circle cx="150" cy="0" r="12" fill="#C6BCE2" ${S}/>`+`<text x="-40" y="14" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="44" fill="#2E2545">Desobediente</text>`),
 O('qm',`<circle r="70" fill="#F9DEE3" ${S}/>`+T('?',36,100)),
 O('hr',D.heart),
 O('lp',D.lupa),
 O('cl',`<rect x="-130" y="-170" width="260" height="340" rx="20" fill="#F5E7D6" ${S}/><rect x="-50" y="-190" width="100" height="42" rx="14" fill="#fff" ${S}/>`+[0,1,2].map(i=>`<rect x="-90" y="${-90+i*70}" width="44" height="44" rx="8" fill="#fff" ${S}/><path d="M-30 ${-68+i*70}H90" fill="none" stroke="#C6BCE2" stroke-width="10" stroke-linecap="round"/>`).join('')),
 O('rc0',D.check),O('rc1',D.check),O('rc2',D.check),
 O('rn',`<circle r="30" fill="#F9DEE3" ${S}/><circle cx="8" cy="-4" r="6" fill="#2E2545"/>`),
 O('hs',`<path d="M-150 -10L0 -140L150 -10" fill="none" ${S} stroke-width="8"/><path d="M-120 -30V140H120V-30" fill="#F5E7D6" ${S}/><rect x="-30" y="50" width="60" height="90" rx="10" fill="#C6BCE2" ${S}/><rect x="-96" y="-4" width="50" height="50" rx="8" fill="#fff" ${S}/><rect x="46" y="-4" width="50" height="50" rx="8" fill="#fff" ${S}/>`),
 O('cm',`<path d="M-150 -90H150Q180 -90 180 -60V60Q180 90 150 90H-30L-100 150L-90 90H-150Q-180 90 -180 60V-60Q-180 -90 -150 -90Z" fill="#fff" ${S}/><circle cx="-60" cy="0" r="14" fill="#2E2545"/><circle cx="0" cy="0" r="14" fill="#2E2545"/><circle cx="60" cy="0" r="14" fill="#2E2545"/>`)
].join('');
// ---------- HTML: rótulos (≤4 palabras)
const H=document.getElementById('ht');
const st=(id,tx,x,y,fs,rot)=>H.insertAdjacentHTML('beforeend',`<div class="st" id="${id}" data-r="${rot||0}" style="left:${x}px;top:${y}px;${fs?'font-size:'+fs+'px':''}">${tx}</div>`);
const pl=(id,tx,x,y)=>H.insertAdjacentHTML('beforeend',`<div class="pl" id="${id}" style="left:${x}px;top:${y}px;width:auto;padding:0 28px;font-size:38px">${tx}</div>`);
st('sNq','¿No quiere escuchar?',540,900,0,-2);
st('sDi','Otra discusión más',540,900,0,2);
st('sNp','¿No quiere o no puede?',540,900,0,-2);
pl('lA','Atención',290,580);pl('lB','Memoria de trabajo',540,250);pl('lC','Autorregulación',790,580);
st('sSm','A su manera',540,910,0,2);
st('sLi','Con límites',540,900,0,-2);
st('sVo','No todo es voluntad',540,900,0,2);
st('sAc','Otra forma de acompañar',540,900,0,-2);
st('sEv','Evaluación',540,770,0,-2);
st('sCa','Comprender cambia el apoyo',540,880,0,2);
st('sMl','Mismo lugar',540,800,0,-2);
st('sFa','¿Te resulta familiar?',540,860,0,-2);
H.insertAdjacentHTML('beforeend','<div id="end" style="position:absolute;left:0;top:0;width:1080px;height:1000px;opacity:0"><div style="position:absolute;left:90px;top:330px;width:900px;text-align:center;font:700 70px/1.15 Outfit;color:#2E2545">Este video orienta y no diagnostica.</div><div class="st" style="left:540px;top:620px;opacity:1;font:700 40px/1 \'Maven Pro\';transform:translate(-50%,-50%)">psicologakarentrujillo.com.mx</div></div>');
// ============ ESPECIFICACIÓN (se define antes que las escenas) ============
// Lienzo 1080×1920 (9:16) · 30 fps · 57.34 s = 1720 cuadros · audio = voz.mp3 (1.10x)
// Zonas seguras: gráficos dentro de x 60–1020 y página y 300–1250 (escenario); subtítulos en y 1290–1440 (nada de gráficos ahí).
// Micro-copy: máximo 4 palabras por momento visual (sin contar subtítulos). Bucle: nada se anima en los últimos 0.5 s.
const CFG={FPS:30,DUR:+(WORDS[WORDS.length-1][2]+.1).toFixed(2),W:1080,H:1920,
 POP:'back.out(1.35)',   // entradas: suaves, un solo rebote leve
 MOVE:'power3.inOut',    // desplazamientos
 OUT:'power2.in',        // salidas
 T:{pop:.5,move:.7,out:.3}};
gsap.set('.o',{opacity:0,transformOrigin:'50% 50%'});
gsap.set('.st,.big,.lb',{xPercent:-50,yPercent:-50});
gsap.set('.pl',{xPercent:-50,opacity:0});
document.querySelectorAll('.st').forEach(e=>gsap.set(e,{rotation:+e.dataset.r}));
const tl=gsap.timeline({paused:true});
const ST=(s,v)=>gsap.set(s,v);
// utilidades: entrar (POP), salir (OUT), mover (MV)
const POP=(s,t,sc,x,y,d)=>{const f={scale:.3,opacity:0},v={scale:sc||1,opacity:1,duration:d||CFG.T.pop,ease:CFG.POP,immediateRender:false};if(x!==undefined){f.x=x;f.y=y;v.x=x;v.y=y;}tl.fromTo(s,f,v,t);};
const OUT=(s,t,d)=>tl.to(s,{opacity:0,scale:'*=0.7',duration:d||CFG.T.out,ease:CFG.OUT},t);
const MV=(s,t,v,d,e)=>tl.to(s,Object.assign({duration:d||CFG.T.move,ease:e||CFG.MOVE},v),t);
const FROM=(s,t,f,v,d)=>tl.fromTo(s,f,Object.assign({duration:d||CFG.T.pop,ease:CFG.POP,immediateRender:false},v),t);
const SPIN=(s,t,deg,d)=>tl.to(s,{rotation:'+='+deg,duration:d,ease:'none'},t);

// ============ ESCENA 1 · HOOK (0–4.9) ============
// Acción: tres burbujas de regaño aparecen «una y otra vez» sobre el niño; en «escucharte» se desinflan y caen sin llegarle.
// Persiste: el niño. Imagen final: niño solo con «¿No quiere escuchar?».
function escena1(){
 POP('#hd',0.05,1,540,600);
 POP('#sp1',at('pides'),1,250,300);POP('#sp2',at('una'),1,830,280);POP('#sp3',at('otra vez'),1.1,540,160);
 ['#sp1','#sp2','#sp3'].forEach((s,i)=>tl.to(s,{y:'+=520',rotation:i%2?25:-25,opacity:0,scale:.6,duration:.8,ease:CFG.OUT},at('escucharte',-.3+i*.1)));
 POP('#sNq',at('no quiere'),1);
}
// ============ ESCENA 2 · DESARROLLO (4.9–17.3) ============
// Acción: las instrucciones llegan como tarjetas (juguetes, zapatos, mochila) y rodean al niño; en «termina» se revuelven
//   y se desenfocan; aparece la pelota («otra cosa»); luego regaños en zigzag y una nube de frustración.
// Persisten: niño y tarjetas (vuelven en el giro). Imagen final: niño bajo la nube con «Otra discusión más».
function escena2(){
 const tLe=at('le dices');
 OUT('#sNq',tLe-.2);
 MV('#hd',tLe,{x:290,y:600,scale:.9});
 POP('#c1',at('juguetes',-.3),1,780,230);POP('#c2',at('zapatos',-.3),1,780,470);POP('#c3',at('mochila',-.3),1,780,710);
 const tTe=at('termina');
 [['#c1',700,640,18],['#c2',860,300,-16],['#c3',760,440,10]].forEach(([s,x,y,r])=>MV(s,tTe,{x,y,rotation:r},.6));
 tl.to('#c1,#c2,#c3',{filter:'blur(4px)',opacity:.6,duration:.4},tTe+.3);       // enfoque: las tareas se borran
 POP('#bl',at('otra cosa'),1,470,860);
 tl.to('#bl',{y:'-=60',duration:.3,yoyo:true,repeat:3,ease:'sine.out'},at('otra cosa',.5));
 const tEn=at('entonces');
 ['#c1','#c2','#c3','#bl'].forEach(s=>OUT(s,tEn-.2));
 MV('#hd',tEn,{x:540,y:620,scale:1});
 POP('#z1',at('reganos',-.1),1,220,330);POP('#z2',at('reganos',.2),1,860,330);
 POP('#cld',at('frustracion',-.1),1,540,330);
 tl.to('#z1,#z2',{rotation:12,duration:.12,yoyo:true,repeat:5},at('discusion',-.2));
 POP('#sDi',at('discusion'),1);
}
// ============ ESCENA 3 · GIRO (17.3–31.6) ============
// Acción: la lupa revisa al niño; las tres tarjetas vuelven y se le amontonan sobre la cabeza (varias instrucciones a la vez);
//   cada tarjeta se transforma en un engranaje: Atención, Memoria de trabajo, Autorregulación; engranan y giran;
//   tres niños chicos, cada engranaje a su ritmo (procesan distinto).
// Imagen final: tres engranajes girando a distinta velocidad sobre tres niños y «A su manera».
function escena3(){
 const tPe=at('pero',0,1);
 ['#z1','#z2','#cld','#sDi'].forEach(s=>OUT(s,tPe-.2));
 FROM('#lp',at('investiga',-.4),{opacity:0,scale:.3,x:380,y:520},{opacity:1,scale:1,x:380,y:520});
 MV('#lp',at('investiga',.2),{x:660,y:560},.9);
 const tSe=at('seguir');
 OUT('#lp',tSe-.2);
 tl.set('#c1,#c2,#c3',{filter:'blur(0px)'},tSe-.1);
 FROM('#c1',tSe,{opacity:0,scale:.3,x:250,y:150,rotation:0},{opacity:1,scale:.6,x:250,y:150});
 FROM('#c2',tSe+.15,{opacity:0,scale:.3,x:540,y:150,rotation:0},{opacity:1,scale:.6,x:540,y:150});
 FROM('#c3',tSe+.3,{opacity:0,scale:.3,x:830,y:150,rotation:0},{opacity:1,scale:.6,x:830,y:150});
 const tIn=at('instrucciones');
 MV('#c1',tIn,{x:540,y:440,rotation:-4},.6);MV('#c2',tIn+.2,{x:500,y:385,rotation:-14},.6);MV('#c3',tIn+.4,{x:585,y:335,rotation:12},.6);  // se amontonan
 tl.to('#c1,#c2,#c3',{x:'+=10',duration:.1,yoyo:true,repeat:5},at('representa'));
 POP('#sNp',at('dificultad',-.1),1);
 // tarjetas → engranajes
 const tAt=at('atencion');
 ['#sNp'].forEach(s=>OUT(s,tAt-.3));
 tl.to('#hd',{opacity:0,y:'+=60',duration:.4,ease:CFG.OUT},tAt-.3);
 [['#c1','#gA','#lA',tAt,230],['#c2','#gB','#lB',at('memoria'),540],['#c3','#gC','#lC',at('autorregulacion'),850]].forEach(([c,gq,l,t,x])=>{
  MV(c,t-.3,{x,y:440,scale:.5,rotation:0},.4);tl.to(c,{opacity:0,duration:.2},t+.05);
  FROM(gq,t,{opacity:0,scale:.3,x,y:440,rotation:0},{opacity:1,scale:1,x,y:440,rotation:60},.6);
  tl.fromTo(l,{opacity:0,scale:.6},{opacity:1,scale:1,duration:.4,ease:CFG.POP,immediateRender:false},t+.1);});
 const tIf=at('influyen');
 MV('#gA',tIf,{x:296},.6);MV('#gC',tIf,{x:784},.6);
 tl.to('#lA',{x:6,duration:.6},tIf);tl.to('#lC',{x:-6,duration:.6},tIf);
 SPIN('#gA',tIf+.6,120,1.2);SPIN('#gB',tIf+.6,-120,1.2);SPIN('#gC',tIf+.6,120,1.2);
 const tNt=at('no todos');
 tl.to('#lA,#lB,#lC',{opacity:0,duration:.3},tNt-.2);
 [['#k1',296],['#k2',540],['#k3',784]].forEach(([k,x],i)=>POP(k,at('ninos')+i*.15,.42,x,740));
 SPIN('#gA',at('procesan'),360,3);SPIN('#gB',at('procesan'),-160,3);SPIN('#gC',at('procesan'),720,3);   // cada uno a su ritmo
 POP('#sSm',at('misma',-.2),1);
}
// ============ ESCENA 4 · PROVOCACIÓN (31.6–40.6) ============
// Acción: el niño vuelve con una cerca debajo (sí hay límites); la etiqueta «Desobediente» se le pega y en «voluntad» gira y se vuelve «?»;
//   llega un adulto a su lado y aparece un corazón (otra forma de acompañar).
// Persiste: el niño. Imagen final: adulto y niño juntos con un corazón.
function escena4(){
 const tEs=at('esto');
 ['#gA','#gB','#gC','#k1','#k2','#k3','#sSm'].forEach(s=>OUT(s,tEs-.2));
 FROM('#hd',tEs,{opacity:0,scale:.3,x:540,y:560},{opacity:1,scale:1,x:540,y:560});
 POP('#lim',at('permitir'),1,540,790);
 POP('#sLi',at('conducta'),1);
 const tSi=at('significa',0,1);
 OUT('#lim',tSi-.2);OUT('#sLi',tSi-.2);
 FROM('#tg',at('asumir',-.1),{opacity:0,scale:1.6,x:540,y:690,rotation:-6},{opacity:1,scale:.85,x:540,y:690,rotation:-6},.4);   // la etiqueta se pega
 const tVo=at('voluntad');
 tl.to('#tg',{scaleX:0,duration:.25,ease:'power2.in'},tVo-.3);
 FROM('#qm',tVo-.05,{opacity:0,scale:.3,x:540,y:690},{opacity:1,scale:1,x:540,y:690});   // …y se vuelve pregunta
 POP('#sVo',tVo+.1,1);
 const tAv=at('a veces');
 ['#qm','#sVo'].forEach(s=>OUT(s,tAv-.1));
 MV('#hd',tAv,{x:700,y:610,scale:.85});
 POP('#ad',at('cambiar',-.2),1.1,330,560);

}
// ============ ESCENA 5 · CIERRE (40.6–53.8) ============
// Acción: la lupa vuelve; el niño se transforma en la hoja de evaluación con checks; las tarjetas regresan ordenadas
//   como pasos 1-2-3 sobre un camino a la meta; en «corregir sin comprender» un corredor da vueltas en círculo.
// Persisten: niño (→ hoja), tarjetas (→ pasos). Imagen final: el corredor en el círculo y «Mismo lugar».
function escena5(){
 const tSi=at('si estas');
 ['#ad','#hr','#sAc'].forEach(s=>OUT(s,tSi-.2));
 MV('#hd',tSi,{x:540,y:580,scale:1});
 // los engranajes vuelven chicos sobre la cabeza y laten en «frecuentemente»
 [['#gA',400],['#gB',540],['#gC',680]].forEach(([s,x],i)=>FROM(s,at('dificultades')+i*.15,{opacity:0,scale:.2,x,y:330,rotation:0},{opacity:1,scale:.55,x,y:330}));
 tl.to('#gA,#gB,#gC',{scale:.65,duration:.2,yoyo:true,repeat:3,ease:'sine.inOut'},at('frecuentemente'));
 tl.to('#gA',{rotation:'+=200',duration:2.2,ease:'none'},at('frecuentemente'));tl.to('#gB',{rotation:'-=200',duration:2.2,ease:'none'},at('frecuentemente'));tl.to('#gC',{rotation:'+=200',duration:2.2,ease:'none'},at('frecuentemente'));
 FROM('#lp',at('investigarlas',-.3),{opacity:0,scale:.3,x:420,y:400},{opacity:1,scale:1,x:420,y:400});
 MV('#lp',at('investigarlas',.3),{x:640,y:380},.8);
 const tEv=at('evaluacion');
 OUT('#lp',tEv-.3);['#gA','#gB','#gC'].forEach(s=>OUT(s,tEv-.3));
 tl.to('#hd',{scale:.6,opacity:0,duration:.5,ease:CFG.MOVE},tEv-.2);                         // el niño…
 FROM('#cl',tEv,{opacity:0,scale:.5,x:540,y:470},{opacity:1,scale:1,x:540,y:470},.6);           // …se vuelve la evaluación
 POP('#sEv',tEv+.2,1);
 [0,1,2].forEach(i=>POP('#rc'+i,at('especializada')+i*.35,.5,472,402+i*70,.4));
 const tId=at('identificar');
 ['#cl','#rc0','#rc1','#rc2','#sEv'].forEach(s=>OUT(s,tId-.2));
 POP('#pth',tId,1,540,700);
 [['#c1',230],['#c2',540],['#c3',850]].forEach(([c,x],i)=>{tl.set(c,{filter:'blur(0px)',rotation:0},tId);FROM(c,tId+.1+i*.2,{opacity:0,scale:.3,x,y:540},{opacity:1,scale:.85,x,y:540});});
 [['#n1',230],['#n2',540],['#n3',850]].forEach(([n,x],i)=>POP(n,tId+.3+i*.2,.9,x-132,448));
 POP('#flg',tId+.9,1,940,640);
 POP('#sCa',at('ocurriendo'),1);
 // corregir sin comprender = dar vueltas
 const tCo=at('corregir');
 ['#pth','#c1','#c2','#c3','#n1','#n2','#n3','#flg','#sCa'].forEach(s=>OUT(s,tCo-.3));
 POP('#rnd',tCo,1,540,470);
 POP('#z1',at('conducta',0,1),.6,540,470);
 const R={a:-90};const place=()=>{const r=R.a*Math.PI/180;gsap.set('#rn',{x:540+210*Math.cos(r),y:470+210*Math.sin(r)});};
 tl.set('#rn',{opacity:1,scale:1},tCo);
 tl.to(R,{a:630,duration:at('lugar')-tCo,ease:'none',onUpdate:place,onStart:place},tCo);
 POP('#sMl',at('mismo',-.1),1);
}
// ============ ESCENA 6 · CTA (53.8–57.3) ============
// Acción: la casa con la burbuja de comentarios; aviso final y web (quietos los últimos 0.5 s para el bucle).

function escena6(){

 ['#rnd','#rn','#z1','#sMl'].forEach(s=>OUT(s,tCa-.2));

 ['#hs','#sFa','#cm'].forEach(s=>OUT(s,tF-.1));

}
escena1();escena2();escena3();escena4();escena5();escena6();
// ============ SUBTÍTULOS (tiempos reales de words.json) ============
const KEYS=new Set(['desobediente','instrucciones','dificultad','atencion','memoria','autorregulacion','voluntad','acompanar','evaluacion','especializada','comprender','origen','frustracion','discusion']);
(function(){const caps=[];let cur=[];
 const flush=()=>{if(cur.length){caps.push(cur);cur=[];}};
 WORDS.forEach((w,i)=>{cur.push({w:w[0],t:w[1],e:w[2]});const nx=WORDS[i+1];
  if(cur.length>=3||/[,.:?…]$/.test(w[0])||(nx&&nx[1]-w[2]>.45))flush();});flush();
 caps.forEach((c,i)=>{const d=document.createElement('div');d.className='cap';d.id='cap'+i;
  d.innerHTML=c.map((x,j)=>`<span class="pw${KEYS.has(norm(x.w)[0])?' k':''}" id="c${i}w${j}">${x.w}</span>`).join(' ');document.body.appendChild(d);
  const s0=c[0].t,e0=Math.min(i+1<caps.length?caps[i+1][0].t-.03:CFG.DUR-.05,c[c.length-1].e+.9);
  tl.set('#cap'+i,{opacity:1},s0);tl.set('#cap'+i,{opacity:0},e0);
  c.forEach((x,j)=>tl.fromTo('#c'+i+'w'+j,{opacity:0,scale:.5,y:10,transformOrigin:'50% 80%'},{opacity:1,scale:1,y:0,duration:.25,ease:'power2.out',immediateRender:false},x.t));});
})();
window.DUR=CFG.DUR;
window.seek=t=>{tl.time(Math.min(t,tl.duration()));document.getElementById('rtb').setAttribute('seed',1+Math.floor(t*12)%7);};
