 ...[1,2,3,4].map(i=>O('td'+i,TEAR)),O('sd1',TEAR),O('sd2',TEAR),
 O('sw1',SWIRL),O('sw2',SWIRL),
 O('bur',`<path d="${STAR(8,95,62)}" fill="#F5E7D6" ${S}/>`+T('!!',24,74)),
 O('pnA',`<rect x="-120" y="-18" width="110" height="36" fill="#F5E7D6" ${S}/><rect x="-150" y="-18" width="34" height="36" rx="6" fill="#F9DEE3" ${S}/><path d="M-10 -18L-2 -8L-12 0L-2 8L-10 18" fill="none" ${S} stroke-width="4"/>`),
 O('pnB',`<path d="M10 -18L2 -8L12 0L2 8L10 18H90L130 0L90 -18Z" fill="#F5E7D6" ${S}/><path d="M112 -8L130 0L112 8Z" fill="#2E2545"/>`),
 O('pi1',PI('¡Ya!','#F9DEE3')),O('pi2',PI('¡Apúrate!','#F5E7D6')),O('pi3',PI('¡Siéntate!','#fff')),
 O('mz',MAZE),
 O('ob1',[['3',-40,-6,-12],['1',0,8,6],['2',40,-4,14]].map(([n,x,y,r])=>`<g transform="translate(${x} ${y}) rotate(${r})"><rect x="-30" y="-38" width="60" height="76" rx="8" fill="#F9DEE3" ${S}/>${T(n,14,40)}</g>`).join('')),

 O('mtn',`<path d="M-360 260L-120 -200L-40 -80L40 -260L360 260Z" fill="#F5E7D6" ${S}/><path d="M-120 -200L-170 -104Q-150 -120 -130 -100Q-110 -124 -67 -120ZM40 -260L-9 -150Q14 -170 34 -146Q60 -172 104 -156Z" fill="#fff" ${S}/>`),
 O('qm',`<path d="M-70 -90Q-70 -170 0 -170Q80 -170 80 -100Q80 -50 24 -24Q0 -10 0 30" fill="none" stroke="#2E2545" stroke-width="76" stroke-linecap="round"/><path d="M-70 -90Q-70 -170 0 -170Q80 -170 80 -100Q80 -50 24 -24Q0 -10 0 30" fill="none" stroke="#F9DEE3" stroke-width="54" stroke-linecap="round"/><circle cy="110" r="36" fill="#F9DEE3" ${S}/>`),
 ...[1,2,3].map(i=>O('rk'+i,`<path d="${i==1?'M-60 0A60 40 0 1 1 -60 1':'M-30 -30L30 30M30 -30L-30 30'}" fill="none" stroke="${RED}" stroke-width="9" stroke-linecap="round"/>`)),
 O('pen',`<g transform="rotate(-30)"><path d="M0 0L-14 -40H14Z" fill="#F5E7D6" ${S}/><path d="M-4 -12L0 0L4 -12Z" fill="${RED}"/><rect x="-18" y="-200" width="36" height="160" rx="10" fill="${RED}" ${S}/><rect x="-18" y="-200" width="36" height="40" rx="10" fill="#2E2545"/></g>`),
 O('sgn',`<rect x="-16" y="-260" width="32" height="560" rx="10" fill="#F5E7D6" ${S}/><path d="M-80 300H80" fill="none" ${S} stroke-width="10"/>`),
 O('arL',`<path d="M-20 -50H-360L-400 0L-360 50H-20Z" fill="#fff" ${S}/>`+T('Exigir más',15,44,-200)),
 O('arR',`<path d="M20 -50H360L400 0L360 50H20Z" fill="#F9DEE3" ${S}/>`+T('Comprender mejor',14,38,190)),
 O('meg',`<path d="M-60 -24L40 -70V70L-60 24Z" fill="#F5E7D6" ${S}/><rect x="-92" y="-28" width="36" height="56" rx="8" fill="#C6BCE2" ${S}/><g id="mga"><path d="M66 -40Q90 0 66 40M92 -64Q130 0 92 64" fill="none" ${S}/></g>`),

// ---------- HTML: rótulos (≤4 palabras)
const H=document.getElementById('ht');

// ============ ESPECIFICACIÓN (se define antes que las escenas) ============
// Lienzo 1080×1920 (9:16) · 30 fps · 64.2 s · audio = voz.mp3 (1.10x)
// Zonas seguras: gráficos dentro de x 60–1020 y página y 300–1250 (escenario); subtítulos en y 1290–1440 (nada de gráficos ahí).
// Micro-copy: máximo 4 palabras por momento visual (sin contar subtítulos). Bucle: nada se anima en los últimos 0.5 s.
const CFG={FPS:30,DUR:+(WORDS[WORDS.length-1][2]+.1).toFixed(2),W:1080,H:1920,
 POP:'back.out(1.35)',   // entradas: suaves, un solo rebote leve
 MOVE:'power3.inOut',    // desplazamientos
 OUT:'power2.in',        // salidas
 T:{pop:.5,move:.7,out:.3}};
gsap.set('.o',{opacity:0,transformOrigin:'50% 50%'});
gsap.set('#fkl,#fal',{transformOrigin:'50% 0%',scaleY:0});
gsap.set('#shs',{opacity:0});
gsap.set('#arL',{transformOrigin:'95% 50%'});
gsap.set('.st,.big,.lb',{xPercent:-50,yPercent:-50});
gsap.set('.pl',{xPercent:-50,opacity:0});
document.querySelectorAll('.st').forEach(e=>gsap.set(e,{rotation:+e.dataset.r}));
const tl=gsap.timeline({paused:true});
const ST=(s,v)=>gsap.set(s,v);
// utilidades: entrar (POP), salir (OUT), mover (MV)
const POP=(s,t,sc,x,y,d)=>{const f={scale:.3,opacity:0},v={scale:sc||1,opacity:1,duration:d||CFG.T.pop,ease:CFG.POP,immediateRender:false};if(x!==undefined){f.x=x;f.y=y;v.x=x;v.y=y;}tl.fromTo(s,f,v,t);};
const OUT=(s,t,d)=>tl.to(s,{opacity:0,scale:'*=0.7',duration:d||CFG.T.out,ease:CFG.OUT},t);
const MV=(s,t,v,d,e)=>tl.to(s,Object.assign({duration:d||CFG.T.move,ease:e||CFG.MOVE},v),t);
const FROM=(s,t,f,v,d)=>tl.fromTo(s,f,Object.assign({duration:d||CFG.T.pop,ease:CFG.POP,immediateRender:false},v),t);
const PLI=(s,t)=>tl.fromTo(s,{opacity:0,scale:.6},{opacity:1,scale:1,duration:.4,ease:CFG.POP,immediateRender:false},t);
const SHAKE=(s,t,n,dx)=>tl.to(s,{x:'+='+(dx||10),duration:.07,yoyo:true,repeat:n||5,ease:'sine.inOut'},t);
// trazo que se dibuja (marcas de la pluma roja)
const DRAW=(s,t,d)=>{const p=document.querySelector(s+' path'),L=p.getTotalLength();gsap.set(p,{strokeDasharray:L,strokeDashoffset:L});tl.set(s,{opacity:1,scale:1},t);tl.fromTo(p,{strokeDashoffset:L},{strokeDashoffset:0,duration:d||.35,ease:'power1.inOut',immediateRender:false},t);};
// reloj digital (h:mm)
const CKT=document.getElementById('clkT');const fm=m=>Math.floor(m/60)+':'+String(Math.floor(m%60)).padStart(2,'0');
const COUNT=(t,a,b,d)=>{const o={v:a};tl.fromTo(o,{v:a},{v:b,duration:d,ease:'power1.in',immediateRender:false,onUpdate:()=>{CKT.textContent=fm(o.v);}},t);};
// lágrima que cae
const DROP=(s,t,x,y,dy)=>tl.fromTo(s,{opacity:0,scale:.4,x,y},{keyframes:[{opacity:1,scale:1,duration:.15},{y:y+(dy||140),duration:.55,ease:'power1.in'},{opacity:0,duration:.15}],immediateRender:false},t);

// ============ ESCENA 1 · HOOK (0–5.2) ============
// Acción: hoja de «Tarea», reloj digital que corre de 4:00 a 6:30; la cara del niño llora (lágrimas), estallido «!!» (gritos) y un lápiz que se parte (frustración).
// Persisten: hoja, cara del niño. Imagen final: hoja, cara y «Otra tarde de llanto».
function escena1(){
 ST('#sh',{rotation:-4});
 POP('#sh',0,.85,540,330);
 POP('#clk',.1,.8,860,110);COUNT(.3,240,390,4.3);
 POP('#fk',.2,1.1,540,720);
 const tLl=at('llanto');
 DROP('#td1',tLl,509,745);DROP('#td2',tLl+.15,571,745);DROP('#td3',tLl+.6,509,745);DROP('#td4',tLl+.75,571,745);
 POP('#bur',at('gritos',-.15),.9,220,680);SHAKE('#bur',at('gritos',.3),5,12);SHAKE('#fk',at('gritos'),3,6);
 FROM('#pnA',at('frustracion',-.4),{opacity:0,scale:.3,x:860,y:640,rotation:0},{opacity:1,scale:.9,x:860,y:640,rotation:0});
 FROM('#pnB',at('frustracion',-.4),{opacity:0,scale:.3,x:860,y:640,rotation:0},{opacity:1,scale:.9,x:860,y:640,rotation:0});
 MV('#pnA',at('frustracion',.1),{x:830,y:660,rotation:-30},.3,'back.out(2)');MV('#pnB',at('frustracion',.1),{x:900,y:660,rotation:30},.3,'back.out(2)');
 POP('#sOt',at('hay algo'),1);
}
// ============ ESCENA 2 · DESARROLLO (5.2–19.3) ============
// Acción: la hoja se endereza; tarjeta «Abre tu cuaderno»; notas adhesivas de recordatorios que tiemblan (quejas); lágrimas;
//   remolinos sobre la cara del niño y luego sobre la del adulto; el reloj marca 0:20 y corre a 1:45; la hoja se arruga en una bola y las dos caras quedan agotadas.
// Persisten: hoja (→ bola), cara del niño, reloj. Imagen final: bola de papel, reloj en 1:45 y dos caras agotadas con gotas de sudor.
function escena2(){
 const tT=at('todo');
 ['#bur','#pnA','#pnB','#sOt','#clk'].forEach(s=>OUT(s,tT-.2));
 MV('#sh',tT,{x:540,y:330,scale:.7,rotation:0});
 MV('#fk',tT,{x:540,y:760,scale:1.1});
