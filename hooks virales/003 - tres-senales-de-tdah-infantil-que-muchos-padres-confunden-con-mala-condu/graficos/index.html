<style>

<script>
const S='stroke="#2E2545" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"';
const GR='#10b77f';
// ---------- tiempos reales de la voz
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ\s]/g,' ').split(/\s+/).filter(Boolean);
const WN=WORDS.map(w=>norm(w[0])[0]||'');
function at(frag,off,nth){const f=norm(frag);let c=0;
 for(let i=0;i<=WN.length-f.length;i++){let ok=true;for(let j=0;j<f.length;j++)if(WN[i+j]!==f[j]){ok=false;break;}
  if(ok){if((nth||0)===c)return +(WORDS[i][1]+(off||0)).toFixed(2);c++;}}
 throw new Error('no encuentro: '+frag);}
// ---------- dibujos (centrados en 0,0)
function gear(r,n,fill){let p=[];const st=2*Math.PI/n;
 for(let i=0;i<n;i++){const a=i*st;[[-.28,r],[-.18,r+26],[.18,r+26],[.28,r]].forEach(([k,rr])=>{const aa=a+k*st;p.push((rr*Math.cos(aa)).toFixed(1)+' '+(rr*Math.sin(aa)).toFixed(1));});}
 return `<path d="M${p.join('L')}Z" fill="${fill}" ${S}/><circle r="${r*.38}" fill="#fff" ${S}/><circle r="10" fill="#2E2545"/>`;}
const D={
head:`<path d="M-130 150Q-130 70 0 70Q130 70 130 150Z" fill="#F9DEE3" ${S}/><circle cx="0" cy="-20" r="72" fill="#F5E7D6" ${S}/><circle cx="-24" cy="-26" r="7" fill="#2E2545"/><circle cx="24" cy="-26" r="7" fill="#2E2545"/><path d="M-18 10Q0 20 18 10" fill="none" ${S}/>`,
lupa:`<circle cx="0" cy="0" r="74" fill="rgba(255,255,255,.4)" ${S}/><path d="M52 52L112 112" fill="none" stroke="#2E2545" stroke-width="20" stroke-linecap="round"/>`,
bulb:`<g id="bulbR"><path d="M0 -150V-122M-96 -112L-78 -94M96 -112L78 -94M-118 -30H-92M118 -30H92" fill="none" ${S}/></g><circle cx="0" cy="-30" r="84" fill="#F5E7D6" ${S}/><path d="M-34 -20Q-17 -62 0 -20Q17 -62 34 -20" fill="none" ${S}/><rect x="-36" y="46" width="72" height="30" rx="10" fill="#fff" ${S}/><rect x="-26" y="80" width="52" height="22" rx="10" fill="#fff" ${S}/>`,
cross:`<path d="M-60 -60L60 60M60 -60L-60 60" fill="none" stroke="#C0392B" stroke-width="20" stroke-linecap="round"/>`,
star:`<path d="M0 -46L14 -16L46 -12L22 10L28 44L0 28L-28 44L-22 10L-46 -12L-14 -16Z" fill="#F5E7D6" ${S}/>`
};
const T=(tx,y,fs,x)=>`<text x="${x||0}" y="${y||0}" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="${fs||40}" fill="#2E2545">${tx}</text>`;
const bubble=(tx,fs)=>`<path d="M-100 -60H100Q120 -60 120 -40V30Q120 50 100 50H-10L-50 95L-46 50H-100Q-120 50 -120 30V-40Q-120 -60 -100 -60Z" fill="#fff" ${S}/>`+T(tx,14,fs||44);
const ICON={
 hab:`<path d="M-118 -30H-50Q-40 -30 -40 -20V10Q-40 20 -50 20H-90L-106 36L-104 20H-118Q-128 20 -128 10V-20Q-128 -30 -118 -30Z" fill="#F9DEE3" ${S}/>`,
 bar:`<rect x="-126" y="-14" width="86" height="28" rx="14" fill="#fff" ${S}/><rect x="-120" y="-8" width="30" height="16" rx="8" fill="${GR}"/>`,
 moc:`<rect x="-114" y="-30" width="56" height="62" rx="14" fill="#C6BCE2" ${S}/><path d="M-114 -4H-58M-100 -30Q-86 -50 -72 -30" fill="none" ${S}/>`
};
const card=(ic,tx)=>`<rect x="-140" y="-80" width="280" height="160" rx="22" fill="#fff" ${S}/>${ic}`+T(tx,11,30,46);
const back=n=>`<rect x="-140" y="-80" width="280" height="160" rx="22" fill="#C6BCE2" ${S}/><circle r="50" fill="#fff" ${S}/>`+T(n,22,64);
const bar=`<rect x="-260" y="-24" width="520" height="48" rx="24" fill="#fff" ${S}/><path d="M-30 0H230" fill="none" stroke="#C6BCE2" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 18"/>`;
const piece=(col,tx)=>`<circle cx="125" cy="0" r="34" fill="${col}" ${S}/><rect x="-115" y="-115" width="230" height="230" rx="26" fill="${col}" ${S}/>`+T(tx,12,36);
const g=document.getElementById('gg');
const O=(id,inner)=>`<g id="${id}" class="o">${inner}</g>`;
g.innerHTML=[
 O('mesa',`<path d="M-460 0H460" fill="none" ${S} stroke-width="8"/><path d="M-400 0V120M400 0V120" fill="none" ${S} stroke-width="8"/>`),
 O('tln',`<path d="M-400 0H400" fill="none" ${S} stroke-width="8"/>`+[0,1,2,3,4].map(i=>`<path d="M${-400+i*200} -18V18" fill="none" ${S}/>`).join('')+`<path d="M380 -20L404 0L380 20" fill="none" ${S}/>`),
 O('l1',`<path d="M0 0V250" fill="none" ${S} stroke-dasharray="14 14"/>`),O('l2',`<path d="M0 0V250" fill="none" ${S} stroke-dasharray="14 14"/>`),O('l3',`<path d="M0 0V250" fill="none" ${S} stroke-dasharray="14 14"/>`),
 O('hd',D.head),O('kA',D.head),O('kB',D.head),O('k1',D.head),O('k2',D.head),O('k3',D.head),
 O('tv1',D.star),O('tv2',D.star),O('tv3',D.star),O('tv4',D.star),
 O('b1',back('1')),O('b2',back('2')),O('b3',back('3')),
 O('q1',card(ICON.hab,'Interrumpe')),O('q2',card(ICON.bar,'Incompleto')),O('q3',card(ICON.moc,'Olvida')),
 O('bA',bubble('Y luego…',40)),O('bI',bubble('¡Yo!',52)),
 O('tk',`<rect x="-80" y="-50" width="160" height="100" rx="14" fill="#F5E7D6" ${S}/><circle cx="-80" cy="0" r="16" fill="#E5DEF2" ${S}/><circle cx="80" cy="0" r="16" fill="#E5DEF2" ${S}/>`+T('Turno',14,36)),
 O('br1',bar),O('br2',bar),O('br3',bar),
 `<rect id="f1" class="o" x="0" y="-15" width="500" height="30" rx="15" fill="${GR}"/>`,`<rect id="f2" class="o" x="0" y="-15" width="500" height="30" rx="15" fill="${GR}"/>`,`<rect id="f3" class="o" x="0" y="-15" width="500" height="30" rx="15" fill="${GR}"/>`,
 O('mc',`<rect x="-110" y="-120" width="220" height="250" rx="44" fill="#C6BCE2" ${S}/><path d="M-110 -20H110M-60 -120Q0 -190 60 -120" fill="none" ${S}/><rect x="-60" y="20" width="120" height="70" rx="14" fill="#E5DEF2" ${S}/>`),
 O('nt',`<rect x="-30" y="-36" width="60" height="72" rx="8" fill="#fff" ${S}/><path d="M-14 -14H14M-14 4H14M-14 22H4" fill="none" stroke="#C6BCE2" stroke-width="6" stroke-linecap="round"/>`),
 O('pc',`<rect x="-80" y="-12" width="140" height="24" rx="6" fill="#F5E7D6" ${S}/><path d="M60 -12L96 0L60 12Z" fill="#F9DEE3" ${S}/>`),
 O('nb',`<rect x="-55" y="-70" width="110" height="140" rx="10" fill="#F9DEE3" ${S}/><path d="M-35 -70V70" fill="none" ${S}/>`),
 O('sp',bubble('¡Escucha!',40)),
 O('gR',gear(95,10,'#F5E7D6')),
 O('gA',gear(50,8,'#F5E7D6')),O('gB',gear(50,8,'#F9DEE3')),O('gC',gear(50,8,'#fff')),
 O('qm',`<circle r="70" fill="#F9DEE3" ${S}/>`+T('?',36,100)),
 O('clk',`<circle r="62" fill="#fff" ${S}/><path d="M0 -44V-52M0 44V52M-44 0H-52M44 0H52" ${S} stroke-width="5" fill="none"/><g id="clkH" class="r"><rect x="-4" y="-42" width="8" height="42" rx="4" fill="#2E2545"/></g>`),
 O('hs',`<path d="M-150 -10L0 -140L150 -10" fill="none" ${S} stroke-width="8"/><path d="M-120 -30V140H120V-30" fill="#F5E7D6" ${S}/><rect x="-30" y="50" width="60" height="90" rx="10" fill="#C6BCE2" ${S}/><rect x="-96" y="-4" width="50" height="50" rx="8" fill="#fff" ${S}/><rect x="46" y="-4" width="50" height="50" rx="8" fill="#fff" ${S}/>`),
 O('sc',`<path d="M-150 -40L0 -130L150 -40Z" fill="#F9DEE3" ${S}/><rect x="-150" y="-40" width="300" height="180" fill="#fff" ${S}/><rect x="-30" y="60" width="60" height="80" rx="8" fill="#C6BCE2" ${S}/>`+[-100,40].map(x=>`<rect x="${x}" y="-10" width="60" height="50" rx="8" fill="#E5DEF2" ${S}/>`).join('')+`<circle cy="-80" r="22" fill="#fff" ${S}/>`),
 O('lp',D.lupa),
 O('pz0',piece('#F5E7D6','Desarrollo')),O('pz1',piece('#F9DEE3','Conducta')),O('pz2',piece('#fff','Contextos')),
 O('xx',D.cross),O('bu',D.bulb),
 O('cm',`<path d="M-150 -90H150Q180 -90 180 -60V60Q180 90 150 90H-30L-100 150L-90 90H-150Q-180 90 -180 60V-60Q-180 -90 -150 -90Z" fill="#fff" ${S}/><circle cx="-60" cy="0" r="14" fill="#2E2545"/><circle cx="0" cy="0" r="14" fill="#2E2545"/><circle cx="60" cy="0" r="14" fill="#2E2545"/>`)
].join('');
// ---------- HTML: rótulos (≤4 palabras)
const H=document.getElementById('ht');
const st=(id,tx,x,y,fs,rot)=>H.insertAdjacentHTML('beforeend',`<div class="st" id="${id}" data-r="${rot||0}" style="left:${x}px;top:${y}px;${fs?'font-size:'+fs+'px':''}">${tx}</div>`);
const pl=(id,tx,x,y)=>H.insertAdjacentHTML('beforeend',`<div class="pl" id="${id}" style="left:${x}px;top:${y}px;width:auto;padding:0 28px;font-size:38px">${tx}</div>`);
st('sTr','¿Simples travesuras?',540,900,0,-2);
st('sIn','Interrumpe constantemente',540,900,0,2);
st('sDe','Deja todo incompleto',540,900,0,-2);
st('sOl','Olvida instrucciones',540,900,0,2);
pl('lR','Autorregulación',540,650);pl('lT','TDAH',540,720);
pl('cI','Impulsos',230,440);pl('cA','Atención',540,440);pl('cO','Organización',850,440);
st('sNo','No confirma TDAH',540,880,62,-4);document.getElementById('sNo').style.cssText+=';border-color:#C0392B;color:#C0392B';
st('sCx','Observa el contexto',540,880,0,2);
st('sVi','Valoración integral',540,820,0,-2);
st('sEd','Entender la dificultad',540,900,0,2);
st('sDu','¿Cuál te genera dudas?',540,230,0,-2);
H.insertAdjacentHTML('beforeend','<div id="end" style="position:absolute;left:0;top:0;width:1080px;height:1000px;opacity:0"><div style="position:absolute;left:90px;top:330px;width:900px;text-align:center;font:700 70px/1.15 Outfit;color:#2E2545">Este video orienta y no diagnostica.</div><div class="st" style="left:540px;top:620px;opacity:1;font:700 40px/1 \'Maven Pro\';transform:translate(-50%,-50%)">psicologakarentrujillo.com.mx</div></div>');
// ============ ESPECIFICACIÓN (se define antes que las escenas) ============
// Lienzo 1080×1920 (9:16) · 30 fps · 68.98 s = 2070 cuadros · audio = voz.mp3 (1.10x)
// Zonas seguras: gráficos dentro de x 60–1020 y página y 300–1250 (escenario); subtítulos en y 1290–1440 (nada de gráficos ahí).
// Micro-copy: máximo 4 palabras por momento visual (sin contar subtítulos). Bucle: nada se anima en los últimos 0.5 s.
const CFG={FPS:30,DUR:+(WORDS[WORDS.length-1][2]+.1).toFixed(2),W:1080,H:1920,
 POP:'back.out(1.35)',   // entradas: suaves, un solo rebote leve
 MOVE:'power3.inOut',    // desplazamientos
 OUT:'power2.in',        // salidas
 T:{pop:.5,move:.7,out:.3}};
gsap.set('.o',{opacity:0,transformOrigin:'50% 50%'});gsap.set('#f1,#f2,#f3',{transformOrigin:'0% 50%'});gsap.set('#clkH',{transformOrigin:'50% 100%'});
gsap.set('#l1,#l2,#l3',{transformOrigin:'50% 0%'});
gsap.set('.st,.big,.lb',{xPercent:-50,yPercent:-50});
gsap.set('.pl',{xPercent:-50,opacity:0});
document.querySelectorAll('.st').forEach(e=>gsap.set(e,{rotation:+e.dataset.r}));
const tl=gsap.timeline({paused:true});
const ST=(s,v)=>gsap.set(s,v);
// utilidades: entrar (POP), salir (OUT), mover (MV)
const POP=(s,t,sc,x,y,d)=>{const f={scale:.3,opacity:0},v={scale:sc||1,opacity:1,duration:d||CFG.T.pop,ease:CFG.POP,immediateRender:false};if(x!==undefined){f.x=x;f.y=y;v.x=x;v.y=y;}tl.fromTo(s,f,v,t);};
const OUT=(s,t,d)=>tl.to(s,{opacity:0,scale:'*=0.7',duration:d||CFG.T.out,ease:CFG.OUT},t);
const MV=(s,t,v,d,e)=>tl.to(s,Object.assign({duration:d||CFG.T.move,ease:e||CFG.MOVE},v),t);
const FROM=(s,t,f,v,d)=>tl.fromTo(s,f,Object.assign({duration:d||CFG.T.pop,ease:CFG.POP,immediateRender:false},v),t);
const SPIN=(s,t,deg,d)=>tl.to(s,{rotation:'+='+deg,duration:d,ease:'none'},t);
const PLI=(s,t)=>tl.fromTo(s,{opacity:0,scale:.6},{opacity:1,scale:1,duration:.4,ease:CFG.POP,immediateRender:false},t);
const ROW=[230,540,850];   // fila de cartas chicas (arriba)

// ============ ESCENA 1 · HOOK (0–6.1) ============
// Acción: niño con estrellitas de travesura; en «tres situaciones» caen tres cartas boca abajo (1, 2, 3) sobre una mesa.
// Persisten: las cartas (se abren una por una). Imagen final: niño y tres cartas sobre la mesa.
function escena1(){
 POP('#hd',0.05,1,540,400);
 [['#tv1',330,300],['#tv2',760,280],['#tv3',300,520],['#tv4',790,520]].forEach(([s,x,y],i)=>{POP(s,at('conductas')+i*.35,.8,x,y);tl.to(s,{rotation:30,duration:.6,yoyo:true,repeat:3,ease:'sine.inOut'},at('travesuras')+i*.1);});
 POP('#sTr',at('travesuras'),1);
 const tTr=at('tres');
 ['#tv1','#tv2','#tv3','#tv4','#sTr'].forEach(s=>OUT(s,tTr-.3));
 POP('#mesa',tTr-.1,1,540,800);
 ['#b1','#b2','#b3'].forEach((s,i)=>FROM(s,tTr+i*.25,{opacity:0,x:ROW[i],y:-100,rotation:i%2?14:-14,scale:.8},{opacity:1,x:ROW[i],y:700,rotation:i%2?4:-4,scale:.8},.6));
}
// ============ ESCENA 2 · DESARROLLO (6.1–20.1) ============
// Acción: cada carta se abre en su escena y al terminar queda chica en la fila de arriba.
//   ① dos niños: la burbuja de uno corta la del otro; el boleto del turno tiembla.
//   ② tres barras de actividad arrancan y se quedan a medias.
//   ③ de la mochila sale volando la nota, caen lápiz y cuaderno; la burbuja «¡Escucha!» pasa de largo.
// Imagen final: fila con las tres cartas (Interrumpe, Incompleto, Olvida).
function escena2(){
 const tP=at('primera');
 OUT('#hd',tP-.3);OUT('#mesa',tP-.3);
 MV('#b1',tP-.2,{x:540,y:450,scale:1.4,rotation:0,opacity:0},.5);
 MV('#b2',tP-.2,{x:540,y:120,scale:.5,rotation:0},.5);MV('#b3',tP-.2,{x:850,y:120,scale:.5,rotation:0},.5);
 // ① interrumpe
 POP('#kA',tP+.1,.85,300,600);POP('#kB',tP+.2,.85,780,600);
 POP('#bA',tP+.4,1,800,330);
 FROM('#bI',at('interrumpe',-.1),{opacity:0,scale:.3,x:420,y:330},{opacity:1,scale:1.1,x:560,y:330},.4);
 tl.to('#bA',{x:880,rotation:12,opacity:.5,duration:.3},at('interrumpe',.1));
 tl.to('#bI',{x:'+=14',duration:.08,yoyo:true,repeat:7},at('constantemente'));
 POP('#sIn',at('interrumpe',.2),1);
 POP('#tk',at('esperar',-.2),1,540,560);
 tl.to('#tk',{rotation:10,duration:.1,yoyo:true,repeat:5},at('turno',-.3));
 tl.to('#kA',{y:'-=40',duration:.18,yoyo:true,repeat:3,ease:'sine.out'},at('esperar'));
 const tS=at('segunda');
 ['#kA','#kB','#bA','#bI','#tk','#sIn'].forEach(s=>MV(s,tS-.3,{x:230,y:120,scale:.15,opacity:0},.4));
tl.set('#b1',{opacity:0},tS-.3);
 FROM('#q1',tS-.05,{opacity:0,scale:.2,x:230,y:120},{opacity:1,scale:.6,x:230,y:120},.4);
 MV('#b2',tS,{x:540,y:450,scale:1.4,opacity:0},.5);
 // ② incompleto
 [400,560,720].forEach((y,i)=>{POP('#br'+(i+1),tS+.2+i*.12,1,560,y);tl.set('#f'+(i+1),{x:305,y,opacity:1,scaleX:0},tS+.3);});
 [.35,.5,.25].forEach((v,i)=>tl.to('#f'+(i+1),{scaleX:v,duration:.9,ease:'power1.out'},at('comienza')+i*.25));
 [.38,.52,.28].forEach((v,i)=>tl.to('#f'+(i+1),{scaleX:v,duration:.3},at('abandona')+i*.15));
 tl.to('#br1,#br2,#br3,#f1,#f2,#f3',{filter:'blur(3px)',opacity:.55,duration:.4},at('terminarlas',-.2));
 POP('#sDe',at('abandona'),1);
 const tT=at('tercera');
 ['#br1','#br2','#br3','#f1','#f2','#f3','#sDe'].forEach(s=>MV(s,tT-.3,{x:540,y:120,scale:.15,opacity:0},.4));
 FROM('#q2',tT-.05,{opacity:0,scale:.2,x:540,y:120},{opacity:1,scale:.6,x:540,y:120},.4);
 MV('#b3',tT,{x:540,y:450,scale:1.4,opacity:0},.5);
 // ③ olvida
 POP('#mc',tT+.2,1,540,580);
 tl.set('#nt',{x:540,y:520,opacity:1,scale:1.3},at('olvida',-.1));
 tl.to('#nt',{x:880,y:240,rotation:40,opacity:0,duration:1,ease:CFG.OUT},at('olvida'));
 POP('#sOl',at('instrucciones'),1);
 FROM('#pc',at('pierde'),{opacity:0,x:540,y:560,rotation:0},{opacity:1,x:250,y:780,rotation:-30},.6);
 FROM('#nb',at('materiales'),{opacity:0,x:540,y:560,rotation:0},{opacity:1,x:830,y:770,rotation:24},.6);
 FROM('#sp',at('parece',0,1),{opacity:0,x:120,y:300},{opacity:1,x:300,y:300},.4);
 tl.to('#sp',{x:960,y:330,rotation:10,opacity:0,duration:1,ease:'power1.in'},at('escuchar',-.2));   // pasa de largo
 const tE=at('estas situaciones');
 ['#mc','#pc','#nb','#sOl'].forEach(s=>MV(s,tE-.3,{x:850,y:120,scale:.15,opacity:0},.4));
 FROM('#q3',tE-.05,{opacity:0,scale:.2,x:850,y:120},{opacity:1,scale:.6,x:850,y:120},.4);
}
// ============ ESCENA 3 · GIRO (20.1–34.4) ============
// Acción: engranaje «Autorregulación»; tres niños, solo uno resaltado (algunos niños con TDAH);
//   de cada carta baja una línea a su concepto: Impulsos, Atención, Organización (con engranajes chicos).
// Persisten: las cartas de arriba. Imagen final: tres cartas conectadas a tres conceptos.
function escena3(){
 FROM('#gR',at('estas situaciones',.4),{opacity:0,scale:.3,x:540,y:470,rotation:0},{opacity:1,scale:1,x:540,y:470,rotation:60},.6);
 SPIN('#gR',at('estas situaciones',1),300,4.2);
 PLI('#lR',at('autorregulacion'));
 const tAl=at('en algunos');
 OUT('#gR',tAl-.2);tl.to('#lR',{opacity:0,duration:.3},tAl-.2);
 [['#k1',300],['#k2',540],['#k3',780]].forEach(([k,x],i)=>POP(k,at('algunos')+i*.12,.7,x,500));
 const tTd=at('tdah');
 tl.to('#k1,#k3',{filter:'blur(5px)',opacity:.35,duration:.4},tTd);   // enfoque: solo algunos
 tl.to('#k2',{scale:.85,duration:.4},tTd);PLI('#lT',tTd+.1);
 const tCo=at('controlar');
 ['#k1','#k2','#k3'].forEach(s=>OUT(s,tCo-.4));tl.to('#lT',{opacity:0,duration:.3},tCo-.4);
 [['#l1','#cI','#gA',at('controlar'),0],['#l2','#cA','#gB',at('atencion'),1],['#l3','#cO','#gC',at('organizar'),2]].forEach(([l,c,gq,t,i])=>{
  FROM(l,t-.2,{opacity:0,scaleY:0,x:ROW[i],y:185},{opacity:1,scaleY:1,x:ROW[i],y:185},.4);
  PLI(c,t+.1);
  FROM(gq,t+.2,{opacity:0,scale:.3,x:ROW[i],y:640},{opacity:1,scale:1,x:ROW[i],y:640});
  SPIN(gq,t+.6,360,4);});
}
// ============ ESCENA 4 · PROVOCACIÓN (34.4–48.2) ============
// Acción: las líneas se rompen y cae el sello «No confirma TDAH»; un «?» grande sobre el niño;
//   una lupa recorre una línea de tiempo con reloj, casa y escuela.
// Persiste: la lupa (pasa al cierre). Imagen final: línea de tiempo con casa y escuela y «Observa el contexto».
function escena4(){
 const tSo=at('solas');
 ['#l1','#l2','#l3'].forEach((l,i)=>tl.to(l,{rotation:i%2?25:-25,y:'+=60',opacity:0,duration:.6,ease:CFG.OUT},tSo+i*.08));
 tl.to('#gA,#gB,#gC,#cI,#cA,#cO',{filter:'blur(5px)',opacity:.3,duration:.4},tSo);
 FROM('#sNo',at('confirman'),{opacity:0,scale:2.2},{opacity:1,scale:1},.35);
 const tPr=at('la pregunta');
 ['#q1','#q2','#q3','#gA','#gB','#gC','#cI','#cA','#cO','#sNo'].forEach(s=>OUT(s,tPr-.2));
 POP('#hd',tPr,1,540,640);
 POP('#qm',at('por que',-.1),1.5,540,300);
 tl.to('#qm',{rotation:10,duration:.15,yoyo:true,repeat:3},at('porta'));
 const tTa=at('tambien conviene');
 OUT('#hd',tTa-.2);OUT('#qm',tTa-.2);
 POP('#tln',tTa,1,540,640);
 POP('#clk',at('desde',-.1),1,140,480);tl.to('#clkH',{rotation:720,duration:3,ease:'none'},at('desde'));
 FROM('#lp',at('cuando'),{opacity:0,scale:.3,x:140,y:640},{opacity:1,scale:.9,x:140,y:640});
 MV('#lp',at('ocurre'),{x:900},at('diaria',.3)-at('ocurre'),'power1.inOut');
 POP('#hs',at('vida',-.6),.55,400,470);POP('#sc',at('diaria',-.3),.55,700,470);
 POP('#sCx',at('diaria',.2),1);
}
// ============ ESCENA 5 · CIERRE (48.2–63.8) ============
// Acción: la lupa crece al centro (valoración integral); llegan las piezas Desarrollo, Conducta, Contextos y encajan;
//   la lupa salta frenética entre travesuras → ✗; luego se calma sobre el niño y se enciende la bombilla.
// Persisten: lupa, estrellitas y niño del inicio. Imagen final: niño con la bombilla encendida.
function escena5(){
 const tEl=at('el tdah');
 ['#tln','#clk','#hs','#sc','#sCx'].forEach(s=>OUT(s,tEl-.2));
 MV('#lp',tEl,{x:540,y:430,scale:1.8},.7);
 POP('#sVi',at('valoracion'),1);
 const tEn=at('es necesario');
 OUT('#sVi',tEn-.2);
 MV('#lp',tEn,{x:540,y:170,scale:.8},.6);
 POP('#pz0',at('desarrollo',-.1),1,210,560);POP('#pz1',at('comportamiento',-.1),1,540,560);POP('#pz2',at('contextos',-.4),1,870,560);
 MV('#pz0',at('contextos',.3),{x:300},.5);MV('#pz2',at('contextos',.3),{x:780},.5);
 tl.to('#pz0,#pz1,#pz2',{scale:1.05,duration:.25,yoyo:true,repeat:1},at('contextos',.8));
 const tNs=at('no se trata');
 ['#pz0','#pz1','#pz2'].forEach(s=>OUT(s,tNs-.2));
 [['#tv1',240,400],['#tv2',820,360],['#tv3',300,760],['#tv4',800,740]].forEach(([s,x,y],i)=>POP(s,tNs+i*.1,.8,x,y));
 const hop=[[240,400],[820,360],[300,760],[800,740]];
 hop.forEach(([x,y],i)=>MV('#lp',at('buscar',-.2)+i*.35,{x,y,scale:.9},.3));
 POP('#xx',at('travesura',-.1),1.3,540,560);
 const tSt=at('se trata',0,1);
 ['#tv1','#tv2','#tv3','#tv4','#xx'].forEach(s=>OUT(s,tSt-.2));
 POP('#hd',tSt,1,540,620);
 MV('#lp',tSt,{x:780,y:560,scale:.8},1);
 FROM('#bu',at('entender'),{opacity:0,scale:.3,x:540,y:340},{opacity:1,scale:.6,x:540,y:340});
 POP('#sEd',at('dificultad'),1);
}
// ============ ESCENA 6 · CTA (63.8–69) ============
// Acción: vuelven las tres cartas; una late («¿cuál?»); burbuja de comentarios; aviso final y web (quietos los últimos 0.5 s).
// Imagen final: aviso «Este video orienta y no diagnostica.» + web.
function escena6(){
 const tHa=at('has');
 ['#hd','#lp','#bu','#sEd'].forEach(s=>OUT(s,tHa-.2));
 [['#q1',200],['#q2',540],['#q3',880]].forEach(([q,x],i)=>FROM(q,tHa+i*.15,{opacity:0,scale:.3,x,y:470,filter:'blur(0px)'},{opacity:1,scale:.9,x,y:470}));
 FROM('#cm',at('comenta',-.1),{opacity:0,scale:.3,x:540,y:770},{opacity:1,scale:.6,x:540,y:770});
 POP('#sDu',at('comenta',.2),1);
 tl.to('#q1,#q3',{opacity:.45,duration:.3},at('cual'));tl.to('#q2',{scale:1,duration:.25,yoyo:true,repeat:1},at('cual'));
 const tF=at('genera',-.2);
 ['#q1','#q2','#q3','#cm','#sDu'].forEach(s=>OUT(s,tF-.1));
 tl.fromTo('#end',{opacity:0,scale:.92,transformOrigin:'50% 50%'},{opacity:1,scale:1,duration:.5,ease:CFG.POP,immediateRender:false},tF+.2);
}
escena1();escena2();escena3();escena4();escena5();escena6();
// ============ SUBTÍTULOS (tiempos reales de words.json) ============
const KEYS=new Set(['travesuras','interrumpe','abandona','olvida','instrucciones','autorregulacion','tdah','impulsos','atencion','organizar','diagnostico','valoracion','integral','desarrollo','contextos','entender','dificultad']);
(function(){const caps=[];let cur=[];
 const flush=()=>{if(cur.length){caps.push(cur);cur=[];}};
 WORDS.forEach((w,i)=>{cur.push({w:w[0],t:w[1],e:w[2]});const nx=WORDS[i+1];
  if(cur.length>=3||/[,.:?…]$/.test(w[0])||(nx&&nx[1]-w[2]>.45))flush();});flush();
 caps.forEach((c,i)=>{const d=document.createElement('div');d.className='cap';d.id='cap'+i;
  d.innerHTML=c.map((x,j)=>`<span class="pw${KEYS.has(norm(x.w)[0])?' k':''}" id="c${i}w${j}">${x.w}</span>`).join(' ');document.body.appendChild(d);
  const s0=c[0].t,e0=Math.min(i+1<caps.length?caps[i+1][0].t-.03:CFG.DUR-.05,c[c.length-1].e+.9);
  tl.set('#cap'+i,{opacity:1},s0);tl.set('#cap'+i,{opacity:0},e0);
  c.forEach((x,j)=>tl.fromTo('#c'+i+'w'+j,{opacity:0,scale:.5,y:10,transformOrigin:'50% 80%'},{opacity:1,scale:1,y:0,duration:.25,ease:'power2.out',immediateRender:false},x.t));});
})();
window.DUR=CFG.DUR;
window.seek=t=>{tl.time(Math.min(t,tl.duration()));document.getElementById('rtb').setAttribute('seed',1+Math.floor(t*12)%7);};
</script></body></html>
