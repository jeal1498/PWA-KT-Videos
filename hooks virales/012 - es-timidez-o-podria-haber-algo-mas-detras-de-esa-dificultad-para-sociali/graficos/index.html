 ${[['Señales sociales',360],['Conversaciones',460],['Situaciones',560]].map((r,i)=>`<div id="rw${i}" style="position:absolute;left:34px;top:${r[1]-10}px;width:620px;height:96px;border-radius:26px;background:#fff;border:3px solid #2E2545;display:flex;align-items:center;gap:20px;padding:0 24px;font:700 44px/1 'Maven Pro';opacity:0"><span style="width:56px;height:56px;border-radius:50%;background:#E7E1F4;display:flex;align-items:center;justify-content:center;font:700 40px/1 Outfit">${i+1}</span>${r[0]}<span style="margin-left:auto;width:50px;height:50px;border-radius:50%;background:#2E2545;color:#fff;font:700 34px/50px Outfit;text-align:center">?</span></div>`).join('')}

 <svg style="position:absolute;left:0;top:0" width="800" height="600"><path d="M90 90V400H730" fill="none" stroke="#2E2545" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

 <svg style="position:absolute;left:0;top:0" width="800" height="640"><path id="n1" pathLength="1" d="M400 330L170 230" stroke="#2E2545" stroke-width="7" fill="none" stroke-dasharray="1" stroke-dashoffset="1" stroke-linecap="round"/><path id="n2" pathLength="1" d="M400 330L630 230" stroke="#2E2545" stroke-width="5" fill="none" stroke-dasharray=".04 .05" stroke-dashoffset="1" stroke-linecap="round"/></svg>
 <div id="np0" class="dot" style="left:90px;top:170px;width:130px;height:130px;opacity:0">${AVA(...PEER[0])}</div><div id="np1" class="dot" style="left:580px;top:170px;width:130px;height:130px;opacity:0">${AVA(...PEER[1])}</div><div id="np2" class="dot" style="left:335px;top:470px;width:130px;height:130px;border-style:dashed;opacity:0">${AVA(...PEER[2])}</div>
 <div class="dot" style="left:320px;top:260px;width:160px;height:160px;border-color:#2E2545">${KIDA}</div></div>`);
add(`<div class="abs" id="rgs" style="left:0;top:800px;width:1080px;opacity:0"></div>`);
[['rs','Desarrollo social',J.group.replace('width="72" height="72"','width="90" height="90"'),170],['rc','Comunicativo',J.chat.replace('width="56" height="56"','width="90" height="90"'),570]].forEach(f=>add(`<div class="abs card" id="${f[0]}" style="left:${f[3]}px;top:760px;width:380px;height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;opacity:0;text-align:center;font:700 44px/1.1 Outfit;padding:0 16px"><div style="position:relative;width:240px;height:240px"><svg width="240" height="240" viewBox="-120 -120 240 240"><circle r="100" fill="none" stroke="#EDE8F5" stroke-width="22"/><circle id="${f[0]}c" r="100" fill="none" stroke="#2E2545" stroke-width="22" stroke-linecap="round" stroke-dasharray="628" stroke-dashoffset="628" transform="rotate(-90)"/></svg><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">${f[2]}</div></div>${f[1]}</div>`));
add(CARD('psh',440,160,800)+`<div class="dot" style="left:40px;top:150px;width:150px;height:150px;border-color:#2E2545">${KIDA}</div>
 <svg style="position:absolute;left:0;top:0" width="800" height="440"><path id="pa2" pathLength="1" d="M205 225H520M488 190L522 225L488 260" fill="none" stroke="#C0392B" stroke-width="12" stroke-dasharray="1" stroke-dashoffset="1" stroke-linecap="round" stroke-linejoin="round"/></svg>
 ${[[580,120],[660,230],[570,290]].map((p,i)=>`<div class="dot" style="left:${p[0]}px;top:${p[1]}px;width:110px;height:110px">${AVA(...PEER[i])}</div>`).join('')}
 <div id="xb" style="position:absolute;left:330px;top:150px;width:110px;height:110px;border-radius:50%;background:#C0392B;border:5px solid #fff;color:#fff;font:700 70px/100px Outfit;text-align:center;opacity:0">✕</div>
 <div class="lbl" style="position:absolute;left:34px;top:28px">Obligarlo</div></div>`);
add(`<div class="abs" id="chs" style="left:160px;top:1300px;width:800px;display:flex;gap:14px;justify-content:center;opacity:1">${['Hablar','Jugar','Otros medios'].map((t,i)=>`<span id="ch${i}" class="pill" style="background:#E7E1F4;font-size:42px;opacity:0">${t}</span>`).join('')}</div>`);
add(`<div class="abs pill" id="mn" style="left:560px;top:1400px;transform:translateX(-50%);background:#2E2545;color:#fff;font-size:46px;opacity:0">A su manera</div>`);
// S6 · CTA
add(CARD('opt',360)+`<div class="lbl" style="position:absolute;left:34px;top:28px">¿Cuál ves?</div>
 <div id="o1" class="pill" style="position:absolute;left:34px;right:34px;top:96px;height:100px;border:3px solid #2E2545;background:#fff;font-size:48px;line-height:68px;text-align:center;opacity:0">Necesita tiempo</div>
 <div id="o2" class="pill" style="position:absolute;left:34px;right:34px;top:226px;height:100px;border:3px solid #2E2545;background:#fff;font-size:48px;line-height:68px;text-align:center;opacity:0">Otras dificultades</div></div>`);
add(`<div class="abs card" id="cmp" style="left:160px;top:1100px;width:800px;height:170px;display:flex;align-items:center;gap:22px;padding:0 30px;opacity:0"><div class="dot" style="position:relative;width:96px;height:96px;flex:none">${KIDA}</div><div id="ctx" style="flex:1;font:700 46px/1.1 'Maven Pro'"></div><span id="snb" style="width:92px;height:92px;border-radius:50%;background:#2E2545;display:flex;align-items:center;justify-content:center;flex:none">${J.plane}</span></div>`);
add(`<div class="abs end" id="end"><div class="abs" style="left:150px;width:840px;top:500px;text-align:center;font:700 70px/1.15 Outfit">Este video orienta y no diagnostica.</div>
 <div class="abs" style="left:160px;top:780px;width:800px;height:600px;background:#fff;border:2px solid #E3DCEF;border-radius:28px;box-shadow:0 22px 50px rgba(56,47,81,.12);display:flex;flex-direction:column;align-items:center;padding-top:84px;gap:24px;text-align:center"><div style="font:700 78px/1 Outfit">Karen Trujillo</div><div style="font:700 44px/1.2 'Maven Pro'">Neuropsicóloga · Cancún</div><div class="pill" style="background:#E7E1F4;font-size:42px;padding:18px 34px">Cédula 11009616</div><div class="pill" style="background:#2E2545;color:#fff;font-size:40px;padding:18px 34px;margin-top:6px">psicologakarentrujillo.com.mx</div></div></div>`);
add(`<div class="abs" id="ley" style="left:150px;top:190px;background:#fff;border:3px solid #2E2545;border-radius:999px;font:700 40px/1 'Maven Pro';padding:14px 30px;box-shadow:0 10px 24px rgba(56,47,81,.12);opacity:0">Neuropsicóloga Karen Trujillo</div>`);

// ============ LÍNEA DE TIEMPO ============
gsap.set('#world > *',{opacity:0});gsap.set('#chs',{opacity:1});gsap.set('.sel',{opacity:0});
const tl=gsap.timeline({paused:true});
const POP=(s,t,d)=>tl.fromTo(s,{opacity:0,y:40,scale:.94},{opacity:1,y:0,scale:1,duration:d||.45,ease:CFG.POP,immediateRender:false},t);
const OUT=(s,t)=>tl.to(s,{opacity:0,y:-60,duration:.3,ease:CFG.OUT},t);
const IN=(s,t)=>tl.fromTo(s,{opacity:0},{opacity:1,duration:.3,immediateRender:false},t);
const DIM=(s,t)=>tl.to(s,{opacity:.35,filter:'blur(2px)',duration:.4},t);
let cur=-1;
const STEP=(i,t)=>{if(cur>=0)tl.to('#st'+cur,{opacity:0,y:-20,duration:.25},t-.25);
 tl.fromTo('#st'+i,{opacity:0,y:20},{opacity:1,y:0,duration:.35,ease:CFG.POP,immediateRender:false},t);
 tl.to('#ticks',{y:-(i+1)*110,duration:.6,ease:CFG.MOVE},t-.25);
 tl.fromTo('#av',{scale:.8},{scale:1,duration:.35,ease:CFG.POP,immediateRender:false},t);cur=i;};
const TXT=(s,t,tx)=>tl.call(()=>{document.querySelector(s).innerHTML=tx;},null,t);
const CH=(s,t)=>tl.fromTo(s,{opacity:0,scale:.3},{opacity:1,scale:1,duration:.3,ease:CFG.POP,immediateRender:false},t);
const DRAW=(s,t,d,to)=>tl.to(s,{strokeDashoffset:to||0,duration:d||.5,ease:'power1.inOut'},t);

// ESCENA 1 · HOOK (0–5.1) — Acción: mapa de una reunión: cuatro niños juntos (unidos por líneas) a la derecha y, abajo a la izquierda, tu hijo;
//  aparece su deseo (un globo con un grupo); una flecha avanza hacia el grupo y se detiene con un «?».
// Persisten: mapa, hijo y grupo (hilo; vuelven al final con el camino completo). Imagen final: flecha detenida con «?».
function escena1(){
 STEP(0,0);POP('#map',0);
 [0,1,2,3].forEach(i=>CH('#pg'+i,.25+i*.2));DRAW('#lk',at('amigos',-.2),.8);
 CH('#wnt',at('quiere'));tl.to('#wnt',{opacity:0,duration:.3},at('pero'));
 DRAW('#gz',at('acercarse'),.7);CH('#qb',at('parece')+.2);
 tl.to('#chd',{x:-14,duration:.08,yoyo:true,repeat:5},at('hacerlo'));
}
// ESCENA 2 · DESARROLLO (5.1–15.0) — Acción: se suma un adulto junto al niño («Cerca de ti»); un patio con tres juegos, invitaciones «¿Juegas?»
//  y un salto que evita dos; una batería de «Confianza» que sube a 80 %; una etiqueta «HOLA, SOY Tímido».
// Persisten: hijo (avatar). Imagen final: etiqueta «Tímido» sobre el niño.
function escena2(){
 const t0=at('en reuniones');
 STEP(1,t0);CH('#adl',t0);POP('#nr',at('cerca'));
 const t1=at('en la escuela');
 ['#map','#nr'].forEach(s=>OUT(s,t1-.3));POP('#pat',t1);
 [0,1,2].forEach(i=>{POP('#gm'+i,at('puede evitar')+i*.12-.5);CH('#iv'+i,at('algunos juegos')+i*.15-.3);});
 CH('#pk',at('evitar'));DRAW('#by',at('evitar'),.8);tl.to(['#gm0','#gm1'],{opacity:.4,duration:.3},at('algunos juegos'));
 const t2=at('quiza');
 OUT('#pat',t2-.3);POP('#bat',t2);
 const o={v:0};tl.to(o,{v:80,duration:2.2,ease:'power1.inOut',onUpdate(){document.getElementById('bpc').textContent=Math.round(o.v)+'%';document.getElementById('bfl').style.width=o.v+'%';}},at('tarda'));
 tl.to('#hnd',{rotation:720,transformOrigin:'0px 0px',duration:2.2,ease:'none'},at('tarda'));
 const t3=at('y piensas');
 OUT('#bat',t3-.3);POP('#tg',t3);
 tl.fromTo('#bdg',{opacity:0,y:-120,rotation:-12},{opacity:1,y:0,rotation:-3,duration:.5,ease:CFG.POP,immediateRender:false},at('simplemente'));
 TXT('#bnm',at('es timido'),'Tímido');
}
// ESCENA 3 · GIRO (15.0–32.5) — Acción: el niño y dos caminos. Arriba (timidez): línea con reloj hasta «Confianza ✓». Abajo: tres paradas con «?»
//  (señales sociales, conversaciones, situaciones); etiqueta «Pueden aparecer en autismo»; y «Otras explicaciones».
// Persisten: el niño (inicio de los caminos). Imagen final: dos caminos con «Otras explicaciones».
function escena3(){
 const t0=at('la timidez');
 OUT('#tg',t0-.3);STEP(2,t0);POP('#dg',t0);
 IN('#ln1',t0+.3);DRAW('#pa',at('timidez'),1.2);CH('#clk',at('tiempo'));CH('#cf',at('confianza'));
 tl.to('#dg',{height:770,duration:.6,ease:CFG.MOVE},at('pero tambien',-.1));DRAW('#pb',at('pero tambien'),.8);
 [0,1,2].forEach(i=>POP('#rw'+i,[at('senales'),at('conversaciones'),at('situaciones')][i]-.2,.4));
 POP('#ata',at('autismo'));
 POP('#oex',at('otras'));
 tl.to('#cf',{opacity:.45,duration:.3},at('aunque'));
}
// ESCENA 4 · PROVOCACIÓN (32.5–42.8) — Acción: gráfica «Comodidad social vs. Tiempo»: «Reservado» sube con el tiempo; «Persistente» se queda abajo;
//  luego dos círculos que se cruzan poco: «Tímidos» y «Espectro» con «No todos».
// Imagen final: círculos casi separados con «No todos».
function escena4(){
 const t0=at('por eso');
 OUT('#dg',t0-.3);STEP(3,t0);POP('#cht',t0);
 DRAW('#up',at('confundir'),1.6);CH('#lg1',at('reservado'));
 DRAW('#fl',at('persistentes'),1.2);CH('#lg2',at('persistentes'));
 const t1=at('tampoco');
 OUT('#cht',t1-.3);POP('#vn',t1);
 CH('#cA',at('asumir'));CH('#cB',at('espectro'));CH('#nt2',at('dentro del'));
}
// ESCENA 5 · CIERRE (42.8–57.4) — Acción: el niño con tres compañeros: una relación firme, una punteada y una sin línea («¿Qué ocurre?»); dos anillos
//  (Desarrollo social, Comunicativo) que se llenan; una flecha roja que empuja al grupo, tachada; vuelve el mapa y el camino se completa a su manera.
// Persisten: niño → mapa del inicio. Imagen final: mapa con camino verde, ✓ y «Hablar · Jugar · Otros medios».
function escena5(){
 const t0=at('lo importante');
 OUT('#vn',t0-.3);STEP(4,t0);POP('#net',t0);
 POP('#qq',at('que ocurre'));
 [0,1,2].forEach(i=>CH('#np'+i,at('que ocurre')+.2+i*.2));
 DRAW('#n1',at('afecta'),.5);DRAW('#n2',at('sus relaciones'),.5);
 const t1=at('una evaluacion');
 OUT('#net',t1-.3);POP('#rs',t1);POP('#rc',t1+.2);
 tl.to('#rsc',{strokeDashoffset:190,duration:1.1,ease:'power2.out'},at('desarrollo social'));tl.to('#rcc',{strokeDashoffset:230,duration:1.1,ease:'power2.out'},at('comunicativo'));
 const t2=at('no se trata');
 ['#rs','#rc'].forEach(s=>OUT(s,t2-.3));POP('#psh',t2);
 DRAW('#pa2',at('obligarlo'),.5);CH('#xb',at('socializar'));
 const t3=at('se trata de',0,1);
 OUT('#psh',t3-.3);
 tl.fromTo('#map',{opacity:0,y:40,scale:.94},{opacity:1,y:0,scale:1,duration:.45,ease:CFG.POP,immediateRender:false},t3);
 tl.set(['#qb','#gz','#wnt'],{opacity:0},t3);tl.set('#chd',{x:0},t3);
 [0,1,2].forEach(i=>CH('#ch'+i,[at('entender'),at('necesita'),at('relacionarse')][i]));
 DRAW('#rt',at('necesita'),1.7);CH('#okb',at('a su manera')+.5);POP('#mn',at('a su manera'));
}
// ESCENA 6 · CTA (57.4–63.9) — Acción: «¿Cuál ves?» con dos botones (Necesita tiempo, Otras dificultades); «Comparte tu experiencia» con una línea
//  que se escribe y un botón de enviar; aviso final y datos (quietos el último 0.5 s).
// Imagen final: aviso + datos de Karen.
function escena6(){
 const t0=at('tu hijo necesita');
 ['#map','#chs','#mn'].forEach(s=>OUT(s,t0-.3));tl.to('#st4',{opacity:0,duration:.3},t0-.3);
 POP('#opt',t0);
 CH('#o1',at('necesita tiempo'));CH('#o2',at('otras dificultades'));
 tl.to('#o1',{backgroundColor:'#E7E1F4',duration:.2},at('tiempo',0,1)+.4);tl.to('#o2',{backgroundColor:'#E7E1F4',duration:.2},at('otras dificultades')+.5);
 const tc=at('comparte');
 tl.to('#snb',{backgroundColor:'#1E9E6A',duration:.2},at('experiencia'));
 POP('#cmp',at('o has observado'));
 const w='Mi hijo...';[...w].forEach((c,i)=>TXT('#ctx',tc+.2+i*.08,w.slice(0,i+1)));
 const tF=at('experiencia',.35);
 ['#opt','#cmp'].forEach(s=>OUT(s,tF-.1));
 tl.to(['#av','#tlTop','#tl','#ticks'],{opacity:.25,duration:.3},tF);tl.to('#ley',{opacity:0,duration:.3},tF);
 tl.fromTo('#end',{opacity:0,scale:.96},{opacity:1,scale:1,duration:.45,ease:CFG.POP,immediateRender:false},tF+.1);
}
escena1();escena2();escena3();escena4();escena5();escena6();
tl.fromTo('#ley',{opacity:0,y:-10},{opacity:1,y:0,duration:.5,immediateRender:false},.3);

// ============ SUBTÍTULO ARRIBA (palabras por venir borrosas; clave en recuadro de selección) ============
const KEYS=new Set(['amigos','acercarse','timido','confianza','senales','autismo','explicaciones','reservado','persistentes','espectro','comprender','especializada','socializar','manera','dificultades','experiencia']);
(function(){const ph=[];let cur=[];const fl=()=>{if(cur.length){ph.push(cur);cur=[];}};
 WORDS.forEach((w,i)=>{cur.push({w:w[0],t:w[1],e:w[2]});const nx=WORDS[i+1];if(cur.length>=6||/[,.:?]$/.test(w[0])||(nx&&nx[1]-w[2]>.45))fl();});fl();
 const C=document.getElementById('caps');
 ph.forEach((p,i)=>{const d=document.createElement('div');d.className='ph abs';d.id='ph'+i;
  d.innerHTML=p.map((x,j)=>{const k=KEYS.has(norm(x.w)[0]);return `<span class="${k?'k':''}" id="p${i}w${j}">${k?'<i class="hl"></i>':''}${x.w}</span>`;}).join('');C.appendChild(d);
  const s0=p[0].t-.12,e0=i+1<ph.length?ph[i+1][0].t-.12:WORDS[WORDS.length-1][2]+.4;
  tl.fromTo(d,{opacity:0,y:16},{opacity:1,y:0,duration:.18,immediateRender:false},s0);tl.to(d,{opacity:0,duration:.12},e0-.12);
  p.forEach((x,j)=>{tl.fromTo('#p'+i+'w'+j,{opacity:.28,filter:'blur(7px)'},{opacity:1,filter:'blur(0px)',duration:.2,immediateRender:false},x.t);
   if(KEYS.has(norm(x.w)[0]))tl.fromTo('#p'+i+'w'+j+' .hl',{opacity:0,scaleX:.6},{opacity:1,scaleX:1,duration:.22,ease:CFG.POP,immediateRender:false},x.t);});
  gsap.set(d.querySelectorAll('span'),{opacity:.28,filter:'blur(7px)'});});
})();
window.DUR=CFG.DUR;
window.seek=t=>{tl.time(Math.min(t,tl.duration()));};
