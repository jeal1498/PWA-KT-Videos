<!doctype html><meta charset=utf-8><style>
@font-face{font-family:Outfit;src:url(Outfit-700-latin.woff2);font-weight:700}
@font-face{font-family:'Maven Pro';src:url(MavenPro-700-latin.woff2);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:'Maven Pro';color:#2E2545;background:#F7F4FA;background-image:linear-gradient(rgba(198,188,226,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(198,188,226,.28) 1px,transparent 1px);background-size:40px 40px}
.a{position:absolute}
.tl{left:98px;top:0;width:4px;height:1920px;background:#DDD5EE}.tt{left:98px;top:0;width:4px;height:250px;background:#2E2545}
.av{left:68px;top:238px;width:64px;height:64px;border-radius:50%;background:#2E2545;box-shadow:0 0 0 6px #F7F4FA;display:flex;align-items:center;justify-content:center}
.chip{left:150px;top:240px;height:64px;border-radius:32px;background:#2E2545;color:#fff;font:700 40px/64px 'Maven Pro';padding:0 24px 0 10px;display:flex;gap:12px;align-items:center}
.chip b{width:66px;height:44px;line-height:44px;border-radius:22px;background:#C6BCE2;color:#2E2545;text-align:center;font-size:30px}
h1{left:160px;right:60px;top:360px;font:700 116px/1.12 Outfit;letter-spacing:-.02em}
.hl{position:relative;display:inline-block;padding:0 14px;z-index:0}
.hl i{position:absolute;left:0;right:0;top:12px;bottom:4px;background:#C6BCE2;border:4px solid #2E2545;z-index:-1}
.hl i::before,.hl i::after{content:"";position:absolute;width:18px;height:18px;background:#fff;border:4px solid #2E2545}
.hl i::before{left:-12px;top:-12px}.hl i::after{right:-12px;bottom:-12px}
.card{left:210px;top:780px;width:720px;height:480px;background:#fff;border:2px solid #E3DCEF;border-radius:28px;box-shadow:0 22px 50px rgba(56,47,81,.12)}
.hd{display:flex;align-items:center;gap:12px;height:84px;padding:0 30px;border-bottom:2px solid #EFEAF6}
.hd i{width:16px;height:16px;border-radius:50%;border:2px solid #2E2545}
.lbl{font:700 22px/1 'Maven Pro';letter-spacing:.14em;text-transform:uppercase;color:#8E86A6}
.pill{border-radius:999px;font:700 24px/1 'Maven Pro';padding:10px 18px}
.ln{height:2px;background:#EDE8F5;margin:0 46px 62px}
.tm{left:570px;top:1320px;transform:translateX(-50%);background:#2E2545;color:#fff;font:700 64px/1 Outfit;padding:22px 44px;border-radius:999px;display:flex;gap:20px;align-items:center}
</style>
<div class="a tl"></div><div class="a tt"></div>
<div class="a av"><svg width="38" height="38" viewBox="-20 -20 40 40"><path d="M-12 12L-14 16L-10 14L12 -8L8 -12Z" fill="#F5E7D6" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
<div class="a chip"><b>01</b>El juego</div>
<h1 class="a">¿Tu hijo juega <span class="hl"><i></i>diferente</span> a los demás niños?</h1>
<div id="cards"></div>
<script>
const AVA=(bg,hair,skin,k)=>`<svg width="100%" height="100%" viewBox="-50 -50 100 100"><circle r="50" fill="${bg}"/><circle cy="4" r="26" fill="${skin||'#F5E7D6'}" stroke="#2E2545" stroke-width="3"/>${[
 `<path d="M-27 0Q-28 -30 0 -30Q28 -30 27 0Q14 -16 -27 0Z" fill="${hair}" stroke="#2E2545" stroke-width="3" stroke-linejoin="round"/>`,
 `<path d="M-28 6Q-32 -30 0 -32Q32 -30 28 6Q26 -12 14 -16Q0 -10 -14 -18Q-26 -12 -28 6Z" fill="${hair}" stroke="#2E2545" stroke-width="3" stroke-linejoin="round"/>`,
 `<circle cx="-14" cy="-24" r="10" fill="${hair}" stroke="#2E2545" stroke-width="3"/><circle cx="14" cy="-24" r="10" fill="${hair}" stroke="#2E2545" stroke-width="3"/><path d="M-26 -4Q-26 -28 0 -28Q26 -28 26 -4Q10 -18 -26 -4Z" fill="${hair}" stroke="#2E2545" stroke-width="3"/>`,
 `<path d="M-26 -6L-20 -26L-8 -18L0 -30L8 -18L20 -26L26 -6Z" fill="${hair}" stroke="#2E2545" stroke-width="3" stroke-linejoin="round"/>`][k]}<circle cx="-9" cy="6" r="3" fill="#2E2545"/><circle cx="9" cy="6" r="3" fill="#2E2545"/><path d="M-7 15Q0 20 7 15" fill="none" stroke="#2E2545" stroke-width="3" stroke-linecap="round"/><path d="M-36 50Q-36 30 0 30Q36 30 36 50" fill="${hair==='#2E2545'?'#F9DEE3':'#fff'}" stroke="#2E2545" stroke-width="3"/></svg>`;

const CAR=(f,w)=>`<svg width="${w}" height="${w*.6}" viewBox="0 0 100 60" style="display:block;overflow:visible"><path d="M6 40Q6 32 15 30L28 14Q31 10 37 10H62Q68 10 72 15L84 30Q94 32 94 40V47H6Z" fill="${f}" stroke="#2E2545" stroke-width="4" stroke-linejoin="round"/><path d="M34 16H48V30H27ZM54 16H63Q66 16 68 19L77 30H54Z" fill="#fff" stroke="#2E2545" stroke-width="3" stroke-linejoin="round"/><circle cx="28" cy="48" r="10" fill="#2E2545"/><circle cx="72" cy="48" r="10" fill="#2E2545"/><circle cx="28" cy="48" r="4" fill="#C6BCE2"/><circle cx="72" cy="48" r="4" fill="#C6BCE2"/></svg>`;
const CF=['#F9DEE3','#C6BCE2','#F5E7D6','#fff','#E7E1F4'],CW=[80,104,128,152,176],GAP=20;
let x=(800-(CW.reduce((a,b)=>a+b)+GAP*4))/2;
const cars=[0,1,2,3,4].map(r=>{const h=`<div style="position:absolute;left:${x}px;bottom:0">${CAR(CF[r],CW[r])}</div>`;x+=CW[r]+GAP;return h;}).join('');
document.getElementById('cards').innerHTML=`<div class="a" style="left:160px;top:1000px;width:800px;height:420px;background:#fff;border:2px solid #E3DCEF;border-radius:28px;box-shadow:0 22px 50px rgba(56,47,81,.12)">
 <div style="position:absolute;left:34px;top:26px;width:100px;height:100px">${AVA('#E7E1F4','#8A6A4E','#F5E7D6',1)}</div><div style="position:absolute;left:156px;top:56px;font:700 52px/1 Outfit">Tu hijo</div>
 <div class="pill" style="position:absolute;right:34px;top:50px;background:#E7E1F4;font-size:30px;padding:14px 22px">Juega distinto</div>
 <div style="position:absolute;left:0;top:170px;width:800px;height:140px">${cars}</div>
 <div style="position:absolute;left:40px;right:40px;top:330px;border-top:5px dashed #B5ABD0"></div></div>`;
</script>
