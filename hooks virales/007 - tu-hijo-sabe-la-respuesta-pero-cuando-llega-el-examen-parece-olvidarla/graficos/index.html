 for(let i=0;i<=WN.length-f.length;i++){let ok=true;for(let j=0;j<f.length;j++)if(WN[i+j]!==f[j]){ok=false;break;}
  if(ok){if((nth||0)===c)return +(WORDS[i][1]+(off||0)).toFixed(2);c++;}}
 throw new Error('no encuentro: '+frag);}
// ---------- dibujos (centrados en 0,0)
function gear(r,n,fill){let p=[];const st=2*Math.PI/n;
 for(let i=0;i<n;i++){const a=i*st;[[-.28,r],[-.18,r+26],[.18,r+26],[.28,r]].forEach(([k,rr])=>{const aa=a+k*st;p.push((rr*Math.cos(aa)).toFixed(1)+' '+(rr*Math.sin(aa)).toFixed(1));});}
 return `<path d="M${p.join('L')}Z" fill="${fill}" ${S}/><circle r="${r*.38}" fill="#fff" ${S}/><circle r="10" fill="#2E2545"/>`;}

g.innerHTML=[
 O('qa',`<rect x="-130" y="-170" width="260" height="340" rx="14" fill="#fff" ${S}/>`+T('2 + 3 =',-30,66)+`<path d="M-80 100H80" fill="none" ${S} stroke-width="6"/>`),

 O('ex',EXAM()),O('ex2',EXAM()),O('ex3',EXAM()),
 O('qmk',T('?',0,190,0,RED)),
 O('kid',`<path d="M-70 110Q-70 -6 0 -6Q70 -6 70 110Z" fill="#F9DEE3" ${S}/><circle cy="-66" r="52" fill="#F5E7D6" ${S}/><path d="M-52 -76Q-52 -130 0 -130Q52 -130 52 -76Q10 -98 -52 -76Z" fill="#2E2545"/><circle cx="-18" cy="-60" r="6" fill="#2E2545"/><circle cx="18" cy="-60" r="6" fill="#2E2545"/><path d="M-16 -36Q0 -22 16 -36" fill="none" ${S} stroke-width="5"/>`),

 O('sp2',`<path d="M-100 -60H100Q112 -60 112 -48V48Q112 60 100 60H-40L-70 100L-62 60H-100Q-112 60 -112 48V-48Q-112 -60 -100 -60Z" fill="#fff" ${S}/><path d="M-70 -24H70M-70 0H70M-70 24H20" fill="none" stroke="#C6BCE2" stroke-width="9" stroke-linecap="round"/>`),
 O('cb',`<rect x="-300" y="-210" width="600" height="420" rx="14" fill="#F5E7D6" ${S}/><rect x="-272" y="-182" width="544" height="364" rx="6" fill="#2E2545"/><rect x="-120" y="210" width="240" height="18" rx="6" fill="#fff" ${S} stroke-width="4"/>`),
 O('ptr',`<path d="M0 0L200 -250" fill="none" ${S} stroke-width="10"/><circle cx="200" cy="-250" r="14" fill="${RED}" ${S} stroke-width="4"/>`),
 O('sun',`<path d="M-40 0A40 40 0 1 0 40 0A40 40 0 1 0 -40 0M0 -62V-84M0 62V84M-62 0H-84M62 0H84M-44 -44L-60 -60M44 -44L60 -60M-44 44L-60 60M44 44L60 60" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>`),
 O('cld',`<path d="M-70 36Q-100 36 -100 6Q-100 -24 -65 -24Q-60 -60 -20 -60Q20 -60 28 -30Q70 -30 70 6Q70 36 40 36Z" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>`),
 O('arw',`<path d="M0 -60V60M-24 34L0 62L24 34" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`),
 O('clk',`<circle r="74" fill="#fff" ${S}/><path d="M0 -58V-66M0 58V66M-58 0H-66M58 0H66" fill="none" ${S} stroke-width="5"/><g id="clkH"><circle r="52" fill="none" stroke="none"/><path d="M0 0V-50" fill="none" stroke="${RED}" stroke-width="8" stroke-linecap="round"/></g><circle r="8" fill="#2E2545"/>`),
 O('wl',WALL),
 O('grd',`<circle r="62" fill="#fff" stroke="${RED}" stroke-width="8"/>`+T('4',28,84,0,RED)),
 O('frs',`<path d="M-60 20L-30 -22L0 20L30 -22L60 20" fill="none" stroke="${RED}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>`),
 O('shf',`<rect x="-250" y="-160" width="500" height="320" rx="12" fill="#F5E7D6" ${S}/><rect x="-224" y="-134" width="448" height="268" rx="6" fill="#fff" ${S} stroke-width="4"/><path d="M-224 0H224" fill="none" ${S} stroke-width="10"/>`+[[-196,'#C6BCE2',70],[-150,'#F9DEE3',84],[-102,'#F5E7D6',66],[-56,'#C6BCE2',80]].map(([x,f,h])=>`<rect x="${x}" y="${-6-h}" width="40" height="${h}" rx="5" fill="${f}" ${S} stroke-width="4"/>`).join('')+[[-180,'#F9DEE3',64],[-136,'#C6BCE2',72],[-90,'#F5E7D6',58],[100,'#F9DEE3',70]].map(([x,f,h])=>`<rect x="${x}" y="${128-h}" width="40" height="${h}" rx="5" fill="${f}" ${S} stroke-width="4"/>`).join('')),
 O('bk',BOOK('#F9DEE3').replace(/<path[^>]*\/>/,'')+`<path d="M-30 -30H30M-30 30H30" fill="none" ${S} stroke-width="4"/>`),
 O('neq',D.neq),
 O('eye',EYE),O('jug',TRAY),O('gau',GAUGE),
 O('bkc',`<g transform="rotate(-8)"><rect x="-80" y="-60" width="160" height="120" rx="8" fill="#F9DEE3" ${S}/><path d="M-80 -30H80M-80 30H80" fill="none" ${S} stroke-width="5"/></g>`+T('zzz',-76,44,70,'#2E2545')),
 O('dmb',`<path d="M-90 0H90" fill="none" ${S} stroke-width="14"/><rect x="-120" y="-50" width="40" height="100" rx="10" fill="#C6BCE2" ${S}/><rect x="80" y="-50" width="40" height="100" rx="10" fill="#C6BCE2" ${S}/>`),
 O('x1',D.cross),O('x2',D.cross),
 ...[[1,ICB],[2,ICC],[3,ICP]].map(([i,ic])=>O('lk'+i,LINK(ic))),
 O('cn1',`<rect x="-55" y="-26" width="110" height="52" rx="26" fill="#C6BCE2" ${S} stroke-width="8"/>`),
 O('cn2',`<rect x="-55" y="-26" width="110" height="52" rx="26" fill="#C6BCE2" ${S} stroke-width="8"/>`),
 O('pin',`<path d="M0 0C-44 -52 -48 -96 0 -96C48 -96 44 -52 0 0Z" fill="${RED}" ${S}/><circle cy="-64" r="13" fill="#fff"/>`),
 ...[1,2,3].map(i=>O('ts'+i,`<rect x="-100" y="-130" width="200" height="260" rx="12" fill="#fff" ${S}/><path d="M-60 -20H60M-60 20H60M-60 60H10" fill="none" stroke="#C6BCE2" stroke-width="8" stroke-linecap="round"/><circle cx="46" cy="-82" r="38" fill="#fff" stroke="${RED}" stroke-width="7"/>`+T('5',-60,52,46,RED))),
 O('i1',SM(EYE.replace('id="pup"',''),.8)),O('i2',SM(TRAY.replace(/id="jb\d"/g,''),.7,0,-30)),O('i3',SM(GAUGE.replace('id="gnd"','').replace(/class="vp"/g,'class="vq" opacity="0"'),.6,0,0)),
 O('sub',`<path d="M-120 0H140L230 120L130 270L-40 320L-190 220L-170 100Z" fill="#fff" ${S}/>`),
 O('sea',`<rect x="-480" y="0" width="960" height="400" fill="rgba(198,188,226,.45)"/><path d="M-480 0H480" fill="none" ${S}/>`),
 O('tip',`<path d="M-110 0L-40 -130L10 -80L50 -150L130 0Z" fill="#fff" ${S}/>`),
 O('g5',`<circle r="44" fill="#fff" stroke="${RED}" stroke-width="7"/>`+T('5',20,60,0,RED)),
 O('qm2',T('?',0,150,0,RED)),
 O('lmp',`<path d="M-160 120H160" fill="none" ${S} stroke-width="8"/><path d="M-140 120V30H20V120" fill="none" ${S} stroke-width="0"/><rect x="-120" y="70" width="120" height="50" rx="6" fill="#F9DEE3" ${S}/><path d="M60 120V-20L110 -90" fill="none" ${S} stroke-width="10"/><path d="M90 -120L150 -80L110 -60Z" fill="#F5E7D6" ${S}/><path d="M120 -50L150 120" fill="none" stroke="#C6BCE2" stroke-width="12" opacity=".5"/>`),
 O('ck2',D.check)
].join('');
// ---------- HTML: rótulos (≤4 palabras)
const H=document.getElementById('ht');
const st=(id,tx,x,y,fs,rot)=>H.insertAdjacentHTML('beforeend',`<div class="st" id="${id}" data-r="${rot||0}" style="left:${x}px;top:${y}px;${fs?'font-size:'+fs+'px':''}">${tx}</div>`);
const pl=(id,tx,x,y)=>H.insertAdjacentHTML('beforeend',`<div class="pl" id="${id}" style="left:${x}px;top:${y}px;width:auto;padding:0 28px;font-size:40px">${tx}</div>`);
const lb=(id,tx,x,y)=>H.insertAdjacentHTML('beforeend',`<div class="lb" id="${id}" style="left:${x}px;top:${y}px">${tx}</div>`);
st('sEc','En casa sí responde',540,900,0,-2);
st('sEx','El examen cambia todo',540,900,0,2);
st('sAp','Aprender no es recuperar',540,900,0,-2);
st('sHv','Hay varias explicaciones',540,900,0,2);
st('sVr','Hay varias explicaciones',540,900,0,-2);
st('sNn','Una nota no explica',540,900,0,2);
st('sCa','¿En casa sí puede?',540,900,0,-2);
pl('pAp','Aprender',200,170);pl('pRe','Recuperar',880,170);
pl('pAt','Atención',200,170);pl('pMt','Memoria',540,170);pl('pEm','Emociones',880,170);
pl('nE','No estudió',690,280);pl('nS','No se esfuerza',690,450);
pl('pc1','Aprender',200,170);pl('pc2','Recordar',540,170);pl('pc3','Demostrar',880,170);
lb('l1','Atención',560,490);lb('l2','Memoria',560,575);lb('l3','Emociones',560,660);
H.insertAdjacentHTML('beforeend','<div id="end" style="position:absolute;left:0;top:0;width:1080px;height:1000px;opacity:0"><div style="position:absolute;left:90px;top:330px;width:900px;text-align:center;font:700 70px/1.15 Outfit;color:#2E2545">Este video orienta y no diagnostica.</div><div class="st" style="left:540px;top:620px;opacity:1;font:700 40px/1 \'Maven Pro\';transform:translate(-50%,-50%)">psicologakarentrujillo.com.mx</div></div>');
// ============ ESPECIFICACIÓN (se define antes que las escenas) ============
// Lienzo 1080×1920 (9:16) · 30 fps · 64.6 s · audio = voz.mp3 (1.10x)
// Zonas seguras: gráficos dentro de x 60–1020 y página y 300–1250 (escenario); subtítulos en y 1290–1440 (nada de gráficos ahí).
// Micro-copy: máximo 4 palabras por momento visual (sin contar subtítulos). Bucle: nada se anima en los últimos 0.5 s.
const CFG={FPS:30,DUR:+(WORDS[WORDS.length-1][2]+.1).toFixed(2),W:1080,H:1920,
 POP:'back.out(1.35)',   // entradas: suaves, un solo rebote leve
 MOVE:'power3.inOut',    // desplazamientos
 OUT:'power2.in',        // salidas
 T:{pop:.5,move:.7,out:.3}};
gsap.set('.o',{opacity:0,transformOrigin:'50% 50%'});

gsap.set('.st,.big,.lb',{xPercent:-50,yPercent:-50});
gsap.set('.pl',{xPercent:-50,opacity:0});
document.querySelectorAll('.st').forEach(e=>gsap.set(e,{rotation:+e.dataset.r}));
const tl=gsap.timeline({paused:true});
const ST=(s,v)=>gsap.set(s,v);
const POP=(s,t,sc,x,y,d)=>{const f={scale:.3,opacity:0},v={scale:sc||1,opacity:1,duration:d||CFG.T.pop,ease:CFG.POP,immediateRender:false};if(x!==undefined){f.x=x;f.y=y;v.x=x;v.y=y;}tl.fromTo(s,f,v,t);};
const OUT=(s,t,d)=>tl.to(s,{opacity:0,scale:'*=0.7',duration:d||CFG.T.out,ease:CFG.OUT},t);
const MV=(s,t,v,d,e)=>tl.to(s,Object.assign({duration:d||CFG.T.move,ease:e||CFG.MOVE},v),t);
const FROM=(s,t,f,v,d)=>tl.fromTo(s,f,Object.assign({duration:d||CFG.T.pop,ease:CFG.POP,immediateRender:false},v),t);
const PLI=(s,t)=>tl.fromTo(s,{opacity:0,scale:.6},{opacity:1,scale:1,duration:.4,ease:CFG.POP,immediateRender:false},t);
const DIM=(s,t)=>tl.to(s,{opacity:.25,filter:'blur(3px)',duration:.4},t);
const SHAKE=(s,t,n,dx)=>tl.to(s,{x:'+='+(dx||10),duration:.07,yoyo:true,repeat:n||5,ease:'sine.inOut'},t);
const DRAW=(s,t,d)=>{const p=document.querySelector(s+' path'),L=p.getTotalLength();gsap.set(p,{strokeDasharray:L,strokeDashoffset:L});tl.set(s,{opacity:1,scale:1},t);tl.fromTo(p,{strokeDashoffset:L},{strokeDashoffset:0,duration:d||.35,ease:'power1.inOut',immediateRender:false},t);};
gsap.set('#clkH,#gnd',{transformOrigin:'50% 50%'});gsap.set('#gnd',{rotation:-62});gsap.set('.vp,.vq',{opacity:0});
const LIT=(s,t)=>tl.to(s,{opacity:1,filter:'blur(0px)',duration:.4},t);
// ============ ESCENA 1 · HOOK (0–5.0) ============
// Acción: una tarjeta con «2 + 3 =» recibe la respuesta 5 con palomita; la misma pregunta aparece en una hoja de examen en blanco;
//   un borrador pasa sobre el 5 y lo borra; un «?» rojo cae sobre el examen.
// Persisten: tarjeta y examen. Imagen final: tarjeta sin respuesta, examen en blanco con «?».
function escena1(){
 POP('#qa',0,1.5,540,470);
 PLI('#sEc',.3);
 POP('#ans',at('responde',.1),1.5,540,615);
 const tL=at('llega el examen');
 POP('#ex',tL,1.5,790,470);MV('#qa',tL,{x:270},.6);MV('#ans',tL,{x:270},.6);
 OUT('#sEc',at('examen')-.15);PLI('#sEx',at('examen'));
 const tO=at('olvido');
 POP('#ers',tO-.15,1.3,120,615);MV('#ers',tO+.05,{x:400},.6,'power2.inOut');
 tl.to('#ans',{opacity:0,duration:.2},tO+.3);
 POP('#qmk',at('absolutamente'),1.5,790,470);
}
// ============ ESCENA 2 · DESARROLLO (5.0–18.9) ============
// Acción: un niño responde (burbuja con palomita) y explica el tema en una pizarra (sol, nube, flecha con tiza); la pizarra se cambia por el
//   examen con un reloj que avanza; un muro de ladrillos se levanta sobre las preguntas; llega la nota 4 y un garabato rojo de frustración.
// Persisten: niño (de la pizarra al examen). Imagen final: niño con garabato, examen con muro, reloj y nota 4.
function escena2(){
 const t0=at('le preguntas')-.25;
 ['#qa','#ex','#ers','#qmk','#sEx'].forEach(s=>OUT(s,t0));
 POP('#kid',at('le preguntas'),1.6,170,640);POP('#cb',at('le preguntas'),1,690,420);
 POP('#sp1',at('responde sin'),1.3,190,390);
 const tE=at('incluso puede');
 OUT('#sp1',tE-.2);
