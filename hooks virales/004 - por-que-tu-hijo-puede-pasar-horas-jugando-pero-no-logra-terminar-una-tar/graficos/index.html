const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ\s]/g,' ').split(/\s+/).filter(Boolean);
const WN=WORDS.map(w=>norm(w[0])[0]||'');
function at(frag,off,nth){const f=norm(frag);let c=0;
 for(let i=0;i<=WN.length-f.length;i++){let ok=true;for(let j=0;j<f.length;j++)if(WN[i+j]!==f[j]){ok=false;break;}
  if(ok){if((nth||0)===c)return +(WORDS[i][1]+(off||0)).toFixed(2);c++;}}
 throw new Error('no encuentro: '+frag);}
// ---------- dibujos (centrados en 0,0)
function gear(r,n,fill){let p=[];const st=2*Math.PI/n;
 for(let i=0;i<n;i++){const a=i*st;[[-.28,r],[-.18,r+26],[.18,r+26],[.28,r]].forEach(([k,rr])=>{const aa=a+k*st;p.push((rr*Math.cos(aa)).toFixed(1)+' '+(rr*Math.sin(aa)).toFixed(1));});}
 return `<path d="M${p.join('L')}Z" fill="${fill}" ${S}/><circle r="${r*.38}" fill="#fff" ${S}/><circle r="10" fill="#2E2545"/>`;}
// ---------- dibujos nuevos del 004 (centrados en 0,0)
const T=(tx,y,fs,x,col)=>`<text x="${x||0}" y="${y||0}" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="${fs||40}" fill="${col||'#2E2545'}">${tx}</text>`;

const KID=`<rect x="-110" y="70" width="220" height="150" rx="60" fill="#C6BCE2" ${S}/><path d="M-80 120H80M-90 165H90" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/><circle cx="0" cy="-10" r="78" fill="#F5E7D6" ${S}/><path d="M-80 -30Q-80 -110 0 -110Q80 -110 80 -30Z" fill="#F9DEE3" ${S}/><path d="M60 -32H130Q140 -32 132 -20L120 -14H60Z" fill="#F9DEE3" ${S}/><ellipse cx="-28" cy="4" rx="16" ry="20" fill="#fff" ${S} stroke-width="4"/><ellipse cx="28" cy="4" rx="16" ry="20" fill="#fff" ${S} stroke-width="4"/><g class="pu"><circle cx="-28" cy="8" r="8" fill="#2E2545"/><circle cx="28" cy="8" r="8" fill="#2E2545"/></g><path d="M-14 42Q0 50 14 42" fill="none" ${S}/>`;
const COIN=`<circle r="34" fill="#F5E7D6" ${S}/><circle r="20" fill="none" ${S} stroke-width="4"/>`+T('+10',-46,30);
const TAGH=(tx)=>`<path d="M0 -150V-80" fill="none" ${S}/><path d="M-150 -80H150V40H-150Z" fill="#fff" ${S}/><circle cy="-58" r="10" fill="#C6BCE2" ${S}/>`+T(tx,4,44);
const TILE=(ic)=>`<rect x="-120" y="-120" width="240" height="240" rx="20" fill="#fff" ${S}/>${ic}`;
const g=document.getElementById('gg');
const O=(id,inner)=>`<g id="${id}" class="o">${inner}</g>`;
const rad=(r)=>[0,1,2,3,4].map(i=>{const a=-Math.PI/2+i*2*Math.PI/5;return (r*Math.cos(a)).toFixed(1)+' '+(r*Math.sin(a)).toFixed(1);}).join('L');
g.innerHTML=[
 O('dv',`<path d="M0 -20V820" fill="none" ${S} stroke-dasharray="18 18"/>`),
 O('mon',`<rect x="-180" y="-130" width="360" height="240" rx="22" fill="#2E2545" ${S}/><rect x="-158" y="-108" width="316" height="196" rx="12" fill="#C6BCE2"/><path d="M-40 110L-60 160H60L40 110Z" fill="#F5E7D6" ${S}/><g id="hero"><rect x="-22" y="-10" width="44" height="54" rx="6" fill="#F9DEE3" ${S} stroke-width="4"/><rect x="-14" y="-40" width="28" height="28" rx="6" fill="#F5E7D6" ${S} stroke-width="4"/></g><rect x="60" y="20" width="70" height="20" rx="4" fill="#fff" ${S} stroke-width="4"/><rect x="-130" y="-60" width="60" height="20" rx="4" fill="#fff" ${S} stroke-width="4"/>`),
 O('pad',PAD),O('nte',NOTE),
 O('hgL',HG('hgL')),O('hgR',HG('hgR')),
 O('kid',KID),
 O('co1',COIN),O('co2',COIN),O('co3',COIN),
 O('tro',`<path d="M-60 -80H60V-20Q60 40 0 50Q-60 40 -60 -20Z" fill="#F5E7D6" ${S}/><path d="M-60 -60Q-100 -60 -96 -26Q-92 6 -54 10M60 -60Q100 -60 96 -26Q92 6 54 10" fill="none" ${S}/><path d="M-14 50V84H14V50" fill="#fff" ${S}/><rect x="-50" y="84" width="100" height="26" rx="8" fill="#F9DEE3" ${S}/>`),
 O('chr',`<path d="M-80 0H80" fill="none" ${S} stroke-width="14"/><path d="M60 0V-150M-60 0V100M60 0V100" fill="none" ${S} stroke-width="12"/><rect x="40" y="-170" width="40" height="120" rx="14" fill="#F9DEE3" ${S}/>`),
 O('bfl',`<path d="M0 0Q-60 -70 -70 -10Q-74 30 0 0Q-50 60 -16 64Q10 60 0 0Z" fill="#F9DEE3" ${S}/><path d="M0 0Q60 -70 70 -10Q74 30 0 0Q50 60 16 64Q-10 60 0 0Z" fill="#C6BCE2" ${S}/>`),
 O('yrn',`<circle r="58" fill="#F9DEE3" ${S}/><path d="M-50 -24Q0 -8 44 -34M-56 10Q0 30 54 4M-34 44Q4 50 30 52" fill="none" ${S} stroke-width="4"/>`),
 `<path id="hilo" class="o" d="M300 900C420 960 520 820 640 900S860 1000 960 900" fill="none" ${S}/>`,
 O('gaL',`<path d="M-120 0A120 120 0 0 1 120 0" fill="#fff" ${S}/><path d="M-120 0H120" fill="none" ${S}/>`+[-60,-30,0,30,60].map(a=>`<path d="M0 -96V-114" transform="rotate(${a})" fill="none" ${S} stroke-width="4"/>`).join('')+`<g id="ndL"><path d="M0 0V-92" stroke="#C0392B" stroke-width="10" stroke-linecap="round"/></g><circle r="14" fill="#2E2545"/>`),
 O('gaR',`<path d="M-120 0A120 120 0 0 1 120 0" fill="#fff" ${S}/><path d="M-120 0H120" fill="none" ${S}/>`+[-60,-30,0,30,60].map(a=>`<path d="M0 -96V-114" transform="rotate(${a})" fill="none" ${S} stroke-width="4"/>`).join('')+`<g id="ndR"><path d="M0 0V-92" stroke="#C0392B" stroke-width="10" stroke-linecap="round"/></g><circle r="14" fill="#2E2545"/>`),
 O('spk',[0,1,2,3,4,5,6,7].map(i=>`<path d="M0 -34V-70" transform="rotate(${i*45})" fill="none" stroke="#2E2545" stroke-width="8" stroke-linecap="round"/>`).join('')+`<circle r="18" fill="#F9DEE3" ${S}/>`),
 O('bolt',`<path d="M20 -90L-50 10H0L-20 90L50 -10H0Z" fill="#F5E7D6" ${S}/>`),
 O('jar',`<path d="M-70 -60H70V80Q70 100 50 100H-50Q-70 100 -70 80Z" fill="rgba(255,255,255,.6)" ${S}/><rect x="-80" y="-84" width="160" height="28" rx="10" fill="#C6BCE2" ${S}/>`),
 `<rect id="jf" class="o" x="-64" y="-40" width="128" height="134" rx="12" fill="#F5E7D6"/>`,
 O('stp',`<path d="M-150 90H-90V40H-30V-10H30V-60H90V-110H150V90Z" fill="#fff" ${S}/>`),
 O('wb',`<path d="M-30 -24H30L40 30H-40Z" fill="#2E2545"/><path d="M-12 -24Q0 -50 12 -24" fill="none" ${S}/>`+T('kg',22,24,0,'#fff')),
 O('box',[0,1,2].map(i=>`<rect x="-70" y="${-90+i*60}" width="140" height="56" rx="8" fill="${['#F5E7D6','#F9DEE3','#C6BCE2'][i]}" ${S}/><path d="M-16 ${-62+i*60}H16" fill="none" ${S}/>`).join('')),
 O('thm',`<rect x="-20" y="-110" width="40" height="170" rx="20" fill="#fff" ${S}/><circle cy="80" r="34" fill="#C0392B" ${S}/>`),
 `<rect id="mrc" class="o" x="-9" y="-90" width="18" height="160" rx="9" fill="#C0392B"/>`,
 O('scl',`<path d="M0 -150V120M-90 120H90" fill="none" ${S} stroke-width="10"/><path d="M-40 120L0 60L40 120" fill="#F5E7D6" ${S}/>`),
 O('bm',`<path d="M-230 0H230" fill="none" ${S} stroke-width="12"/><circle r="16" fill="#F9DEE3" ${S}/>`),
 O('pL',`<path d="M0 0L-80 120M0 0L80 120" fill="none" ${S} stroke-width="4"/><path d="M-100 120H100Q90 160 0 160Q-90 160 -100 120Z" fill="#fff" ${S}/><path d="M-40 110Q0 40 50 70Q10 90 -40 110Z" fill="#F9DEE3" ${S}/>`),
 O('pR',`<path d="M0 0L-80 120M0 0L80 120" fill="none" ${S} stroke-width="4"/><path d="M-100 120H100Q90 160 0 160Q-90 160 -100 120Z" fill="#fff" ${S}/><path d="M-44 64H44L56 120H-56Z" fill="#2E2545"/>`+T('kg',106,30,0,'#fff')),
 O('brn',`<path d="M0 -70Q-40 -100 -80 -70Q-120 -60 -110 -20Q-130 20 -90 50Q-70 80 -30 70Q0 90 0 60Z" fill="#F9DEE3" ${S}/><path d="M0 -70Q40 -100 80 -70Q120 -60 110 -20Q130 20 90 50Q70 80 30 70Q0 90 0 60Z" fill="#F9DEE3" ${S}/><path d="M0 -70V60M-70 -30Q-40 -10 -60 20M70 -30Q40 -10 60 20" fill="none" ${S} stroke-width="4"/>`),
 O('tg1',TAGH('No tiene TDAH')),O('tg2',TAGH('Tiene TDAH')),
 O('bm2',`<path d="M70 -40L640 -230V230L70 40Z" fill="rgba(255,255,255,.55)"/>`),
 O('fl',`<rect x="-150" y="-36" width="170" height="72" rx="20" fill="#C6BCE2" ${S}/><path d="M20 -36L80 -60V60L20 36Z" fill="#F5E7D6" ${S}/><rect x="-90" y="-50" width="40" height="18" rx="6" fill="#2E2545"/>`),
 O('t1',TILE(`<g transform="scale(.6)">${PAD}</g>`)),O('t2',TILE(`<g transform="scale(.48)">${NOTE}</g>`)),
 O('t3',TILE(`<path d="M-60 60V-10H0V60Z" fill="#C6BCE2" ${S}/><path d="M20 70L70 -60" fill="none" ${S} stroke-width="12"/><rect x="50" y="-90" width="34" height="40" rx="8" fill="#F9DEE3" ${S} transform="rotate(20 67 -70)"/>`)),
 O('rdr',[1,.66,.33].map(k=>`<path d="M${rad(180*k)}Z" fill="${k==1?'#fff':'none'}" ${S} stroke-width="${k==1?6:3}"/>`).join('')+[0,1,2,3,4].map(i=>{const a=-Math.PI/2+i*2*Math.PI/5;return `<path d="M0 0L${(180*Math.cos(a)).toFixed(1)} ${(180*Math.sin(a)).toFixed(1)}" fill="none" stroke="#C6BCE2" stroke-width="4"/>`;}).join('')+`<path id="rpoly" d="M${rad(10)}Z" fill="rgba(249,222,227,.85)" ${S}/>`),
 O('vf',`<path d="M-200 -140V-200H-140M140 -200H200V-140M200 140V200H140M-140 200H-200V140" fill="none" stroke="#2E2545" stroke-width="12" stroke-linecap="round"/><circle r="8" fill="#C0392B"/>`),
 O('frm',`<rect x="-440" y="-170" width="880" height="340" rx="24" fill="none" stroke="#2E2545" stroke-width="12"/>`),
 O('ph',`<rect x="-110" y="-200" width="220" height="400" rx="34" fill="#2E2545" ${S}/><rect x="-92" y="-170" width="184" height="330" rx="16" fill="#F9DEE3"/><rect x="-30" y="176" width="60" height="10" rx="5" fill="#fff"/><path d="M-50 -60H50M-50 -20H50M-50 20H20" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>`),
 O('pln',`<path d="M-80 10L90 -70L30 80L0 30Z" fill="#fff" ${S}/><path d="M0 30L90 -70" fill="none" ${S}/>`)
].join('');
// ---------- HTML: rótulos (≤4 palabras)
const H=document.getElementById('ht');
const st=(id,tx,x,y,fs,rot)=>H.insertAdjacentHTML('beforeend',`<div class="st" id="${id}" data-r="${rot||0}" style="left:${x}px;top:${y}px;${fs?'font-size:'+fs+'px':''}">${tx}</div>`);
const pl=(id,tx,x,y)=>H.insertAdjacentHTML('beforeend',`<div class="pl" id="${id}" style="left:${x}px;top:${y}px;width:auto;padding:0 28px;font-size:38px">${tx}</div>`);
st('s3h','3 horas jugando',275,880,44,-3);st('s20','20 min de tarea',805,880,44,3);
pl('lJ','Juego',270,330);pl('lT','Tarea',810,330);
st('sDd','Demandas diferentes',540,900,0,-2);
st('sNd','No descarta TDAH',540,900,0,2);
st('sOb','Observa todo el contexto',540,900,0,-2);
st('sCv','Comparte este video',540,900,0,2);
H.insertAdjacentHTML('beforeend','<div id="end" style="position:absolute;left:0;top:0;width:1080px;height:1000px;opacity:0"><div style="position:absolute;left:90px;top:330px;width:900px;text-align:center;font:700 70px/1.15 Outfit;color:#2E2545">Este video orienta y no diagnostica.</div><div class="st" style="left:540px;top:620px;opacity:1;font:700 40px/1 \'Maven Pro\';transform:translate(-50%,-50%)">psicologakarentrujillo.com.mx</div></div>');
// ============ ESPECIFICACIÓN (se define antes que las escenas) ============
// Lienzo 1080×1920 (9:16) · 30 fps · 65.0 s = 1950 cuadros · audio = voz.mp3 (1.10x)
// Zonas seguras: gráficos dentro de x 60–1020 y página y 300–1250 (escenario); subtítulos en y 1290–1440 (nada de gráficos ahí).
// Micro-copy: máximo 4 palabras por momento visual (sin contar subtítulos). Bucle: nada se anima en los últimos 0.5 s.
const CFG={FPS:30,DUR:+(WORDS[WORDS.length-1][2]+.1).toFixed(2),W:1080,H:1920,
 POP:'back.out(1.35)',   // entradas: suaves, un solo rebote leve
 MOVE:'power3.inOut',    // desplazamientos
 OUT:'power2.in',        // salidas
 T:{pop:.5,move:.7,out:.3}};
gsap.set('.o',{opacity:0,transformOrigin:'50% 50%'});
gsap.set('#ndL,#ndR',{transformOrigin:'50% 100%',rotation:0});
gsap.set('#jf,#mrc',{transformOrigin:'50% 100%',scaleY:0});
gsap.set('#hgLt,#hgRt',{transformOrigin:'50% 100%'});gsap.set('#hgLb,#hgRb',{transformOrigin:'50% 100%',scaleY:.2});
gsap.set('#tg1,#tg2',{transformOrigin:'50% 0%'});
gsap.set('#bm2',{transformOrigin:'0% 50%'});
gsap.set('.st,.big,.lb',{xPercent:-50,yPercent:-50});
gsap.set('.pl',{xPercent:-50,opacity:0});
document.querySelectorAll('.st').forEach(e=>gsap.set(e,{rotation:+e.dataset.r}));
const tl=gsap.timeline({paused:true});
const ST=(s,v)=>gsap.set(s,v);
// utilidades: entrar (POP), salir (OUT), mover (MV)
const POP=(s,t,sc,x,y,d)=>{const f={scale:.3,opacity:0},v={scale:sc||1,opacity:1,duration:d||CFG.T.pop,ease:CFG.POP,immediateRender:false};if(x!==undefined){f.x=x;f.y=y;v.x=x;v.y=y;}tl.fromTo(s,f,v,t);};
const OUT=(s,t,d)=>tl.to(s,{opacity:0,scale:'*=0.7',duration:d||CFG.T.out,ease:CFG.OUT},t);
const MV=(s,t,v,d,e)=>tl.to(s,Object.assign({duration:d||CFG.T.move,ease:e||CFG.MOVE},v),t);
const FROM=(s,t,f,v,d)=>tl.fromTo(s,f,Object.assign({duration:d||CFG.T.pop,ease:CFG.POP,immediateRender:false},v),t);
const SPIN=(s,t,deg,d)=>tl.to(s,{rotation:'+='+deg,duration:d,ease:'none'},t);
const PLI=(s,t)=>tl.fromTo(s,{opacity:0,scale:.6},{opacity:1,scale:1,duration:.4,ease:CFG.POP,immediateRender:false},t);
const FLIP=(id,t,n,each)=>{for(let i=0;i<n;i++){const t0=t+i*each;tl.fromTo('#'+id+'t',{scaleY:1},{scaleY:.1,duration:each*.8,ease:'none',immediateRender:false},t0);tl.fromTo('#'+id+'b',{scaleY:.2},{scaleY:1,duration:each*.8,ease:'none',immediateRender:false},t0);tl.to('#'+id,{rotation:'+=180',duration:each*.2,ease:CFG.MOVE},t0+each*.8);}};

// ============ ESCENA 1 · HOOK (0–5.3) ============
// Acción: pantalla dividida: monitor + control con reloj de arena que gira rápido (3 horas) / cuaderno con reloj de arena atorado (20 min).
// Persisten: monitor, control, cuaderno, relojes de arena. Imagen final: los dos lados con sus rótulos.
function escena1(){
 POP('#dv',0,1,540,0);
 POP('#mon',0.05,.8,275,330);POP('#pad',at('jugando',-.3),.75,275,620);
 POP('#hgL',at('tres',-.2),.8,430,620);FLIP('hgL',at('horas'),4,.7);
 POP('#s3h',at('videojuegos'),1);
 POP('#nte',0.35,.85,805,340);
 POP('#hgR',at('veinte',-.2),.8,805,640);
 tl.fromTo('#hgRt',{scaleY:1},{scaleY:.92,duration:2,ease:'none',immediateRender:false},at('veinte'));   // casi no avanza
 POP('#s20',at('minutos'),1);
 tl.to('#dv',{x:'+=10',duration:.08,yoyo:true,repeat:5},at('por que'));
}
// ============ ESCENA 2 · DESARROLLO (5.3–17.8) ============
// Acción: el monitor crece; monedas «+10» y trofeo en «recuerda / instrucciones / continuar»; en «abre su cuaderno» el monitor
//   se vuelve cuaderno; «se levanta» deja la silla vacía; las pupilas siguen a una mariposa; un ovillo rueda y se desenrolla.
// Persisten: niño, cuaderno. Imagen final: silla vacía, cuaderno y el hilo suelto.
function escena2(){
 const tLo=at('lo ves');
 ['#dv','#nte','#hgL','#hgR','#s3h','#s20','#pad'].forEach(s=>OUT(s,tLo-.2));
 MV('#mon',tLo,{x:540,y:300,scale:1.25});
 POP('#kid',at('concentrado',-.2),.85,540,720);
 tl.to('#hero',{y:-20,duration:.25,yoyo:true,repeat:9,ease:'sine.out'},at('concentrado'));
 [['#co1',at('recuerda'),180,200],['#co2',at('instrucciones'),900,200],['#co3',at('quiere'),180,430]].forEach(([s,t,x,y])=>{POP(s,t,.9,x,y);tl.to(s,{rotationY:0,y:'-=20',duration:.4,yoyo:true,repeat:1},t+.4);});
 POP('#tro',at('continuar'),.9,900,440);
 const tPc=at('pero cuando');
 ['#co1','#co2','#co3','#tro'].forEach(s=>OUT(s,tPc-.1));
 tl.to('#mon',{scaleX:0,duration:.3,ease:CFG.OUT},at('abre',-.2));                // el monitor se cierra…
 FROM('#nte',at('abre',.1),{opacity:0,scaleX:0,scaleY:1.1,x:540,y:300},{opacity:1,scaleX:1.1,scaleY:1.1,x:540,y:300},.5);   // …y se abre el cuaderno
 tl.to('#kid .pu',{y:6,duration:.3},at('todo cambia'));
 const tLv=at('levanta');
 FROM('#chr',tLv-.4,{opacity:0,scale:.5,x:470,y:770},{opacity:1,scale:.9,x:470,y:770});
 MV('#kid',tLv,{x:830,y:660,scale:.75},.6);
 tl.to('#nte',{filter:'blur(4px)',opacity:.6,duration:.4},tLv);
 // la mirada sigue a la mariposa
 FROM('#bfl',at('mira',-.2),{opacity:0,scale:.3,x:620,y:160},{opacity:1,scale:.8,x:620,y:160});
 tl.to('#bfl',{x:300,y:240,duration:1.4,ease:'sine.inOut'},at('mira',.2));
 tl.to('#bfl',{scaleX:.4,duration:.15,yoyo:true,repeat:9},at('mira'));
 tl.to('#kid .pu',{x:-10,y:-6,duration:.6},at('cualquier'));
 // pierde el hilo: el ovillo rueda y se desenrolla
 const HL=document.getElementById('hilo').getTotalLength();gsap.set('#hilo',{strokeDasharray:HL,strokeDashoffset:HL});
 FROM('#yrn',at('pierde',-.2),{opacity:0,scale:.3,x:300,y:900},{opacity:1,scale:.9,x:300,y:900});
 tl.set('#hilo',{opacity:1},at('pierde'));
 tl.to('#hilo',{strokeDashoffset:0,duration:1.2,ease:'power1.inOut'},at('pierde'));
 tl.to('#yrn',{x:960,y:900,rotation:540,scale:.5,duration:1.2,ease:'power1.inOut'},at('pierde'));

// ============ ESCENA 3 · GIRO (17.8–35.4) ============
// Acción: dos medidores de atención (juego alto / tarea bajo); izquierda: chispas, rayo, monedas que llenan un frasco;
//   derecha: una pesa sube la escalera, cajas apiladas, termómetro que sube; todo se vuelve una balanza (pluma contra «kg») y un cerebro.
// Persisten: monedas (→ frasco), control y cuaderno (→ rótulos de cada lado). Imagen final: balanza inclinada, cerebro y «Demandas diferentes».
function escena3(){
 const tA=at('la atencion');
 ['#nte','#chr','#kid','#bfl','#yrn','#hilo'].forEach(s=>OUT(s,tA-.2));
 POP('#gaL',tA,1,270,560);POP('#gaR',tA+.15,1,810,560);
 PLI('#lJ',tA+.3);PLI('#lT',tA+.4);
 tl.fromTo('#ndL',{rotation:-80},{rotation:60,duration:.8,ease:CFG.POP,immediateRender:false},at('igual'));
 tl.fromTo('#ndR',{rotation:-80},{rotation:-45,duration:.8,ease:CFG.POP,immediateRender:false},at('igual',.2));
 tl.to('#ndR',{rotation:-55,duration:.15,yoyo:true,repeat:5},at('situaciones'));
 const tV=at('los videojuegos');
 OUT('#gaL',tV-.2);OUT('#gaR',tV-.2);
 POP('#dv',tV,1,540,0);
 POP('#spk',at('ofrecen'),1,270,470);tl.to('#spk',{scale:1.3,rotation:22,duration:.2,yoyo:true,repeat:5},at('constantes'));
 POP('#bolt',at('respuestas'),.9,150,640);tl.to('#bolt',{x:'+=12',duration:.06,yoyo:true,repeat:5},at('inmediatas'));
 POP('#jar',at('recompensas',-.2),1,360,720);tl.set('#jf',{opacity:1,x:360,y:720},at('recompensas',-.2));
 ['#co1','#co2','#co3'].forEach((s,i)=>FROM(s,at('recompensas')+i*.25,{opacity:1,scale:.6,x:300+i*60,y:280},{opacity:0,scale:.4,x:360,y:700,ease:'power2.in'},.45));
 tl.to('#jf',{scaleY:.8,duration:1.2,ease:'power1.out'},at('recompensas',.3));
 const tTe=at('una tarea');
 POP('#stp',at('esfuerzo',-.2),.9,800,600);
 FROM('#wb',at('esfuerzo'),{opacity:0,scale:.3,x:690,y:660},{opacity:1,scale:.9,x:690,y:655});
 [[745,610],[800,565],[855,520],[910,475]].forEach(([x,y],i)=>MV('#wb',at('sostenido')+i*.4,{x,y},.35,'power2.out'));
 POP('#box',at('organizacion',-.1),.9,700,800);
 POP('#thm',at('tolerancia',-.2),1,920,790);tl.set('#mrc',{opacity:1,x:920,y:800},at('tolerancia',-.2));
 tl.to('#mrc',{scaleY:.9,duration:1,ease:'power1.in'},at('frustracion',-.3));
 // todo se vuelve una balanza
 const tDe=at('demandas',-.5);
 ['#dv','#spk','#bolt','#jar','#jf','#stp','#wb','#box','#thm','#mrc','#lJ','#lT'].forEach(s=>OUT(s,tDe));
 POP('#scl',tDe+.2,1,540,560);ST('#bm',{x:540,y:420});ST('#pL',{x:310,y:420});ST('#pR',{x:770,y:420});
 tl.to('#bm',{opacity:1,duration:.3},tDe+.3);tl.to('#pL,#pR',{opacity:1,duration:.3},tDe+.3);
 tl.to('#bm',{rotation:14,duration:.9,ease:CFG.POP},at('diferentes'));
 tl.to('#pL',{y:364,duration:.9,ease:CFG.POP},at('diferentes'));tl.to('#pR',{y:476,duration:.9,ease:CFG.POP},at('diferentes'));
 POP('#sDd',at('muy'),1);
 POP('#brn',at('cerebro',-.2),.9,540,150);
}
// ============ ESCENA 4 · PROVOCACIÓN (35.4–46.7) ============
// Acción: vuelven el reloj de arena y el control (horas jugando); la etiqueta «No tiene TDAH» se deshace (no descarta);
//   la etiqueta «Tiene TDAH» también se deshace; se enciende una linterna que ilumina al niño completo.
// Persisten: reloj de arena, control, niño. Imagen final: linterna iluminando al niño con «Observa todo el contexto».
function escena4(){
 const tY=at('y no');
 ['#scl','#bm','#pL','#pR','#brn','#sDd'].forEach(s=>OUT(s,tY-.2));
 FROM('#pad',at('concentrarse'),{opacity:0,scale:.3,x:380,y:300},{opacity:1,scale:.8,x:380,y:300});
 FROM('#hgL',at('concentrarse',.2),{opacity:0,scale:.3,x:700,y:300,rotation:0},{opacity:1,scale:.8,x:700,y:300,rotation:0});
 FLIP('hgL',at('durante'),3,.55);
 FROM('#tg1',at('disfruta',-.1),{opacity:0,rotation:-20,x:540,y:620},{opacity:1,rotation:0,x:540,y:620,ease:'back.out(1.6)'},.7);
 tl.to('#tg1',{filter:'blur(8px)',opacity:0,scale:1.2,duration:.6,ease:CFG.OUT},at('descarta'));   // se deshace
 POP('#sNd',at('descarta',.2),1);
 const tTa=at('tampoco');
 ['#pad','#hgL','#sNd'].forEach(s=>OUT(s,tTa-.2));
 FROM('#tg2',tTa,{opacity:0,rotation:20,x:540,y:520},{opacity:1,rotation:0,x:540,y:520,ease:'back.out(1.6)'},.7);
 tl.to('#tg2',{filter:'blur(8px)',opacity:0,scale:1.2,duration:.6,ease:CFG.OUT},at('tenga',-.2));
 const tHf=at('hace falta');
 POP('#fl',tHf,1,170,480);
 tl.fromTo('#bm2',{opacity:0,scaleX:.1,x:170,y:480},{opacity:1,scaleX:1,x:170,y:480,duration:.5,ease:CFG.POP,immediateRender:false},at('observar',-.1));
 FROM('#kid',at('observar',.1),{opacity:0,scale:.4,x:700,y:450,filter:'blur(0px)'},{opacity:1,scale:.9,x:700,y:450});
 tl.set('#kid .pu',{x:0,y:0},at('observar'));
 POP('#sOb',at('completo'),1);
}
// ============ ESCENA 5 · CIERRE (46.7–59.1) ============
// Acción: la linterna barre tres cuadros (juego, escuela, rutina); una gráfica de radar de habilidades crece y cambia de forma;
//   un visor de cámara enfoca un solo cuadro y luego se abre para abarcar los tres.
// Persisten: linterna (→ visor), cuadros. Imagen final: visor abierto sobre los tres cuadros.
function escena5(){
 const tCe=at('cuando esta');
 ['#kid','#sOb'].forEach(s=>OUT(s,tCe-.2));
 MV('#fl',tCe,{x:140,y:830,rotation:-30},.6);tl.to('#bm2',{x:140,y:830,rotation:-30,duration:.6,ease:CFG.MOVE},tCe);
 POP('#t1',at('afecta',-.2),1,230,430);POP('#t2',at('aprendizaje',-.2),1,540,430);POP('#t3',at('cotidiana',-.3),1,850,430);
 tl.to('#fl,#bm2',{rotation:-75,duration:2.6,ease:'sine.inOut'},at('afecta'));        // el haz barre los tres
 const tEv=at('una evaluacion');
 ['#fl','#bm2'].forEach(s=>OUT(s,tEv-.2));
 [['#t1',260],['#t2',540],['#t3',820]].forEach(([s,x])=>MV(s,tEv,{x,y:130,scale:.5},.6));
 POP('#rdr',at('especializada',-.2),1,540,560);
 const RP={r:[10,10,10,10,10]};const PEL=document.getElementById('rpoly');
 const draw=()=>{PEL.setAttribute('d','M'+RP.r.map((r,i)=>{const a=-Math.PI/2+i*2*Math.PI/5;return (r*Math.cos(a)).toFixed(1)+' '+(r*Math.sin(a)).toFixed(1);}).join('L')+'Z');};
 tl.to(RP.r,{0:150,1:110,2:140,3:90,4:160,duration:.9,ease:CFG.POP,onUpdate:draw},at('explorar'));
 tl.to(RP.r,{0:120,1:160,2:80,3:150,4:110,duration:.9,ease:CFG.MOVE,onUpdate:draw},at('involucradas',-.2));
 const tPq=at('porque');
 OUT('#rdr',tPq-.2);
 [['#t1',230],['#t2',540],['#t3',850]].forEach(([s,x])=>MV(s,tPq,{x,y:500,scale:1},.6));
 FROM('#vf',at('mirando',-.2),{opacity:0,scale:1.6,x:540,y:500},{opacity:1,scale:.75,x:540,y:500},.5);
 tl.to('#t1,#t3',{filter:'blur(5px)',opacity:.4,duration:.4},at('mirando'));
 tl.to('#vf',{scaleX:2.35,scaleY:1.05,duration:.7,ease:CFG.MOVE},at('actividad',0,1));     // se abre a todo
 tl.to('#t1,#t3',{filter:'blur(0px)',opacity:1,duration:.4},at('actividad',0,1));
}
// ============ ESCENA 6 · CTA (59.1–65) ============
// Acción: teléfono; el avión de papel sale volando (comparte); aviso final y web (quietos los últimos 0.5 s).

 const tEn=at('en tu casa');
 ['#vf','#t1','#t2','#t3'].forEach(s=>OUT(s,tEn-.2));

 [['#t1',430],['#t2',650]].forEach(([s,y],i)=>FROM(s,at('tambien',0,0)+i*.2,{opacity:0,scale:.2,x:760,y,filter:'blur(0px)'},{opacity:1,scale:.55,x:760,y}));
 tl.to('#t1,#t2',{scale:.62,duration:.2,yoyo:true,repeat:1},at('diferencia',0,1));
 FROM('#pln',at('comparte',-.1),{opacity:0,scale:.3,x:420,y:440,rotation:0},{opacity:1,scale:.9,x:790,y:220,rotation:-10},.6);
 tl.to('#pln',{x:'+=40',y:'-=30',duration:.6,yoyo:true,repeat:1,ease:'sine.inOut'},at('comparte',.5));
 POP('#sCv',at('comparte',.2),1);
 const tF=at('alguien',-.2);
 ['#ph','#pln','#sCv','#t1','#t2'].forEach(s=>OUT(s,tF-.1));
 tl.fromTo('#end',{opacity:0,scale:.92,transformOrigin:'50% 50%'},{opacity:1,scale:1,duration:.5,ease:CFG.POP,immediateRender:false},tF+.2);
}
escena1();escena2();escena3();escena4();escena5();escena6();
// ============ SUBTÍTULOS (tiempos reales de words.json) ============
const KEYS=new Set(['videojuegos','tarea','cuaderno','hilo','atencion','estimulos','inmediatas','recompensas','esfuerzo','organizacion','frustracion','demandas','cerebro','tdah','observar','completo','evaluacion','habilidades','actividad']);
(function(){const caps=[];let cur=[];
 const flush=()=>{if(cur.length){caps.push(cur);cur=[];}};
 WORDS.forEach((w,i)=>{cur.push({w:w[0],t:w[1],e:w[2]});const nx=WORDS[i+1];
  if(cur.length>=3||/[,.:?…]$/.test(w[0])||(nx&&nx[1]-w[2]>.45))flush();});flush();
 caps.forEach((c,i)=>{const d=document.createElement('div');d.className='cap';d.id='cap'+i;
  d.innerHTML=c.map((x,j)=>`<span class="pw${KEYS.has(norm(x.w)[0])?' k':''}" id="c${i}w${j}">${x.w}</span>`).join(' ');document.body.appendChild(d);
  const s0=c[0].t,e0=Math.min(i+1<caps.length?caps[i+1][0].t-.03:CFG.DUR-.05,c[c.length-1].e+.9);
  tl.set('#cap'+i,{opacity:1},s0);tl.set('#cap'+i,{opacity:0},e0);
  c.forEach((x,j)=>tl.fromTo('#c'+i+'w'+j,{opacity:0,scale:.5,y:10,transformOrigin:'50% 80%'},{opacity:1,scale:1,y:0,duration:.25,ease:'power2.out',immediateRender:false},x.t));});
})();
window.DUR=CFG.DUR;
window.seek=t=>{tl.time(Math.min(t,tl.duration()));document.getElementById('rtb').setAttribute('seed',1+Math.floor(t*12)%7);};
</script></body></html>
