 ...[1,2,3].map(i=>O('B'+i,`<rect x="-130" y="-170" width="260" height="340" rx="16" fill="#fff" ${S}/><circle cy="-120" r="34" fill="#C6BCE2" ${S}/>`+T(i,-106,42)+T(['Juguetes','Cuaderno','Zapatos'][i-1],135,40))),
 O('I1',IC.blk),O('I2',IC.nb),O('I3',IC.shoe),
 ...[0,1,2].map(i=>O('lk'+(i+1),`<path id="shk${i+1}" d="M-44 -50V-100Q-44 -150 0 -150Q44 -150 44 -100V-50" fill="none" stroke="#2E2545" stroke-width="14" stroke-linecap="round"/><rect x="-80" y="-56" width="160" height="140" rx="20" fill="${['#F5E7D6','#F9DEE3','#C6BCE2'][i]}" ${S}/>${KH[i]}`)),

 O('frg',`<rect x="-180" y="-280" width="360" height="560" rx="30" fill="#fff" ${S}/><path d="M-180 -110H180" fill="none" ${S}/><path d="M-140 -230V-150M-140 -70V60" fill="none" ${S} stroke-width="14"/>`),

// ============ ESPECIFICACIÓN (se define antes que las escenas) ============
// Lienzo 1080×1920 (9:16) · 30 fps · 64.7 s · audio = voz.mp3 (1.10x)
// Zonas seguras: gráficos dentro de x 60–1020 y página y 300–1250 (escenario); subtítulos en y 1290–1440 (nada de gráficos ahí).
// Micro-copy: máximo 4 palabras por momento visual (sin contar subtítulos). Bucle: nada se anima en los últimos 0.5 s.
const CFG={FPS:30,DUR:+(WORDS[WORDS.length-1][2]+.1).toFixed(2),W:1080,H:1920,
 POP:'back.out(1.35)',   // entradas: suaves, un solo rebote leve

gsap.set('.st,.big,.lb',{xPercent:-50,yPercent:-50});
gsap.set('.pl',{xPercent:-50,opacity:0});
document.querySelectorAll('.st').forEach(e=>gsap.set(e,{rotation:+e.dataset.r}));

const ST=(s,v)=>gsap.set(s,v);
const POP=(s,t,sc,x,y,d)=>{const f={scale:.3,opacity:0},v={scale:sc||1,opacity:1,duration:d||CFG.T.pop,ease:CFG.POP,immediateRender:false};if(x!==undefined){f.x=x;f.y=y;v.x=x;v.y=y;}tl.fromTo(s,f,v,t);};
const OUT=(s,t,d)=>tl.to(s,{opacity:0,scale:'*=0.7',duration:d||CFG.T.out,ease:CFG.OUT},t);
const MV=(s,t,v,d,e)=>tl.to(s,Object.assign({duration:d||CFG.T.move,ease:e||CFG.MOVE},v),t);
const FROM=(s,t,f,v,d)=>tl.fromTo(s,f,Object.assign({duration:d||CFG.T.pop,ease:CFG.POP,immediateRender:false},v),t);
const PLI=(s,t)=>tl.fromTo(s,{opacity:0,scale:.6},{opacity:1,scale:1,duration:.4,ease:CFG.POP,immediateRender:false},t);
const DIM=(s,t)=>tl.to(s,{opacity:.25,filter:'blur(3px)',duration:.4},t);

const CKN=document.getElementById('ckN');
const COUNT=(t,a,b,d)=>{const o={v:a};tl.fromTo(o,{v:a},{v:b,duration:d,ease:'none',immediateRender:false,onUpdate:()=>{CKN.textContent=Math.round(o.v);}},t);

// ============ ESCENA 1 · HOOK (0–4.0) ============
// Acción: un contador de clics sube de 0 a 12 mientras se llenan las marcas de conteo (palitos) de abajo.
// Persisten: contador. Imagen final: contador en 12 y marcas de conteo.
function escena1(){
 POP('#ckr',0,1.3,540,380);COUNT(.3,0,12,3.4);
 POP('#tly',.2,1,540,760);
 for(let i=0;i<12;i++)tl.set('#tm'+i,{opacity:1},.3+(i+1)*3.4/12);
}
// ============ ESCENA 2 · DESARROLLO (4.0–17.6) ============
// Acción: mensaje «Guarda tus juguetes» y juguetes en el piso (cubos, carrito, patito); el mensaje se apaga, se repite y los juguetes
//   siguen en su lugar (círculos punteados); «Prepara tu mochila», escritorio con cuadernos olvidados y huellas hacia la puerta;

// ============ SUBTÍTULOS (tiempos reales de words.json) ============
const KEYS=new Set(['repetirle','juguetes','mochila','olvido','cuadernos','escucha','memoria','trabajo','informacion','instrucciones','atencion','organizacion','repetir','breves','visuales','pasos','evaluacion','habilidades','fuerte','apoyo','comentarios']);
(function(){const caps=[];let cur=[];

 WORDS.forEach((w,i)=>{cur.push({w:w[0],t:w[1],e:w[2]});const nx=WORDS[i+1];
  if(cur.length>=3||/[,.:?…]$/.test(w[0])||(nx&&nx[1]-w[2]>.45))flush();});flush();
 caps.forEach((c,i)=>{const d=document.createElement('div');d.className='cap';d.id='cap'+i;
