add(CARD('cpt',620)+[['Flexibilidad<br>cognitiva',J.bend,20],['Regulación<br>emocional',J.gauge,410]].map((c,i)=>`<div id="cp${i}" class="tl2" style="left:${c[2]}px;top:130px;width:370px;height:400px;font-size:48px;line-height:1.1;opacity:0">${c[1]}${c[0]}</div>`).join('')+`<div id="cbt" style="position:absolute;left:350px;top:20px;opacity:0;display:flex;gap:10px;align-items:center;font:700 40px/1 'Maven Pro'">${J.bolt.replace('width="70" height="70"','width="56" height="56"')}Cambio inesperado</div></div>`);
// S4 · reacción ≠ autismo, calendario de frecuencia, rueda del día
add(CARD('rx',440)+`<div class="lbl" style="position:absolute;left:34px;top:28px">Una reacción intensa</div>`+PL('r1','Reacción intensa','left:34px;top:170px;background:#F9DEE3;color:#C0392B;font-size:48px;padding:26px 34px')+PL('r2','Autismo','right:34px;top:170px;background:#F3F0F8;border:3px dashed #8E86A6;color:#8E86A6;font-size:48px;padding:26px 34px')+
 `<svg style="position:absolute;left:0;top:0" width="800" height="440"><path id="ra" pathLength="1" d="M440 232H540" fill="none" stroke="#8E86A6" stroke-width="7" stroke-dasharray=".1 .1" stroke-dashoffset="1" stroke-linecap="round"/></svg><div id="rq" style="position:absolute;left:468px;top:190px;width:72px;height:72px;border-radius:50%;background:#2E2545;color:#fff;font:700 50px/72px Outfit;text-align:center;opacity:0">?</div></div>`);
const DAYS=['L','M','M','J','V','S','D'];const HITS=[3,9,10,16,22,25];
add(CARD('hm',660)+`<div class="lbl" style="position:absolute;left:34px;top:28px">Este mes</div><div id="hcn" class="pill" style="position:absolute;right:34px;top:14px;background:#2E2545;color:#fff;font-size:46px">×0</div>
 <div style="position:absolute;left:30px;top:100px;width:740px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;font:700 38px/1 'Maven Pro';color:#8E86A6">${DAYS.map(d=>`<span>${d}</span>`).join('')}</div>
 <div style="position:absolute;left:30px;top:156px;width:740px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px">${[...Array(28)].map((_,i)=>`<div style="height:88px;border-radius:18px;background:#F3F0F8;display:flex;align-items:center;justify-content:center">${HITS.includes(i)?`<i id="hh${HITS.indexOf(i)}" style="width:50px;height:50px;border-radius:50%;background:#C0392B;opacity:0"></i>`:''}</div>`).join('')}</div>
 <div id="hsl" class="sel" style="left:22px;top:146px;width:756px;height:480px"></div>
 ${PL('hpe','Persistente','left:400px;top:640px;transform:translateX(-50%);background:#F9DEE3;color:#C0392B;font-size:46px')}</div>`);
const RING=[['Mañana',-90],['Tarde',30],['Noche',150]];
add(CARD('rgc',600)+`<svg style="position:absolute;left:140px;top:30px" width="520" height="520" viewBox="-130 -130 260 260">${RING.map((r,i)=>{const a0=(r[1]+4)*Math.PI/180,a1=(r[1]+116)*Math.PI/180;return `<path id="sg${i}" d="M${100*Math.cos(a0)} ${100*Math.sin(a0)}A100 100 0 0 1 ${100*Math.cos(a1)} ${100*Math.sin(a1)}" fill="none" stroke="#C6BCE2" stroke-width="44" stroke-linecap="round"/>`;}).join('')}</svg>
 <div style="position:absolute;left:0;right:0;top:230px;text-align:center;font:700 56px/1.1 Outfit">Vida<br>cotidiana</div>
 ${RING.map((r,i)=>`<div id="rl${i}" class="pill" style="position:absolute;left:${[300,560,40][i]}px;top:${[20,360,360][i]}px;background:#fff;border:3px solid #2E2545;font-size:42px;opacity:0">${r[0]}</div>`).join('')}</div>`);
// S5 · cierre
add(`<div class="abs" id="trap" style="left:560px;top:1310px;transform:translateX(-50%);opacity:0"></div>`);
add(`<div class="abs pill" id="bnc" style="left:190px;top:690px;background:#F3F0F8;border:3px dashed #8E86A6;color:#8E86A6;font-size:56px;padding:20px 44px;opacity:0">Berrinche<span id="bnx" style="position:absolute;left:18px;top:50%;height:8px;width:0;background:#C0392B;border-radius:4px"></span></div>`);
add(`<div class="abs pill" id="tqp" style="left:560px;top:1330px;transform:translateX(-50%);background:#1E9E6A;color:#fff;font-size:50px;padding:20px 44px;display:flex;gap:14px;align-items:center;opacity:0">Tranquilidad ${J.ok}</div>`);
// S6 · CTA
const NT=[['Otra ruta','#F9DEE3',170,700,-3],['Plan cancelado','#F5E7D6',560,690,2],['Hora nueva','#E7E1F4',180,950,2],['Comida nueva','#fff',570,960,-2]];
NT.forEach((n,i)=>add(`<div class="abs" id="nt${i}" style="left:${n[2]}px;top:${n[3]}px;width:350px;height:210px;background:${n[1]};border:3px solid #2E2545;border-radius:14px;box-shadow:8px 10px 0 rgba(46,37,69,.12);display:flex;align-items:center;justify-content:center;text-align:center;padding:0 24px;font:700 50px/1.1 Outfit;transform:rotate(${n[4]}deg);opacity:0">${n[0]}</div>`));
add(`<div class="abs card" id="cmp" style="left:160px;top:1230px;width:800px;height:170px;display:flex;align-items:center;gap:22px;padding:0 30px;opacity:0"><div class="dot" style="position:relative;width:96px;height:96px;flex:none">${KIDA}</div><div id="ctx" style="flex:1;font:700 46px/1.1 'Maven Pro'"></div><span id="snb" style="width:92px;height:92px;border-radius:50%;background:#2E2545;display:flex;align-items:center;justify-content:center;flex:none">${J.plane}</span></div>`);
add(`<div class="abs end" id="end"><div class="abs" style="left:150px;width:840px;top:500px;text-align:center;font:700 70px/1.15 Outfit">Este video orienta y no diagnostica.</div>
 <div class="abs" style="left:160px;top:780px;width:800px;height:600px;background:#fff;border:2px solid #E3DCEF;border-radius:28px;box-shadow:0 22px 50px rgba(56,47,81,.12);display:flex;flex-direction:column;align-items:center;padding-top:84px;gap:24px;text-align:center"><div style="font:700 78px/1 Outfit">Karen Trujillo</div><div style="font:700 44px/1.2 'Maven Pro'">Neuropsicóloga · Cancún</div><div class="pill" style="background:#E7E1F4;font-size:42px;padding:18px 34px">Cédula 11009616</div><div class="pill" style="background:#2E2545;color:#fff;font-size:40px;padding:18px 34px;margin-top:6px">psicologakarentrujillo.com.mx</div></div></div>`);
add(`<div class="abs" id="ley" style="left:150px;top:190px;background:#fff;border:3px solid #2E2545;border-radius:999px;font:700 40px/1 'Maven Pro';padding:14px 30px;box-shadow:0 10px 24px rgba(56,47,81,.12);opacity:0">Neuropsicóloga Karen Trujillo</div>`);

// ============ LÍNEA DE TIEMPO ============
gsap.set('#world > *',{opacity:0});gsap.set('.sel',{opacity:0});
const tl=gsap.timeline({paused:true});
const POP=(s,t,d)=>tl.fromTo(s,{opacity:0,y:40,scale:.94},{opacity:1,y:0,scale:1,duration:d||.45,ease:CFG.POP,immediateRender:false},t);
const OUT=(s,t)=>tl.to(s,{opacity:0,y:-60,duration:.3,ease:CFG.OUT},t);
const IN=(s,t)=>tl.fromTo(s,{opacity:0},{opacity:1,duration:.3,immediateRender:false},t);
let cur=-1;
const STEP=(i,t)=>{if(cur>=0)tl.to('#st'+cur,{opacity:0,y:-20,duration:.25},t-.25);
 tl.fromTo('#st'+i,{opacity:0,y:20},{opacity:1,y:0,duration:.35,ease:CFG.POP,immediateRender:false},t);
 tl.to('#ticks',{y:-(i+1)*110,duration:.6,ease:CFG.MOVE},t-.25);
 tl.fromTo('#av',{scale:.8},{scale:1,duration:.35,ease:CFG.POP,immediateRender:false},t);cur=i;};
const TXT=(s,t,tx)=>tl.call(()=>{document.querySelector(s).innerHTML=tx;},null,t);
const CH=(s,t)=>tl.fromTo(s,{opacity:0,scale:.3},{opacity:1,scale:1,duration:.3,ease:CFG.POP,immediateRender:false},t);
const DRAW=(s,t,d)=>tl.to(s,{strokeDashoffset:0,duration:d||.5,ease:'power1.inOut'},t);

// ESCENA 1 · HOOK (0–5.3) — Acción: un mapa de navegación con la escuela y la casa; el niño recorre la ruta habitual (negra); aparece una señal «!»
//  y la ruta cambia por un desvío rojo; estalla una «!» roja y aparece «¿Por qué?».
// Persisten: mapa y niño (hilo; vuelven con el camino verde). Imagen final: desvío rojo, estallido y «¿Por qué?».
function escena1(){
 STEP(0,0);POP('#nav',0);
 DRAW('#ur',at('camino'),.9);
 tl.to('#trv',{top:260,duration:.45,ease:'none'},at('camino',.3));tl.to('#trv',{left:310,top:260,duration:.45,ease:'none'},at('camino',.75));
 CH('#sgn',at('tu hijo'));tl.to('#ur',{opacity:.25,duration:.3},at('tu hijo'));
 DRAW('#dt',at('hijo',.4),.8);tl.to('#trv',{left:310,top:410,duration:.4,ease:'none'},at('tuvo',.1));
 CH('#bst',at('reaccion'));tl.to('#bst',{scale:1.15,duration:.15,yoyo:true,repeat:3},at('reaccion',.3));
 POP('#qpq',at('por que'));
}
// ESCENA 2 · DESARROLLO (5.3–19.0) — Acción: tres fichas de rutina (Salir, Parque, Cena); la hora de salir pasa de 7:30 a 8:15; «Parque» se sella
//  «Cancelado» y cae, y entra un «Plan nuevo»; después, ondas: una gota chica para otros y ondas enormes en el niño.
// Persisten: niño (en las ondas). Imagen final: ondas grandes en torno al niño.
function escena2(){
 const t0=at('quiza');
 ['#nav','#qpq'].forEach(s=>OUT(s,t0-.3));STEP(1,t0);POP('#rut',t0);
 [0,1,2].forEach(i=>CH('#rt'+i,t0+.2+i*.2));
 TXT('#hr',at('salir'),'8:15');tl.fromTo('#hr',{scale:1.4},{scale:1,duration:.3,immediateRender:false},at('salir'));
 CH('#cnc',at('cancelaste',.4));tl.to('#rt1',{y:330,rotation:14,opacity:0,duration:.6,ease:CFG.OUT},at('esperaba'));OUT('#cnc',at('esperaba'));
 CH('#rtn',at('simplemente'));POP('#rtl',at('hacer algo'));
 const t1=at('para otros');
 OUT('#rut',t1-.3);POP('#rip',t1);
 IN('#rp0',t1);tl.fromTo('.rg0',{opacity:.9,scale:.4},{opacity:0,scale:1,duration:.9,immediateRender:false},at('para otros',.7));tl.fromTo('.rg0',{opacity:.9,scale:.4},{opacity:0,scale:1,duration:.9,immediateRender:false},at('pequeno'));
 IN('#rp1',at('pero para'));
 tl.fromTo('.rg1',{opacity:.9,scale:.2},{opacity:0,scale:1,duration:1.2,stagger:.25,repeat:1,immediateRender:false},at('representar'));
}
// ESCENA 3 · GIRO (19.0–36.7) — Acción: tablero «Primero–Luego–Después» con escuela, parque y casa; un escudo «Orden visible»; un «¡Cambio!» rojo cae en el
//  lugar del parque y todo tiembla («En el autismo»); dos conceptos: «Flexibilidad cognitiva» y «Regulación emocional».
// Persisten: tablero. Imagen final: dos conceptos con «Cambio inesperado».
function escena3(){
 const t0=at('algunos ninos');
 OUT('#rip',t0-.3);STEP(2,t0);POP('#brd',t0);
 [0,1,2].forEach(i=>{CH('#bc'+i,t0+.2+i*.25);IN('#bh'+i,t0+.2+i*.25);});
 POP('#ptg',at('previsibilidad'));CH('#shl',at('seguros'));tl.to('#ptg',{opacity:0,duration:.3},at('saber'));
 tl.to('#shl',{opacity:0,duration:.3},at('saber'));
 tl.to('#bc1',{boxShadow:'0 0 0 8px rgba(198,188,226,.8)',duration:.3,yoyo:true,repeat:1},at('ocurrira'));
 tl.to('#bc2',{boxShadow:'0 0 0 8px rgba(198,188,226,.8)',duration:.3,yoyo:true,repeat:1},at('despues'));
 const tc=at('en el autismo');
 tl.fromTo('#chg',{opacity:0,y:-300,rotation:-8},{opacity:1,y:0,rotation:0,duration:.45,ease:CFG.POP,immediateRender:false},at('inesperados',-.4));
 tl.to('#bc1',{opacity:0,duration:.2},at('inesperados',-.4));
 tl.to(['#bc0','#bc2','#chg'],{x:'+=10',duration:.07,yoyo:true,repeat:7},at('inesperados'));
 CH('#atm',tc);
 const t1=at('esto puede');
 OUT('#brd',t1-.3);POP('#cpt',t1);IN('#cbt',t1);
 CH('#cp0',at('flexibilidad'));CH('#cp1',at('regulacion'));
}
// ESCENA 4 · PROVOCACIÓN (36.7–46.5) — Acción: «Reacción intensa» y «Autismo» unidos por una flecha punteada con «?»; un calendario del mes con seis
//  puntos rojos y contador ×6 (frecuencia); una rueda del día con tres tramos (Mañana, Tarde, Noche) que se tiñen.
// Persisten: calendario. Imagen final: rueda con tramos afectados.
function escena4(){
 const t0=at('pero no hay');
 OUT('#cpt',t0-.3);STEP(3,t0);POP('#rx',t0);
 CH('#r1',t0+.2);CH('#r2',at('significa'));DRAW('#ra',at('significa'),.6);CH('#rq',at('autismo',0,1));
 const t1=at('tambien conviene');
 OUT('#rx',t1-.3);POP('#hm',t1);
 const o={v:0};
 [0,1,2,3,4,5].forEach(i=>{tl.fromTo('#hh'+i,{opacity:0,scale:.3},{opacity:1,scale:1,duration:.3,ease:CFG.POP,immediateRender:false},at('frecuentes')+i*.3);});
 tl.to(o,{v:6,duration:1.8,ease:'none',onUpdate(){document.getElementById('hcn').textContent='×'+Math.round(o.v);}},at('frecuentes'));
 const t2=at('como afectan');
 OUT('#hm',t2-.3);POP('#rgc',t2);
 [0,1,2].forEach(i=>CH('#rl'+i,t2+.2+i*.2));
 tl.to(['#sg0','#sg2'],{attr:{stroke:'#F2A3A3'},duration:.4},at('vida'));tl.to('#sg1',{attr:{stroke:'#F2A3A3'},duration:.4},at('cotidiana'));
}
// ESCENA 5 · CIERRE (46.5–61.5) — Acción: el tablero vuelve y el parque llega como «Parque nuevo» con aviso (campana); el calendario vuelve con
//  «Persistente» y una selección; el mapa vuelve con el camino verde y «Tranquilidad»; «Berrinche» se tacha.
// Persisten: tablero → calendario → mapa. Imagen final: camino verde con «Tranquilidad» y «Berrinche» tachado.
function escena5(){
 const t0=at('anticipar');
 OUT('#rgc',t0-.3);STEP(4,t0);
 tl.fromTo('#brd',{opacity:0,y:40,scale:.94},{opacity:1,y:0,scale:1,duration:.45,ease:CFG.POP,immediateRender:false},t0);
 tl.set(['#chg','#atm'],{opacity:0},t0);tl.set('#bc1',{opacity:0},t0);tl.set('#bc0,#bc2',{x:0},t0);
 CH('#nwc',at('apoyos'));POP('#ant',at('visuales'));
 const t1=at('si la dificultad');
 OUT('#brd',t1-.3);OUT('#ant',t1-.3);
 tl.fromTo('#hm',{opacity:0,y:40,scale:.94},{opacity:1,y:0,scale:1,duration:.45,ease:CFG.POP,immediateRender:false},t1);
 CH('#hpe',at('persistente'));
 tl.fromTo('#hsl',{opacity:0},{opacity:1,duration:.3,immediateRender:false},at('explorar'));
 const t2=at('comprender');
 OUT('#hm',t2-.3);
 tl.fromTo('#nav',{opacity:0,y:40,scale:.94},{opacity:1,y:0,scale:1,duration:.45,ease:CFG.POP,immediateRender:false},t2);
 tl.set(['#sgn','#bst','#qpq','#dt'],{opacity:0},t2);tl.set('#ur',{opacity:0},t2);tl.set('#trv',{left:110,top:410},t2);
 DRAW('#gr',at('necesidad'),1.5);
 tl.to('#trv',{top:260,duration:.4,ease:'none'},at('necesidad'));tl.to('#trv',{left:310,duration:.4,ease:'none'},at('necesidad',.4));tl.to('#trv',{top:110,duration:.4,ease:'none'},at('necesidad',.8));tl.to('#trv',{left:510,duration:.4,ease:'none'},at('necesidad',1.2));
 CH('#clm',at('previsibilidad',0,1));POP('#tqp',at('previsibilidad',0,1));
 POP('#bnc',at('berrinche',-.4));tl.to('#bnx',{width:'calc(100% - 36px)',duration:.5,ease:'power2.out'},at('berrinche'));
}
// ESCENA 6 · CTA (61.5–66.5) — Acción: cuatro notas adhesivas con cambios (Otra ruta, Plan cancelado, Hora nueva, Comida nueva); una línea que se escribe
//  «Cuando cambia…» con botón de enviar; aviso final y datos de Karen (quietos el último 0.5 s). Imagen final: aviso + datos.
function escena6(){
 const t0=at('que cambios');
 ['#nav','#tqp','#bnc'].forEach(s=>OUT(s,t0-.3));tl.to('#st4',{opacity:0,duration:.3},t0-.3);
 [0,1,2,3].forEach(i=>POP('#nt'+i,t0+i*.25));
 tl.to('#nt1',{scale:1.06,duration:.2,yoyo:true,repeat:1},at('dificultad',0,1)+.2);
 const tc=at('cuentamelo');
 POP('#cmp',tc-.7);
 const w='Cuando cambia...';[...w].forEach((c,i)=>TXT('#ctx',tc-.2+i*.045,w.slice(0,i+1)));
 tl.to('#snb',{backgroundColor:'#1E9E6A',duration:.2},at('en comentarios'));
 const tF=at('comentarios',.4);
 [0,1,2,3].forEach(i=>OUT('#nt'+i,tF-.1));OUT('#cmp',tF-.1);
 tl.to(['#av','#tlTop','#tl','#ticks'],{opacity:.25,duration:.3},tF);tl.to('#ley',{opacity:0,duration:.3},tF);
 tl.fromTo('#end',{opacity:0,scale:.96},{opacity:1,scale:1,duration:.45,ease:CFG.POP,immediateRender:false},tF+.1);
}
escena1();escena2();escena3();escena4();escena5();escena6();
tl.fromTo('#ley',{opacity:0,y:-10},{opacity:1,y:0,duration:.5,immediateRender:false},.3);

// ============ SUBTÍTULO ARRIBA (palabras por venir borrosas; clave en recuadro de selección) ============
const KEYS=new Set(['camino','reaccion','pequeno','dificil','previsibilidad','seguros','inesperados','flexibilidad','regulacion','frecuentes','cotidiana','anticipar','visuales','persistente','necesidad','berrinche','comentarios']);
(function(){const ph=[];let cur=[];const fl=()=>{if(cur.length){ph.push(cur);cur=[];}};
 WORDS.forEach((w,i)=>{cur.push({w:w[0],t:w[1],e:w[2]});const nx=WORDS[i+1];if(cur.length>=6||/[,.:?]$/.test(w[0])||(nx&&nx[1]-w[2]>.45))fl();});fl();
 const C=document.getElementById('caps');
 ph.forEach((p,i)=>{const d=document.createElement('div');d.className='ph abs';d.id='ph'+i;
  d.innerHTML=p.map((x,j)=>{const k=KEYS.has(norm(x.w)[0]);return `<span class="${k?'k':''}" id="p${i}w${j}">${k?'<i class="hl"></i>':''}${x.w}</span>`;}).join('');C.appendChild(d);
  const s0=p[0].t-.12,e0=i+1<ph.length?ph[i+1][0].t-.12:WORDS[WORDS.length-1][2]+.4;
  tl.fromTo(d,{opacity:0,y:16},{opacity:1,y:0,duration:.18,immediateRender:false},s0);tl.to(d,{opacity:0,duration:.12},e0-.12);
  p.forEach((x,j)=>{tl.fromTo('#p'+i+'w'+j,{opacity:.28,filter:'blur(7px)'},{opacity:1,filter:'blur(0px)',duration:.2,immediateRender:false},x.t);
   if(KEYS.has(norm(x.w)[0]))tl.fromTo('#p'+i+'w'+j+' .hl',{opacity:0,scaleX:.6},{opacity:1,scaleX:1,duration:.22,ease:CFG.POP,immediateRender:false},x.t);});
  gsap.set(d.querySelectorAll('span'),{opacity:.28,filter:'blur(7px)'});});
})();
window.DUR=CFG.DUR;
window.seek=t=>{tl.time(Math.min(t,tl.duration()));};
</script></body></html>
