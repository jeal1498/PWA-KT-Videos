  "name": "Organiza tus pendientes",
  "ig": "Deja de confiar en tu memoria.\n\n3 formas de organizar tus pendientes:\n\n1. Usa un único lugar para anotarlos: una libreta, una app o una lista en tu celular.\n2. Convierte cada pendiente en una acción concreta. En lugar de «hacer trámites», escribe «buscar los documentos para el trámite».\n3. Si algo tiene un horario específico, configura una alarma con información útil: «salir de casa para la cita», con el tiempo que necesitas para llegar.\n\nEstas herramientas pueden servir a muchas personas, incluidas algunas con TDAH. Cada quien necesita un sistema que pueda mantener. Si olvidas el tuyo, hazlo más visible o más sencillo.\n\nGuarda este video y elige una estrategia para probarla esta semana.\n\nKaren Trujillo, Neuropsicóloga Clínica\npsicologakarentrujillo.com.mx\n\n#TDAH #neuropsicologia #organizacion #saludmental #psicologia #pendientes #Cancun",

 {
  "n": "02",
  "name": "No todo olvido es TDAH",
  "ig": "No todo olvido es TDAH.\n\nEntrar a una habitación y no recordar para qué, perder el hilo de una conversación o no saber dónde dejaste algo. Los olvidos y las distracciones pueden aparecer con TDAH, y también se relacionan con dormir poco, estrés, ansiedad, sobrecarga y otras dificultades.\n\nCuando un profesional evalúa un posible TDAH en adultos, necesita:\n- conocer tu historia\n- identificar síntomas persistentes\n- explorar cómo se presentan en distintos contextos\n- valorar si afectan tu vida diaria\n- considerar otras explicaciones posibles\n\nPor eso, un video o una lista de síntomas no pueden confirmar un diagnóstico. Si tus olvidos interfieren con tu trabajo, tus relaciones o tus actividades diarias, vale la pena buscar una valoración profesional.\n\nMientras tanto, prueba anotar tus pendientes en un lugar en vez de confiar solo en tu memoria.\n\n¿Qué te ayuda más a recordar? Escribirlo, usar alarmas o dejar recordadores visibles. Cuéntame en los comentarios.\n\nKaren Trujillo, Neuropsicóloga Clínica\npsicologakarentrujillo.com.mx\n\n#TDAH #TDAHadultos #neuropsicologia #saludmental #olvidos #memoria #Cancun",

 {
  "n": "03",
  "name": "Solo una tarea, no diez",
  "ig": "Solo una tarea, no diez.\n\nSi tienes una lista enorme de pendientes y no sabes por dónde empezar, prueba esto hoy:\n\n1. Elige una tarea. Solo una.\n2. Pregúntate cuál es la acción más pequeña que te acerca a terminarla. Si tienes que estudiar, quizá sea abrir el documento. Si tienes que lavar la ropa, ponerla en la lavadora. Si tienes que responder un correo, abrirlo y escribir la primera frase.\n3. Dedícale dos minutos a ese primer paso.\n\nLos dos minutos no son una obligación de terminar. Son una forma de hacer que el comienzo parezca más manejable. Si después quieres continuar, puedes hacerlo. Si necesitas parar, también, y puedes revisar qué se te está dificultando para avanzar.\n\nEsta estrategia no funciona igual para todas las personas ni resuelve por sí sola las dificultades del TDAH, pero puede ayudarte a experimentar con una forma diferente de iniciar.\n\nGuarda este video para tu próximo día de muchos pendientes y cuéntame qué tarea vas a dividir en un primer paso.\n\nKaren Trujillo, Neuropsicóloga Clínica\npsicologakarentrujillo.com.mx\n\n#TDAH #pendientes #organizacion #neuropsicologia #saludmental #procrastinacion #Cancun",
  "tk": "Solo una tarea, no diez. Elige una, busca la acción más pequeña y dale dos minutos. Guárdalo para tu próximo día de muchos pendientes. ¿Qué tarea vas a dividir?\n\n#TDAH #pendientes #organizacion #neuropsicologia #saludmental #procrastinacion #Cancun",
  "yt": "Cómo empezar cuando tienes muchos pendientes: solo una tarea",

 },
 {
  "n": "04",
  "name": "10 minutos que se vuelven una hora",
  "ig": "10 minutos que se vuelven una hora.\n\n¿Te ha pasado que piensas que una tarea te va a tomar 10 minutos y cuando vas a hacerlo ya pasó más de una hora? ¿O que calculas que puedes hacer 5 cosas antes de salir y terminas corriendo y llegando tarde?\n\nA algunas personas con TDAH les cuesta estimar cuánto tiempo requieren las actividades, cambiar de una tarea a otra o anticipar todos los pasos que necesitan completar. Pero tener problemas con el tiempo no significa automáticamente tener TDAH. Hay que considerar el contexto y, si existe una sospecha, hacer una valoración adecuada.\n\nUna estrategia: en lugar de preguntarte solo a qué hora necesitas salir, planifica hacia atrás. Si necesitas salir a las 8, calcula primero cuánto tardas en vestirte, desayunar, preparar tus cosas y llegar a la puerta. Después añade un margen para imprevistos.\n\nAl principio, registra cuánto tardas realmente en tus actividades más frecuentes. Esa información te sirve para planear cada día.\n\nNo se trata de exigirte que seas perfecto con el tiempo, sino de construir un sistema que te ayude a anticiparlo mejor.\n\n¿Qué te cuesta más? ¿Calcular cuánto tardas o dejar una actividad para pasar a la otra? Te leo en comentarios.\n\nKaren Trujillo, Neuropsicóloga Clínica\npsicologakarentrujillo.com.mx\n\n#TDAH #manejodeltiempo #organizacion #neuropsicologia #saludmental #puntualidad #Cancun",
  "tk": "10 minutos que se vuelven una hora. Planifica hacia atrás: parte de la hora de salida, suma cada paso y añade margen. ¿Qué te cuesta más: calcular el tiempo o cambiar de actividad? Te leo.\n\n#TDAH #manejodeltiempo #organizacion #neuropsicologia #saludmental #puntualidad #Cancun",
  "yt": "Calcular el tiempo con TDAH: planifica hacia atrás",
  "pub": true,

 {
  "n": "05",
  "name": "Planifica tu salida",
  "ig": "Para salir a las 9, empieza a las 8:05.\n\nSi necesitas salir de casa a las 9 y casi siempre terminas saliendo tarde, prueba este ejercicio.\n\nImagina que necesitas:\n- 10 minutos para vestirte\n- 15 para desayunar\n- 10 para preparar tus cosas\n- 20 para llegar a tu destino\n\nEn lugar de empezar a prepararte a las 8:30 porque piensas que tienes tiempo suficiente, suma primero todas las actividades. En este ejemplo son 55 minutos, así que tendrías que comenzar antes de las 8:05, y todavía convendría añadir un margen para imprevistos.\n\nAhora viene la parte importante: durante varios días registra cuánto tardas realmente. Quizá desayunar te toma 20 minutos o preparar tus cosas te lleva menos de lo que pensabas. Con esos datos puedes ajustar tus cálculos a tu propia rutina.\n\nSi las transiciones te cuestan, también puedes usar una alarma para avisarte cuando necesites pasar al siguiente paso.\n\nEsta herramienta puede ayudarte a planificar, aunque no elimina por sí sola todas las dificultades de gestión del tiempo.\n\nGuarda el ejemplo y dime cuántos minutos extra necesitas para salir de casa.\n\nKaren Trujillo, Neuropsicóloga Clínica\npsicologakarentrujillo.com.mx\n\n#TDAH #manejodeltiempo #rutina #organizacion #neuropsicologia #saludmental #Cancun",
  "tk": "Para salir a las 9, empieza a las 8:05. Suma cada actividad, registra cuánto tardas de verdad y añade margen. ¿Cuántos minutos extra necesitas tú? Guárdalo.\n\n#TDAH #manejodeltiempo #rutina #organizacion #neuropsicologia #saludmental #Cancun",

 {
  "n": "06",
  "name": "Cambia la pregunta que te haces",
  "ig": "Cambia la pregunta que te haces.\n\nLa próxima vez que te descubras evitando una tarea, en lugar de preguntarte «¿por qué soy tan flojo?», prueba con «¿qué parte de esta tarea me está costando?».\n\nPuede que no sepas por dónde empezar, que haya demasiados pasos, que estés muy cansado, que haya muchas distracciones o que no tengas clara la prioridad. Cada situación necesita una solución diferente:\n\n1. Si no sabes por dónde empezar, escribe el primer paso.\n2. Si hay demasiados pasos, divide las actividades en partes pequeñas.\n3. Si te distraes con facilidad, prepara un espacio con menos interrupciones.\n4. Si estás muy agotado, revisa si necesitas descansar o ajustar tus expectativas para ese día.\n\nEstas estrategias no sustituyen una evaluación ni garantizan que una dificultad desaparezca, pero pueden ayudarte a observar lo que ocurre y a responder de manera más adecuada. Si estas dificultades son persistentes y afectan varias áreas de tu vida, puede ser útil consultar con un profesional.\n\nNo necesitas insultarte para mejorar. Puedes reconocer una dificultad y, al mismo tiempo, buscar maneras de trabajar en ella.\n\nGuarda este video para recordarlo la próxima vez que te sientas bloqueado.\n\nKaren Trujillo, Neuropsicóloga Clínica\npsicologakarentrujillo.com.mx\n\n#TDAH #neuropsicologia #saludmental #psicologia #Cancun #procrastinacion #productividad #autocompasion",
  "tk": "Cambia la pregunta que te haces. En lugar de «¿por qué soy tan flojo?», prueba con «¿qué parte de esta tarea me está costando?». Guárdalo para cuando te sientas bloqueado.\n\n#TDAH #neuropsicologia #saludmental #psicologia #Cancun #procrastinacion #productividad #autocompasion",

 {
  "n": "07",
  "name": "Reducir todo a flojera no ayuda",
  "ig": "Reducir todo a flojera no ayuda.\n\n«Eres flojo. Si de verdad quisieras, ya lo habrías hecho. Solo necesitas organizarte mejor.» Muchas personas adultas con TDAH llevan años escuchando frases como estas.\n\nEl TDAH es una condición del neurodesarrollo que puede afectar:\n- la atención\n- el control de impulsos\n- la organización\n- la planificación\n- la regulación de la conducta\n\nPor eso no se explica simplemente por falta de voluntad. Una persona puede tener muchas ganas de cumplir con sus responsabilidades y aun así tener dificultades persistentes para empezar tareas, recordar instrucciones o administrar el tiempo.\n\nEso no significa que todas las dificultades se deban al TDAH. No toda la procrastinación o desorganización indica TDAH, y el diagnóstico requiere una valoración clínica completa.\n\nEn vez de preguntarnos únicamente por qué no lo hace, podemos empezar con otra pregunta: ¿qué parte de esta tarea está siendo difícil y qué apoyo podría facilitarla?\n\nComprender la dificultad no elimina la responsabilidad. Nos permite buscar soluciones más útiles y menos culpabilizantes.\n\nComparte este video con alguien que necesite escuchar que comprender también es parte del cambio.\n\nKaren Trujillo, Neuropsicóloga Clínica\npsicologakarentrujillo.com.mx\n\n#TDAH #TDAHadultos #neuropsicologia #saludmental #psicologia #Cancun #procrastinacion #neurodesarrollo",
  "tk": "Reducir todo a flojera no ayuda. El TDAH no se explica simplemente por falta de voluntad, y tampoco toda la desorganización indica TDAH: el diagnóstico requiere una valoración clínica. Cambia la pregunta: ¿qué apoyo podría facilitar esta tarea? Comparte con alguien que necesite escucharlo.\n\n#TDAH #TDAHadultos #neuropsicologia #saludmental #psicologia #Cancun #procrastinacion #neurodesarrollo",
  "yt": "Reducir todo a flojera no ayuda a comprender el TDAH",

 {
  "n": "08",
  "name": "Otra vez sin encontrar tus llaves",
  "ig": "¿Otra vez has salido tarde porque no encontrabas las llaves, la cartera o el celular que acababas de tener en la mano?\n\nSi te pasa con frecuencia, sabes lo frustrante que puede ser empezar el día buscando tus cosas por toda la casa. Las dificultades de atención pueden contribuir a que algunas personas extravíen objetos con frecuencia. Puede ocurrir con TDAH y también tener otras explicaciones.\n\nUna estrategia es crear una estación de salida:\n\n1. Elige un lugar fijo cerca de la puerta o en un sitio que uses todos los días.\n2. Coloca ahí tus llaves, la cartera y tus objetos esenciales cada vez que llegues a casa.\n3. Procura que sea un lugar visible, accesible y fácil de usar.\n\nSi guardarlo en un cajón hace que después lo olvides, quizá te convenga una bandeja abierta o un gancho. Al principio puedes poner una nota visual para recordar dónde va cada cosa.\n\nNo necesitas depender de la memoria en cada momento. Puedes diseñar tu entorno para que te resulte más fácil encontrar tus pertenencias.\n\nDime en los comentarios qué objetos pierdes con más frecuencia.\n\nKaren Trujillo, Neuropsicóloga Clínica\npsicologakarentrujillo.com.mx\n\n#TDAH #neuropsicologia #saludmental #psicologia #Cancun #organizacion #rutinas #habitos",
  "tk": "¿Otra vez sin encontrar tus llaves? Crea una estación de salida: un lugar fijo, visible y fácil de usar. Cuéntame en los comentarios qué objetos pierdes más.\n\n#TDAH #neuropsicologia #saludmental #psicologia #Cancun #organizacion #rutinas #habitos",

  "name": "Otra vez sin encontrar tus llaves (gráficos)",
  "ig": "¿Otra vez has salido tarde porque no encontrabas las llaves, la cartera o el celular que acababas de tener en la mano?\n\nSi te pasa con frecuencia, sabes lo frustrante que puede ser empezar el día buscando tus cosas por toda la casa. Las dificultades de atención pueden contribuir a que algunas personas extravíen objetos con frecuencia. Puede ocurrir con TDAH y también tener otras explicaciones.\n\nUna estrategia es crear una estación de salida:\n\n1. Elige un lugar fijo cerca de la puerta o en un sitio que uses todos los días.\n2. Coloca ahí tus llaves, la cartera y tus objetos esenciales cada vez que llegues a casa.\n3. Procura que sea un lugar visible, accesible y fácil de usar.\n\nSi guardarlo en un cajón hace que después lo olvides, quizá te convenga una bandeja abierta o un gancho. Al principio puedes poner una nota visual para recordar dónde va cada cosa.\n\nNo necesitas depender de la memoria en cada momento. Puedes diseñar tu entorno para que te resulte más fácil encontrar tus pertenencias.\n\nDime en los comentarios qué objetos pierdes con más frecuencia.\n\nKaren Trujillo, Neuropsicóloga Clínica\npsicologakarentrujillo.com.mx\n\n#TDAH #neuropsicologia #saludmental #psicologia #Cancun #organizacion #rutinas #habitos",

 {
  "n": "10",
  "name": "Un lugar fijo para cada objeto",
  "ig": "Un lugar fijo para cada objeto.\n\nSi pierdes constantemente tus llaves, tu cartera o tus audífonos, prueba estos tres cambios:\n\n1. Asigna un lugar fijo a cada objeto. Un espacio específico para cada cosa, en lugar de una zona general donde todo termina amontonado.\n2. Haz que ese lugar sea visible y cómodo. Si tienes que abrir tres cajones para guardar algo, es posible que el sistema sea demasiado complicado para tu rutina.\n3. Crea una pequeña revisión antes de salir. Pregúntate «¿qué tengo?»: las llaves, el celular, la cartera y lo que necesitas para la siguiente actividad. Puedes colocar una lista cerca de la puerta para no tener que recordar cada elemento desde cero.\n\nUn detalle importante: si cambias de lugar tus objetos constantemente, el sistema pierde parte de su utilidad. Mantén el mismo punto de referencia durante varios días y observa si te ayuda.\n\nEstas ideas pueden beneficiar a muchas personas, tengan o no TDAH. No son una prueba diagnóstica ni una solución universal.\n\nGuarda este video y elige un objeto al que le vas a asignar un lugar fijo hoy.\n\nKaren Trujillo, Neuropsicóloga Clínica\npsicologakarentrujillo.com.mx\n\n#TDAH #neuropsicologia #saludmental #psicologia #Cancun #organizacion #rutinas #habitos",

  "name": "La hiperactividad en adultos se ve diferente",
  "ig": "¿Creías que una persona con TDAH siempre tiene que estar corriendo o saltando?\n\nEn adultos, la hiperactividad puede verse muy diferente. Por ejemplo, estar en una reunión y mover constantemente las piernas, jugar con algún objeto o sentir que necesitas hacer varias cosas al mismo tiempo. En algunos adultos aparece como una inquietud interna, dificultad para permanecer quietos o una sensación persistente de tener que estar haciendo algo.\n\nAquí está el detalle importante: reconocer una de estas conductas no significa que tengas TDAH. Un profesional necesita explorar el conjunto de síntomas, su persistencia, su historia desde la infancia, cómo aparecen en distintos contextos y si generan dificultades importantes en la vida cotidiana. También debe considerar otras posibles explicaciones.\n\nEl TDAH no se ve igual en todas las personas y no todas experimentan la misma combinación de síntomas.\n\nSi quieres aprender a distinguir las experiencias cotidianas de las señales que requieren una evaluación, sigue esta cuenta. Hablaremos del TDAH en adultos con información clara y sin etiquetas.\n\nEste video orienta y no diagnostica.\n\nKaren Trujillo, Neuropsicóloga Clínica\npsicologakarentrujillo.com.mx\n\n#TDAH #neuropsicologia #saludmental #psicologia #Cancun #TDAHadultos #hiperactividad",

  "name": "Antes de pensar en TDAH, tres preguntas",
  "ig": "¿Te cuesta estar quieto incluso cuando necesitas descansar?\n\nAntes de atribuirlo al TDAH, observa estas tres cosas:\n\n1. ¿Te ocurre ocasionalmente o es una experiencia persistente? Estar inquieto después de tomar un café o durante una semana estresante no cuenta la misma historia que un patrón duradero.\n2. ¿En qué situaciones ocurre? Observa si aparece en el trabajo, en la casa, durante una conversación o en momentos en los que necesitas permanecer quieto.\n3. ¿Desde cuándo sucede y qué consecuencias tiene? Para evaluar el TDAH, la historia de la infancia y el impacto en la vida cotidiana son muy importantes.\n\nPuedes anotar durante varios días qué ocurrió, en qué contexto, cómo te sentías y si afectó una actividad importante. No es una prueba diagnóstica. Es una forma de organizar información que podría ayudarte a explicar lo que experimentas, y no necesitas ponerte una etiqueta para empezar a observarte con curiosidad.\n\nSi estas dificultades son persistentes y afectan tu vida, busca orientación profesional.\n\nGuarda este ejercicio si quieres entender mejor tus patrones.\n\nEste video orienta y no diagnostica.\n\nKaren Trujillo, Neuropsicóloga Clínica\npsicologakarentrujillo.com.mx\n\n#TDAH #neuropsicologia #saludmental #psicologia #Cancun #TDAHadultos #autoobservacion",

async function copyText(text){
  try{await navigator.clipboard.writeText(text);return true}catch(e){}
  const a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();return ok;
}

async function copyNet(btn,net,text,hint){
  const label=btn.innerHTML;
  const ok=await copyText(text);
  if(ok){btn.classList.add('done');btn.innerHTML=CHECK;hint.className='hint';hint.textContent='Texto de '+net+' copiado. Pégalo en la descripción.';setTimeout(()=>{btn.classList.remove('done');btn.innerHTML=label},3000)}
  else{hint.className='hint err';hint.textContent='No se pudo copiar el texto de '+net+'.'}
}
